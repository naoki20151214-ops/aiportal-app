<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">AIサービスは同じ条件で比較しよう</title><desc id="d">Claudeと他の会話AIへ同じお知らせの条件を渡し事実と読みやすさで比較する図</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" fill="none" stroke="#7299b8" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="#fafcff"/><circle cx="1131" cy="60" r="155" fill="#edf6ff"/><circle cx="85" cy="610" r="130" fill="#fff4e2"/><g><text x="600" y="78" text-anchor="middle" font-size="38" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">AIサービスは同じ条件で比較しよう</text><rect x="54" y="170" width="519" height="145" rx="23" fill="#e6f2ff" stroke="#b7d1dd" stroke-width="2.3"/><text x="313.5" y="231" text-anchor="middle" font-size="26" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">Claudeに同じ指示を渡す</text><text x="313.5" y="270" text-anchor="middle" font-size="26" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">日曜10時・北門未定</text><rect x="629" y="170" width="519" height="145" rx="23" fill="#eeebff" stroke="#b7d1dd" stroke-width="2.3"/><text x="888.5" y="231" text-anchor="middle" font-size="26" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">別のAIへ同じ指示を渡す</text><text x="888.5" y="270" text-anchor="middle" font-size="26" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">日曜10時・北門未定</text><rect x="119" y="376" width="960" height="148" rx="23" fill="#e5f7ee" stroke="#b7d1dd" stroke-width="2.3"/><text x="599" y="438.5" text-anchor="middle" font-size="26" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">同じ評価表で確認</text><text x="599" y="477.5" text-anchor="middle" font-size="26" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Goth