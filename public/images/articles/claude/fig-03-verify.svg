<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">AIの案内文で、どこを確認する？</title><desc id="d">指定した時刻と持ち物は正しく北門の表記は未確認なので消すという例</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" fill="none" stroke="#7299b8" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="#fafcff"/><circle cx="1131" cy="60" r="155" fill="#edf6ff"/><circle cx="85" cy="610" r="130" fill="#fff4e2"/><g><text x="600" y="78" text-anchor="middle" font-size="38" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">AIの案内文で、どこを確認する？</text><rect x="62" y="159" width="514" height="173" rx="23" fill="#fff0e7" stroke="#b7d1dd" stroke-width="2.3"/><text x="319" y="234" text-anchor="middle" font-size="26" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">AIの案内案</text><text x="319" y="273" text-anchor="middle" font-size="26" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">10時・軍手・北門</text><rect x="625" y="159" width="514" height="173" rx="23" fill="#e8f3ff" stroke="#b7d1dd" stroke-width="2.3"/><text x="882" y="234" text-anchor="middle" font-size="26" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">元の正式資料</text><text x="882" y="273" text-anchor="middle" font-size="26" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">10時・軍手・場所未定</text><path d="M596 249L612 249" stroke="#7299b8" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><rect x="221" y="418" width="752" height="116" rx="23" fill="#e4f6ed" stroke="#b7d1dd" stroke-width="2.3"/><text x="597" y="464.5" text-anchor="middle" font-size="26" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">「北門」は根拠がない</text><text x="597" y="503.5" text-anchor="