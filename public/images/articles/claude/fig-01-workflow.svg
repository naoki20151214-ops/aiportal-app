f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">③ 人が確認</text><text x="802.5" y="303.5" text-anchor="middle" font-size="26" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">日時・出典</text><path d="M926 278L966 278" stroke="#7299b8" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><rect x="978" y="196" width="177" height="160" rx="23" fill="#e5f6ed" stroke="#b7d1dd" stroke-width="2.3"/><text x="1066.5" y="264.5" text-anchor="middle" font-size="26" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">④ 直す</text><text x="1066.5" y="303.5" text-anchor="middle" font-size="26" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">書き直し</text><rect x="187" y="432" width="844" height="94" rx="23" fill="#e8f2ff" stroke="#b7d1dd" stroke-width="2.3"/><text x="609" y="487" text-anchor="middle" font-size="26" fill="#20435f" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">最終決定は、元の情報を知る人間が行う</text><text x="600" y="634" text-anchor="middle" font-size="19" fill="#687f8e" font-weight="700" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">AI Portal｜説明用の架空の例・概念図</text></g></svg>