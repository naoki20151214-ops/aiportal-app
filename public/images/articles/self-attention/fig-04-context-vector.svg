<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">文字ではなくベクトルが変わる</title><desc id="d">それという文字を帽子に交換するのではなく、数値表現を変換する</desc><defs><linearGradient id="g"><stop stop-color="#f5faff"/><stop offset="1" stop-color="#eff9f5"/></linearGradient><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5791b9" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#g)"/><g font-family="'Noto Sans JP',-apple-system,BlinkMacSystemFont,Meiryo,sans-serif"><text x="600" y="77" text-anchor="middle" font-size="40" font-weight="700" fill="#17395a">文字ではなくベクトルが変わる</text><text x="600" y="123" text-anchor="middle" font-size="22" font-weight="700" fill="#64819a">Token IDはそのまま、内部の数値表現を加工する</text><rect x="77" y="214" width="295" height="264" rx="23" fill="#e8f4ff" stroke="#aac9e4" stroke-width="3"/><text x="224" y="277" text-anchor="middle" font-size="27" font-weight="700" fill="#17395a">入力</text><text x="224" y="349" text-anchor="middle" font-size="43" font-weight="700" fill="#2264a0">「それ」</text><text x="224" y="419" text-anchor="middle" font-size="24" font-weight="700" fill="#537994">初期の表現</text><path d="M383 344 H461" stroke="#5791b9" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#a)"/><rect x="479" y="240" width="241" height="220" rx="23" fill="#fff" stroke="#b9d5e6" stroke-width="3"/><text x="600" y="321" text-anchor="middle" font-size="27" font-weight="700" fill="#17395a">Self-Attention</text><text x="600" y="400" text-anchor="middle" font-size="25" font-weight="700" fill="#607993">数値の計算</text><path d="M733 344 H810" stroke="#5791b9" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#a)"/><rect x="829" y="214" width="295" height="264" rx="23" fill="#e6f6eb" stroke="#a5d5b9" stroke-width="3"/><text x="977" y="277" text-anchor="middle" font-size="27" font-weight="700" fill="#17395a">計算後</text><text x="977" y="349" text-anchor="middle" font-size="43" font-weight="700" fill="#237957">「それ」</text><text x="977" y="419" text-anchor="middle" font-size="24" font-weight="700" fill="#51846b">文脈を反映</text><text x="600" y="574" text-anchor="middle" font-size="27" font-weight="700" fill="#3e738a">文字の置き換えではありません</text><text x="600" y="640" text-anchor="middle" font-size="17" font-weight="700" fill="#788a99">AI Portal ｜ 学習のための模式図。実際のAttentionの数値ではありません。</text></g></svg>