<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">数字の情報を取り込むまで</title><desc id="chart-desc">赤いの位置と帽子の位置から、参照の重みを計算して、帽子位置の数値表現の更新に利用する。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#eff9f6"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#457db1" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',-apple-system,BlinkMacSystemFont,Meiryo,sans-serif"><text x="600" y="82" text-anchor="middle" font-size="40" fill="#15385c" font-weight="750">数字の情報を取り込むまで</text><text x="600" y="126" text-anchor="middle" font-size="22" fill="#647e93" font-weight="550">参照の重みを計算 → 数値情報を組み合わせる</text><rect x="50" y="191" width="291" height="270" rx="22" fill="#fff0ed" stroke="#edb0a7" stroke-width="3"/><text x="195" y="257" text-anchor="middle" font-size="26" fill="#a64d49" font-weight="750">「赤い」の位置</text><text x="195" y="324" text-anchor="middle" font-size="31" fill="#a44d49" font-weight="750">数値情報</text><text x="195" y="388" text-anchor="middle" font-size="23" fill="#ae7069" font-weight="750">（ベクトル）</text><rect x="455" y="191" width="291" height="270" rx="22" fill="#e9f5ff" stroke="#a5c9e4" stroke-width="3"/><text x="600" y="257" text-anchor="middle" font-size="26" fill="#286b9a" font-weight="750">「帽子」の位置</text><text x="600" y="324" text-anchor="middle" font-size="31" fill="#286b9a" font-weight="750">数値表現</text><text x="600" y="388" text-anchor="middle" font-size="23" fill="#587d9c" font-weight="750">（ベクトル）</text><path d="M347 326 H446" stroke="#5483ac" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><rect x="862" y="191" width="286" height="270" rx="22" fill="#e7f7ef" stroke="#9bceb7" stroke-width="3"/><text x="1005" y="248" text-anchor="middle" font-size="25" fill="#247859" font-weight="750">「帽子」の位置に</text><text x="1005" y="310" text-anchor="middle" font-size="30" fill="#247859" font-weight="750">新しい計算結果</text><text x="1005" y="372" text-anchor="middle" font-size="25" fill="#507f6d" font-weight="750">数値表現を更新</text><path d="M755 326 H854" stroke="#5483ac" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><rect x="232" y="505" width="737" height="76" rx="17" fill="#fff" stroke="#cbdce5" stroke-width="3"/><text x="600" y="550" text-anchor="middle" font-size="25" fill="#426780" font-weight="750">参照の割合を計算し、数値情報を組み合わせる</text><text x="600" y="639" text-anchor="middle" font-size="17" fill="#7f8e9d" font-weight="450">AI Portal ｜ 仕組みを説明する模式図（実際のAttentionの重みではありません）</text></g></svg>