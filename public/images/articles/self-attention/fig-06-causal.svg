<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">未来を参照しないSelf-Attention</title><desc id="d">ChatGPT型モデルの因果マスクを帽子とそれの位置で説明する</desc><defs><linearGradient id="g"><stop stop-color="#f5faff"/><stop offset="1" stop-color="#eff9f5"/></linearGradient><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5791b9" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#g)"/><g font-family="'Noto Sans JP',-apple-system,BlinkMacSystemFont,Meiryo,sans-serif"><text x="600" y="77" text-anchor="middle" font-size="40" font-weight="700" fill="#17395a">未来を参照しないSelf-Attention</text><text x="600" y="123" text-anchor="middle" font-size="22" font-weight="700" fill="#64819a">「それ」の位置からは過去を参照できる</text><rect x="59" y="201" width="1082" height="322" rx="23" fill="#fff" stroke="#b9d3e5" stroke-width="3"/><rect x="89" y="307" width="150" height="94" rx="23" fill="#eef3f7" stroke="#cbdce7" stroke-width="3"/><text x="164" y="365" text-anchor="middle" font-size="25" font-weight="700" fill="#42617c">青い</text><rect x="260" y="307" width="150" height="94" rx="23" fill="#d9edff" stroke="#75b3df" stroke-width="3"/><text x="335" y="365" text-anchor="middle" font-size="25" font-weight="700" fill="#2466a1">帽子</text><rect x="431" y="307" width="150" height="94" rx="23" fill="#eef3f7" stroke="#cbdce7" stroke-width="3"/><text x="506" y="365" text-anchor="middle" font-size="25" font-weight="700" fill="#42617c">買った</text><rect x="602" y="307" width="150" height="94" rx="23" fill="#eef3f7" stroke="#cbdce7" stroke-width="3"/><text x="677" y="365" text-anchor="middle" font-size="25" font-weight="700" fill="#42617c">翌朝</text><rect x="773" y="307" width="150" height="94" rx="23" fill="#d7f4e9" stroke="#85c6a9" stroke-width="3"/><text x="848" y="365" text-anchor="middle" font-size="25" font-weight="700" fill="#237e60">それ</text><rect x="944" y="307" width="150" height="94" rx="23" fill="#eef3f7" stroke="#cbdce7" stroke-width="3"/><text x="1019" y="365" text-anchor="middle" font-size="25" font-weight="700" fill="#42617c">かぶった</text><path d="M934 291 Q700 149 324 291" stroke="#4c9c78" stroke-width="8" fill="none" stroke-linecap="round" /><text x="331" y="458" text-anchor="middle" font-size="24" font-weight="700" fill="#3e8665">過去の位置は参照可</text><path d="M936 407 Q975 498 1020 420" stroke="#d17f77" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="9 8"/><text x="956" y="484" text-anchor="middle" font-size="24" font-weight="700" fill="#ac5550">未来は不可</text><text x="600" y="566" text-anchor="middle" font-size="26" font-weight="700" fill="#4a6f87">Causal Mask（因果マスク）で制限する</text><text x="600" y="640" text-anchor="middle" font-size="17" font-weight="700" fill="#788a99">AI Portal ｜ 学習のための模式図。実際のAttentionの数値ではありません。</text></g></svg>