<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">帽子の位置から見える範囲</title><desc id="chart-desc">赤い・帽子・買ったという順で、帽子の位置から赤いへは参照可能で、買ったへは参照不可能。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#eff9f6"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#457db1" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',-apple-system,BlinkMacSystemFont,Meiryo,sans-serif"><text x="600" y="82" text-anchor="middle" font-size="40" fill="#15385c" font-weight="750">帽子の位置から見える範囲</text><text x="600" y="126" text-anchor="middle" font-size="22" fill="#647e93" font-weight="550">ChatGPT型では過去と現在を参照でき、未来は参照できない</text><rect x="66" y="174" width="1067" height="367" rx="24" fill="#fff" stroke="#bed6e5" stroke-width="3"/><rect x="126" y="283" width="266" height="130" rx="22" fill="#e7f7ee" stroke="#a3d5bb" stroke-width="3"/><text x="259" y="347" text-anchor="middle" font-size="37" fill="#247f5c" font-weight="750">赤い</text><text x="259" y="390" text-anchor="middle" font-size="22" fill="#3f8066" font-weight="750">過去：参照可</text><rect x="466" y="283" width="266" height="130" rx="22" fill="#e6f0ff" stroke="#a6bfdf" stroke-width="3"/><text x="599" y="347" text-anchor="middle" font-size="37" fill="#2b66a5" font-weight="750">帽子</text><text x="599" y="390" text-anchor="middle" font-size="22" fill="#4e709a" font-weight="750">現在：参照可</text><rect x="808" y="283" width="266" height="130" rx="22" fill="#ffefec" stroke="#ebc1b9" stroke-width="3"/><text x="941" y="347" text-anchor="middle" font-size="36" fill="#ac5551" font-weight="750">買った</text><text x="941" y="390" text-anchor="middle" font-size="21" fill="#b4746c" font-weight="750">未来：参照不可</text><path d="M593 273 Q436 174 281 273" stroke="#3f9b78" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><path d="M730 310 H799" stroke="#db837e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="9 9"/><text x="600" y="489" text-anchor="middle" font-size="25" fill="#546f87" font-weight="750">見られる範囲は、モデルの設計で変わる</text><text x="600" y="639" text-anchor="middle" font-size="17" fill="#7f8e9d" font-weight="450">AI Portal ｜ 仕組みを説明する模式図（実際のAttentionの重みではありません）</text></g></svg>