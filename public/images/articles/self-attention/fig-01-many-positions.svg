<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">帽子だけでは色は分からない</title><desc id="chart-desc">帽子を買ったと赤い帽子を買ったの二文に描かれた帽子の色が変わる。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#eff9f6"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#457db1" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',-apple-system,BlinkMacSystemFont,Meiryo,sans-serif"><text x="600" y="82" text-anchor="middle" font-size="40" fill="#15385c" font-weight="750">帽子だけでは色は分からない</text><text x="600" y="126" text-anchor="middle" font-size="22" fill="#647e93" font-weight="550">文章に「赤い」が加わると手掛かりが増える</text><rect x="78" y="176" width="1044" height="195" rx="22" fill="#fff" stroke="#bfd8e7" stroke-width="3"/><text x="250" y="246" text-anchor="middle" font-size="34" fill="#344c68" font-weight="750">帽子を買った</text><g transform="translate(725 209) scale(0.94)"><path d="M29 123 H222 Q247 123 247 105 Q247 91 226 91 H202 L181 22 Q175 10 157 10 H95 Q74 10 68 28 L49 92 H27 Q4 92 4 108 Q4 123 29 123 Z" fill="#dde5eb" stroke="#8395a7" stroke-width="6"/><path d="M52 91 H203" stroke="#f7fbfe" stroke-width="12"/></g><text x="848" y="356" text-anchor="middle" font-size="22" fill="#74889a" font-weight="750">色の手掛かりはまだない</text><rect x="78" y="387" width="1044" height="196" rx="22" fill="#fff3f0" stroke="#e8bfb5" stroke-width="3"/><text x="250" y="461" text-anchor="middle" font-size="33" fill="#ae504c" font-weight="750">赤い帽子を買った</text><g transform="translate(725 414) scale(0.94)"><path d="M29 123 H222 Q247 123 247 105 Q247 91 226 91 H202 L181 22 Q175 10 157 10 H95 Q74 10 68 28 L49 92 H27 Q4 92 4 108 Q4 123 29 123 Z" fill="#ec7770" stroke="#bd474a" stroke-width="6"/><path d="M52 91 H203" stroke="#ffd9c9" stroke-width="12"/></g><text x="848" y="572" text-anchor="middle" font-size="22" fill="#b55b57" font-weight="750">赤いという手掛かりがある</text><text x="600" y="639" text-anchor="middle" font-size="17" fill="#7f8e9d" font-weight="450">AI Portal ｜ 仕組みを説明する模式図（実際のAttentionの重みではありません）</text></g></svg>