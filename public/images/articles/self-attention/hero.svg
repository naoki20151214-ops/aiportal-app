<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">「赤い帽子」でSelf-Attentionを考える</title><desc id="chart-desc">赤い帽子を買った、という文章から帽子の位置が赤いの数値情報を利用する例。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#eff9f6"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#457db1" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',-apple-system,BlinkMacSystemFont,Meiryo,sans-serif"><text x="600" y="82" text-anchor="middle" font-size="40" fill="#15385c" font-weight="750">「赤い帽子」でSelf-Attentionを考える</text><text x="600" y="126" text-anchor="middle" font-size="22" fill="#647e93" font-weight="550">帽子の位置で、同じ文章にある「赤い」の情報を利用したい</text><rect x="78" y="183" width="1040" height="353" rx="28" fill="#fff" stroke="#bfd7e6" stroke-width="3"/><text x="600" y="245" text-anchor="middle" font-size="43" fill="#293d57" font-weight="750">赤い帽子を買った。</text><rect x="152" y="296" width="229" height="107" rx="19" fill="#ffe7e3" stroke="#ecaba5" stroke-width="3"/><text x="266" y="365" text-anchor="middle" font-size="39" fill="#b54c49" font-weight="750">赤い</text><rect x="486" y="296" width="229" height="107" rx="19" fill="#e8f4ff" stroke="#abcce5" stroke-width="3"/><text x="600" y="365" text-anchor="middle" font-size="39" fill="#286ba2" font-weight="750">帽子</text><rect x="819" y="296" width="229" height="107" rx="19" fill="#f3f6f9" stroke="#d0dae2" stroke-width="3"/><text x="934" y="365" text-anchor="middle" font-size="37" fill="#50748d" font-weight="750">買った</text><path d="M266 420 Q413 532 600 422" stroke="#d06d64" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><text x="600" y="565" text-anchor="middle" font-size="29" fill="#28755a" font-weight="750">同じ文章の情報を利用する</text><text x="600" y="639" text-anchor="middle" font-size="17" fill="#7f8e9d" font-weight="450">AI Portal ｜ 仕組みを説明する模式図（実際のAttentionの重みではありません）</text></g></svg>