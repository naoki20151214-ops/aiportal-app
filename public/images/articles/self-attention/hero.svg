<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Self-Attentionって何だろう？</title><desc id="d">青い帽子、買った、それ、などのToken位置を弧で結び、情報を取り込む仕組みを示す</desc><defs><linearGradient id="g"><stop stop-color="#f5faff"/><stop offset="1" stop-color="#eff9f5"/></linearGradient><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5791b9" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#g)"/><g font-family="'Noto Sans JP',-apple-system,BlinkMacSystemFont,Meiryo,sans-serif"><text x="600" y="77" text-anchor="middle" font-size="40" font-weight="700" fill="#17395a">Self-Attentionって何だろう？</text><text x="600" y="123" text-anchor="middle" font-size="22" font-weight="700" fill="#64819a">文章の各位置が、ほかの位置の情報を取り込む</text><rect x="60" y="192" width="1080" height="329" rx="23" fill="#fff" stroke="#b9d3e5" stroke-width="3"/><rect x="89" y="306" width="150" height="94" rx="23" fill="#eef3f7" stroke="#cbdce7" stroke-width="3"/><text x="164" y="364" text-anchor="middle" font-size="25" font-weight="700" fill="#42617c">青い</text><rect x="260" y="306" width="150" height="94" rx="23" fill="#d9edff" stroke="#75b3df" stroke-width="3"/><text x="335" y="364" text-anchor="middle" font-size="25" font-weight="700" fill="#2466a1">帽子</text><rect x="431" y="306" width="150" height="94" rx="23" fill="#eef3f7" stroke="#cbdce7" stroke-width="3"/><text x="506" y="364" text-anchor="middle" font-size="25" font-weight="700" fill="#42617c">買った</text><rect x="602" y="306" width="150" height="94" rx="23" fill="#eef3f7" stroke="#cbdce7" stroke-width="3"/><text x="677" y="364" text-anchor="middle" font-size="25" font-weight="700" fill="#42617c">翌朝</text><rect x="773" y="306" width="150" height="94" rx="23" fill="#d7f4e9" stroke="#85c6a9" stroke-width="3"/><text x="848" y="364" text-anchor="middle" font-size="25" font-weight="700" fill="#237e60">それ</text><rect x="944" y="306" width="150" height="94" rx="23" fill="#eef3f7" stroke="#cbdce7" stroke-width="3"/><text x="1019" y="364" text-anchor="middle" font-size="25" font-weight="700" fill="#42617c">かぶった</text><path d="M252 290 Q600 146 935 291" stroke="#4a9ccc" stroke-width="8" fill="none" stroke-linecap="round" /><path d="M935 410 Q625 568 428 412" stroke="#459d7d" stroke-width="8" fill="none" stroke-linecap="round" /><text x="600" y="569" text-anchor="middle" font-size="25" font-weight="700" fill="#356f83">「それ」だけでなく「帽子」の位置も情報を受け取る</text><text x="600" y="640" text-anchor="middle" font-size="17" font-weight="700" fill="#788a99">AI Portal ｜ 学習のための模式図。実際のAttentionの数値ではありません。</text></g></svg>