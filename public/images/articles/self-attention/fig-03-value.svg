<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">重みとValueは別の役割</title><desc id="d">QとKで重みを計算し、Valueを重みに応じて組み合わせる二段階</desc><defs><linearGradient id="g"><stop stop-color="#f5faff"/><stop offset="1" stop-color="#eff9f5"/></linearGradient><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5791b9" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#g)"/><g font-family="'Noto Sans JP',-apple-system,BlinkMacSystemFont,Meiryo,sans-serif"><text x="600" y="77" text-anchor="middle" font-size="40" font-weight="700" fill="#17395a">重みとValueは別の役割</text><text x="600" y="123" text-anchor="middle" font-size="22" font-weight="700" fill="#64819a">参照先を決めただけでは情報は届かない</text><rect x="65" y="213" width="492" height="304" rx="23" fill="#edf0ff" stroke="#b5b9e6" stroke-width="3"/><text x="310" y="275" text-anchor="middle" font-size="26" font-weight="700" fill="#6f68a8">STEP 1</text><text x="310" y="350" text-anchor="middle" font-size="37" font-weight="700" fill="#4b5999">Query ＋ Key</text><text x="310" y="424" text-anchor="middle" font-size="29" font-weight="700" fill="#596a91">参照の重みを計算</text><path d="M566 365 H624" stroke="#5791b9" stroke-width="8" fill="none" stroke-linecap="round" marker-end="url(#a)"/><rect x="643" y="213" width="492" height="304" rx="23" fill="#e4f6ed" stroke="#9bceb5" stroke-width="3"/><text x="889" y="275" text-anchor="middle" font-size="26" font-weight="700" fill="#40806b">STEP 2</text><text x="889" y="350" text-anchor="middle" font-size="40" font-weight="700" fill="#237d62">Value</text><text x="889" y="424" text-anchor="middle" font-size="26" font-weight="700" fill="#46816c">重みに応じて数値を統合</text><text x="600" y="574" text-anchor="middle" font-size="23" font-weight="700" fill="#506c83">取り込まれるのは数値表現。文字列ではありません。</text><text x="600" y="640" text-anchor="middle" font-size="17" font-weight="700" fill="#788a99">AI Portal ｜ 学習のための模式図。実際のAttentionの数値ではありません。</text></g></svg>