<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="80" text-anchor="middle" font-size="45" font-weight="900" fill="#082c63">計算の結果が、予測として出てくる</text><rect x="135" y="225" width="300" height="250" rx="28" fill="#eaf5ff" stroke="#a9cae3" stroke-width="3"/><text x="285" y="285" text-anchor="middle" font-size="24" font-weight="900" fill="#2f6e9b">Modelの出力</text><text x="285" y="365" text-anchor="middle" font-size="34" font-weight="900" fill="#255f8c">猫 92%</text><text x="285" y="420" text-anchor="middle" font-size="30" fill="#55778d">犬 8%</text><path d="M465 350 H585" stroke="#7398b0" stroke-width="8"/><rect x="615" y="225" width="450" height="250" rx="28" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="840" y="290" text-anchor="middle" font-size="24" font-weight="900" fill="#2f765f">予測</text><text x="840" y="365" text-anchor="middle" font-size="38" font-weight="900" fill="#2a715b">「猫らしい」</text><text x="840" y="420" text-anchor="middle" font-size="19" fill="#61796f">新しい入力に対する答え</text><text x="600" y="575" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87">AIによって、分類・数値・文章など出力の形は変わる</text></svg>