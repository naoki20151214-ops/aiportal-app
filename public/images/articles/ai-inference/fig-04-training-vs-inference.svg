<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="80" text-anchor="middle" font-size="45" font-weight="900" fill="#082c63">Trainingは学ぶ。Inferenceは使う。</text><rect x="90" y="190" width="460" height="330" rx="30" fill="#fff5ed" stroke="#e2bea3" stroke-width="3"/><text x="320" y="255" text-anchor="middle" font-size="28" font-weight="900" fill="#95694d">Training</text><text x="320" y="320" text-anchor="middle" font-size="22" fill="#7e7168">Dataを使う</text><text x="320" y="365" text-anchor="middle" font-size="32" font-weight="900" fill="#8a654e">↓</text><text x="320" y="415" text-anchor="middle" font-size="23" fill="#7e7168">Parameterを調整する</text><text x="320" y="470" text-anchor="middle" font-size="22" font-weight="900" fill="#95694d">「学ぶ」段階</text><rect x="650" y="190" width="460" height="330" rx="30" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="880" y="255" text-anchor="middle" font-size="28" font-weight="900" fill="#2f765f">Inference</text><text x="880" y="320" text-anchor="middle" font-size="22" fill="#61796f">新しい入力を使う</text><text x="880" y="365" text-anchor="middle" font-size="32" font-weight="900" fill="#2a715b">↓</text><text x="880" y="415" text-anchor="middle" font-size="23" fill="#61796f">学習済みParameterで計算</text><text x="880" y="470" text-anchor="middle" font-size="22" font-weight="900" fill="#2f765f">「使う」段階</text><text x="600" y="590" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87">同じModelでも、目的が違う</text></svg>