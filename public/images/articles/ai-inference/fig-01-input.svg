<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="80" text-anchor="middle" font-size="45" font-weight="900" fill="#082c63">写真を、Modelが計算できる数字へ</text><rect x="100" y="220" width="300" height="250" rx="28" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="250" y="275" text-anchor="middle" font-size="24" font-weight="900" fill="#46718f">新しい画像</text><circle cx="250" cy="365" r="58" fill="#dceeff"/><text x="250" y="450" text-anchor="middle" font-size="19" fill="#617a8c">人には「猫」に見える</text><path d="M430 345 H550" stroke="#7398b0" stroke-width="8"/><text x="490" y="320" text-anchor="middle" font-size="19" fill="#55758f">変換</text><rect x="580" y="205" width="500" height="280" rx="28" fill="#eaf5ff" stroke="#a9cae3" stroke-width="3"/><text x="830" y="260" text-anchor="middle" font-size="24" font-weight="900" fill="#2f6e9b">数字のまとまり</text><text x="830" y="335" text-anchor="middle" font-size="25" fill="#55778d">0.12　0.84　0.33　0.71</text><text x="830" y="385" text-anchor="middle" font-size="25" fill="#55778d">0.46　0.09　0.92　…</text><text x="830" y="445" text-anchor="middle" font-size="20" fill="#638198">Tensorとして扱うこともある</text><text x="600" y="575" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87">Modelは入力を数字として計算する</text></svg>