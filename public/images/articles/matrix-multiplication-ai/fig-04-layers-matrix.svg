<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="78" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Layerごとに、数字を次の形へ変える</text><g transform="translate(60 245)"><rect width="190" height="150" rx="25" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="95" y="57" text-anchor="middle" font-size="23" font-weight="900" fill="#46718f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">入力</text><text x="95" y="103" text-anchor="middle" font-size="20" fill="#617a8c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">数字のまとまり</text></g><path d="M265 320 H350" stroke="#7398b0" stroke-width="7"/><g transform="translate(365 220)"><rect width="225" height="200" rx="25" fill="#eaf4fb" stroke="#95bfd9" stroke-width="3"/><text x="112" y="55" text-anchor="middle" font-size="22" font-weight="900" fill="#34739d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Layer 1</text><text x="112" y="108" text-anchor="middle" font-size="19" fill="#5b788c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">行列計算</text><text x="112" y="150" text-anchor="middle" font-size="19" fill="#5b788c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">新しい数字へ</text></g><path d="M605 320 H690" stroke="#7398b0" stroke-width="7"/><g transform="translate(705 220)"><rect width="225" height="200" rx="25" fill="#eef7fb" stroke="#a8cade" stroke-width="3"/><text x="112" y="55" text-anchor="middle" font-size="22" font-weight="900" fill="#34739d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Layer 2</text><text x="112" y="108" text-anchor="middle" font-size="19" fill="#5b788c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">また行列計算</text><text x="112" y="150" text-anchor="middle" font-size="19" fill="#5b788c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">さらに変換</text></g><path d="M945 320 H1015" stroke="#7398b0" stroke-width="7"/><g transform="translate(1030 245)"><rect width="120" height="150" rx="25" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="60" y="57" text-anchor="middle" font-size="22" font-weight="900" fill="#2f765f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">出力</text><text x="60" y="103" text-anchor="middle" font-size="21" fill="#477766" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">猫</text></g><text x="600" y="575" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">ニューラルネットワークは、こうした変換を何層も重ねる。</text></svg>