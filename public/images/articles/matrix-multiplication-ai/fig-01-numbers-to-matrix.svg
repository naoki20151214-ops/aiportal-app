<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="78" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">バラバラの数字を、表にまとめる</text><g transform="translate(90 225)"><text x="0" y="0" font-size="24" fill="#4e7a98" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">0.8</text><text x="125" y="55" font-size="24" fill="#4e7a98" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">0.3</text><text x="55" y="125" font-size="24" fill="#4e7a98" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">0.5</text><text x="180" y="175" font-size="24" fill="#4e7a98" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">0.2</text><text x="25" y="230" font-size="24" fill="#4e7a98" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">0.9</text></g><path d="M355 355 H505" stroke="#7599b1" stroke-width="8"/><g transform="translate(540 195)"><rect width="420" height="285" rx="32" fill="#fff" stroke="#b8d2e4" stroke-width="3"/><text x="210" y="52" text-anchor="middle" font-size="25" font-weight="900" fill="#34729a" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">行列 = 数字の表</text><text x="210" y="125" text-anchor="middle" font-size="36" fill="#4f8db5" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">0.8   0.3   0.5</text><text x="210" y="185" text-anchor="middle" font-size="36" fill="#4f8db5" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">0.2   0.9   0.4</text><text x="210" y="240" text-anchor="middle" font-size="20" fill="#657b8a" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">行 × 列 で整理する</text></g><text x="600" y="580" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">大量の数字を「まとまり」として扱いやすくする。</tex