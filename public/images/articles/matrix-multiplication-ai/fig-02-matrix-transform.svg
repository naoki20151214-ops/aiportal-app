<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="78" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">複数の入力を、複数の出力へ</text><g transform="translate(80 200)"><rect width="270" height="260" rx="28" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="135" y="48" text-anchor="middle" font-size="24" font-weight="900" fill="#46718f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">入力</text><text x="135" y="105" text-anchor="middle" font-size="21" fill="#617a8c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">耳らしさ</text><text x="135" y="150" text-anchor="middle" font-size="21" fill="#617a8c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">目らしさ</text><text x="135" y="195" text-anchor="middle" font-size="21" fill="#617a8c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">毛並みらしさ</text></g><path d="M370 330 H505" stroke="#7095af" stroke-width="8"/><g transform="translate(525 215)"><rect width="260" height="230" rx="28" fill="#eaf4fb" stroke="#92bdd9" stroke-width="3"/><text x="130" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#34739d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">行列計算</text><text x="130" y="115" text-anchor="middle" font-size="20" fill="#58758a" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">まとめて組み合わせる</text><text x="130" y="165" text-anchor="middle" font-size="22" font-weight="800" fill="#4d86ad" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">入力 → 新しい表現</text></g><path d="M805 330 H925" stroke="#7095af" stroke-width="8"/><g transform="translate(945 225)"><rect width="190" height="205" rx="28" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="95" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#2f765f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">出力</text><text x="95" y="112" text-anchor="middle" font-size="21" fill="#497765" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">猫らしさ</text><text x="95" y="158" text-anchor="middle" font-size="21" fill="#497765" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">犬らしさ</text></g><text x="600" y="580" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">行列の掛け算は「数字のまとまりを別のまとまりへ変える」計算。</text></svg>