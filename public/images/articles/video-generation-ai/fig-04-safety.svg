<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">AIイメージ映像と現実の記録を区別する</title><desc id="d">AI生成映像を公開する前に出典・日時・肖像・表示方法を確認する図</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#739bbb" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="#fafcff"/><circle cx="1068" cy="90" r="144" fill="#eaf4ff"/><circle cx="112" cy="596" r="120" fill="#fff5e9"/><text x="600" y="75" font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif" font-size="38" fill="#193750" font-weight="700" text-anchor="middle">AIイメージ映像と現実の記録を区別する</text><rect x="47" y="162" width="529" height="147" rx="22" fill="#fff0e6" stroke="#abcade" stroke-width="2.8"/><text x="311.5" y="223.88" font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif" font-size="28" fill="#193750" font-weight="700" text-anchor="middle">AIで生成したイメージ映像</text><text x="311.5" y="264.48" font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif" font-size="28" fill="#193750" font-weight="700" text-anchor="middle">現実の証拠とは別</text><rect x="628" y="162" width="527" height="147" rx="22" fill="#e9f3ff" stroke="#abcade" stroke-width="2.8"/><text x="891.5" y="223.88" font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif" font-size="28" fill="#193750" font-weight="700" text-anchor="middle">実際に撮影した記録映像</text><text x="891.5" y="264.48" font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif" font-size="28" fill="#193750" font-weight="700" text-anchor="middle">確認可能な元資料</text><rect x="107" y="361" width="986" height="80" rx="22" fill="#e4f6eb" stroke="#abcade" stroke-width="2.8"/><text x="600" y="409.68" font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif" font-size="28" fill="#193750" font-weight="700" text-anchor="middle">① 正しい日時・場所・元資料を確認</text><rect x="107" y="458" width="986" height="80" rx="22" fill="#e9f1ff" stroke="#abcade" stroke-width="2.8"/><text x="600" y="506.06" font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif" font-size="26" fill="#193750" font-weight="700" text-anchor="middle">② 肖像・個人情報・AI生成の表示を確認</text><text x="600" y="635" font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif" font-size="18" fill="#607c91" font-weight="500" text-anchor="middle">図は説明用の模式図です。実際のモデル内部を示すものではありません。</text></svg>