<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">二つの探し方を組み合わせる</title><desc id="d">キーワード検索とベクトル検索の候補を統合するHybrid Search。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" stroke="#6b98b9" fill="none" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="#f7fbfc"/><circle cx="96" cy="620" r="104" fill="#fff2eb"/><circle cx="1110" cy="128" r="127" fill="#eaf5ff"/><g font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif"><text x="600" y="75" font-size="38" font-weight="750" text-anchor="middle" fill="#24425d">二つの探し方を組み合わせる</text><rect x="68" y="164" width="458" height="116" rx="19" fill="#e4f2ff" stroke="#b7cbd9" stroke-width="2.5"/><text x="297" y="211.33499999999998" font-size="27" text-anchor="middle" font-weight="700" fill="#24425d">キーワード検索</text><text x="297" y="249.945" font-size="27" text-anchor="middle" font-weight="700" fill="#24425d">「清掃」「資料ID」</text><rect x="676" y="164" width="458" height="116" rx="19" fill="#efeaff" stroke="#b7cbd9" stroke-width="2.5"/><text x="905" y="211.33499999999998" font-size="27" text-anchor="middle" font-weight="700" fill="#24425d">ベクトル検索</text><text x="905" y="249.945" font-size="27" text-anchor="middle" font-weight="700" fill="#24425d">「そうじ」と意味が近い</text><path d="M292 292 L507 373" stroke="#6b98b9" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M907 292 L690 373" stroke="#6b98b9" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><rect x="366" y="377" width="480" height="126" rx="19" fill="#e5f7ec" stroke="#b7cbd9" stroke-width="2.5"/><text x="606" y="428.94" font-size="28" text-anchor="middle" font-weight="700" fill="#24425d">順位を統合する</text><text x="606" y="468.98" font-size="28" text-anchor="middle" font-weight="700" fill="#24425d">Hybrid Search（RRF）</text><text x="600" y="570" font-size="25" font-weight="700" 