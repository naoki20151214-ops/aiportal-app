<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">古い版と閲覧権限を確認する</title><desc id="d">有効な改訂版を残し利用者の閲覧許可を確認する検索フィルタ。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" stroke="#6b98b9" fill="none" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="#f7fbfc"/><circle cx="96" cy="620" r="104" fill="#fff2eb"/><circle cx="1110" cy="128" r="127" fill="#eaf5ff"/><g font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif"><text x="600" y="75" font-size="38" font-weight="750" text-anchor="middle" fill="#24425d">古い版と閲覧権限を確認する</text><rect x="64" y="187" width="405" height="91" rx="19" fill="#fde7e5" stroke="#b7cbd9" stroke-width="2.5"/><text x="266.5" y="240.82" font-size="26" text-anchor="middle" font-weight="700" fill="#24425d">旧版：9時（無効）</text><rect x="64" y="294" width="405" height="91" rx="19" fill="#e5f7ec" stroke="#b7cbd9" stroke-width="2.5"/><text x="266.5" y="347.82" font-size="26" text-anchor="middle" font-weight="700" fill="#24425d">改訂版：10時（有効）</text><rect x="64" y="400" width="405" height="91" rx="19" fill="#ffefdc" stroke="#b7cbd9" stroke-width="2.5"/><text x="266.5" y="453.82" font-size="26" text-anchor="middle" font-weight="700" fill="#24425d">役員限定の名簿</text><path d="M478 328 L558 328" stroke="#6b98b9" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><rect x="571" y="221" width="283" height="207" rx="19" fill="#efeaff" stroke="#b7cbd9" stroke-width="2.5"/><text x="712.5" y="294.53" font-size="27" text-anchor="middle" font-weight="700" fill="#24425d">条件で絞る</text><text x="712.5" y="333.14" font-size="27" text-anchor="middle" font-weight="700" fill="#24425d">① 有効な版</text><text x="712.5" y="371.75" font-size="27" text-anchor="middle" font-weight="700" fill="#24425d">② 閲覧可能</text><path d="M866 327 L930 327" stroke="#6b98b9" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><rect x="937" y="264" width="202" height="128" rx="19" fill="#e5f7ec" stroke="#b7cbd9" stroke-width="2.5"/><text x="1038" y="316.94" font-size="28" text-anchor="middle" font-weight="700" fill="#24425d">10時の</text><text x="1038" y="356.98" font-size="28" text-anchor="middle" font-weight="700" fill="#24425d">改訂版</text><text x="600" y="560" font-size="23" font-weight="700" text-anchor="middle" fill="#637d91">正式な版・権限の管理が正確であることが前提</text><text x="600" y="641" font-size="17" font-weight="700" text-anchor="middle" fill="#637d91">AI Portal｜架空の例による模式図</text></g></svg>