<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">準備・検索・回答は別の仕事</title><desc id="d">チャンクとEmbeddingの準備、質問時のRetrieval、LLM回答の流れ。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" stroke="#6b98b9" fill="none" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="#f7fbfc"/><circle cx="96" cy="620" r="104" fill="#fff2eb"/><circle cx="1110" cy="128" r="127" fill="#eaf5ff"/><g font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif"><text x="600" y="75" font-size="38" font-weight="750" text-anchor="middle" fill="#24425d">準備・検索・回答は別の仕事</text><rect x="60" y="170" width="340" height="184" rx="19" fill="#ffefdc" stroke="#b7cbd9" stroke-width="2.5"/><text x="230" y="233.14" font-size="26" text-anchor="middle" font-weight="700" fill="#24425d">① 準備</text><text x="230" y="270.32" font-size="26" text-anchor="middle" font-weight="700" fill="#24425d">資料 → Chunking</text><text x="230" y="307.5" font-size="26" text-anchor="middle" font-weight="700" fill="#24425d">→ Embedding登録</text><path d="M411 263 L469 263" stroke="#6b98b9" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><rect x="480" y="170" width="324" height="184" rx="19" fill="#e4f2ff" stroke="#b7cbd9" stroke-width="2.5"/><text x="642" y="233.14" font-size="26" text-anchor="middle" font-weight="700" fill="#24425d">② Retrieval</text><text x="642" y="270.32" font-size="26" text-anchor="middle" font-weight="700" fill="#24425d">質問から候補を</text><text x="642" y="307.5" font-size="26" text-anchor="middle" font-weight="700" fill="#24425d">検索・選別</text><path d="M815 263 L866 263" stroke="#6b98b9" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><rect x="873" y="170" width="277" height="184" rx="19" fill="#e5f7ec" stroke="#b7cbd9" stroke-width="2.5"/><text x="1011.5" y="234.25" font-size="25" text-anchor="middle" font-weight="700" fill="#24425d">③ 回答</text><text x="1011.5" y="270" font-size="25" text-anchor="middle" font-weight="700" fill="#24425d">資料を使って</text><text x="1011.5" y="305.75" font-size="25" text-anchor="middle" font-weight="700" fill="#24425d">LLMが文章生成</text><rect x="183" y="412" width="817" height="110" rx="19" fill="#efeaff" stroke="#b7cbd9" stroke-width="2.5"/><text x="591.5" y="455.94" font-size="28" text-anchor="middle" font-weight="700" fill="#24425d">Retrievalは回答を作る仕事ではない</text><text x="591.5" y="495.98" font-size="28" text-anchor="middle" font-weight="700" fill="#24425d">LLMへ渡す材料を取り出す仕事</text><text x="600" y="641" font-size="17" font-weight="700" text-anchor="middle" fill="#637d91">AI Portal｜架空の例による模式図</text></g></svg>