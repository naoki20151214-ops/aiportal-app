<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">類似度の次に日付・権限を確認</title><desc id="d">検索候補の新旧を判別し、閲覧可能な資料だけを扱うため、メタデータ等の条件を設ける説明図。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#6599bb" stroke-width="2"/></marker><linearGradient id="g"><stop stop-color="#fafdff"/><stop offset="1" stop-color="#fbfdf6"/></linearGradient></defs><rect width="1200" height="675" fill="url(#g)"/><circle cx="1080" cy="83" r="130" fill="#e9f4ff" opacity=".7"/><circle cx="100" cy="605" r="109" fill="#fff1e7" opacity=".7"/><g font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif">
<text x="600" y="74" text-anchor="middle" font-size="41" font-weight="700" fill="#24425d">「似ている」だけで答えを決めない</text>
<rect x="69" y="139" width="341" height="392" rx="18" fill="#e4f2ff" stroke="#bed0df" stroke-width="3"/><rect x="441" y="139" width="321" height="392" rx="18" fill="#fff5dc" stroke="#bed0df" stroke-width="3"/><rect x="793" y="139" width="337" height="392" rx="18" fill="#e4f6ed" stroke="#bed0df" stroke-width="3"/>
<text x="237" y="208" text-anchor="middle" font-size="29" font-weight="700" fill="#24425d">① 関連資料を探す</text>
<rect x="93" y="270" width="292" height="66" rx="18" fill="#fff" stroke="#bed0df" stroke-width="3"/><text x="239" y="311" text-anchor="middle" font-size="25" font-weight="700" fill="#24425d">旧版：9時</text>
<rect x="93" y="370" width="292" height="66" rx="18" fill="#fff" stroke="#bed0df" stroke-width="3"/><text x="239" y="411" text-anchor="middle" font-size="25" font-weight="700" fill="#24425d">改訂版：10時</text>
<text x="599" y="208" text-anchor="middle" font-size="29" font-weight="700" fill="#24425d">② 条件を確認</text>
<rect x="466" y="255" width="274" height="70" rx="18" fill="#fff" stroke="#bed0df" stroke-width="3"/><text x="603" y="298" text-anchor="middle" font-size="25" font-weight="700" fill="#24425d">改訂日・版</text>
<rect x="466" y="344" width="274" height="70" rx="18" fill="#fff" stroke="#bed0df" stroke-width="3"/><text x="603" y="387" text-anchor="middle" font-size="25" font-weight="700" fill="#24425d">閲覧権限</text>
<rect x="466" y="433" width="274" height="61" rx="18" fill="#fff" stroke="#bed0df" stroke-width="3"/><text x="603" y="471.5" text-anchor="middle" font-size="24" font-weight="700" fill="#24425d">出典・参照先</text>
<text x="963" y="208" text-anchor="middle" font-size="29" font-weight="700" fill="#24425d">③ 文章を取得</text>
<rect x="816" y="282" width="289" height="147" rx="18" fill="#fff" stroke="#bed0df" stroke-width="3"/><text x="960.5" y="363.5" text-anchor="middle" font-size="27" font-weight="700" fill="#24425d">改訂版：10時</text>
<text x="964" y="468" text-anchor="middle" font-size="23" font-weight="700" fill="#287b5e">元資料も照合</text>
<path d="M410 347 L435 347" stroke="#6599bb" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#a)"/><path d="M762 347 L790 347" stroke="#6599bb" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#a)"/>
<text x="600" y="596" text-anchor="middle" font-size="22" font-weight="700" fill="#657f92">条件を先にかけるか、候補取得後に確かめるかは構成次第</text>
<text x="1005" y="643" text-anchor="middle" font-size="16" font-weight="700" fill="#657f92">AI Portal｜説明用の模式図</text></g></svg>