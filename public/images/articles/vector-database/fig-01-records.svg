<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">チャンクとベクトルと元資料の関係</title><desc id="d">文章の断片にIDと数値の並びと出典や版を紐付けた記録を説明する図。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#6599bb" stroke-width="2"/></marker><linearGradient id="g"><stop stop-color="#fafdff"/><stop offset="1" stop-color="#fbfdf6"/></linearGradient></defs><rect width="1200" height="675" fill="url(#g)"/><circle cx="1080" cy="83" r="130" fill="#e9f4ff" opacity=".7"/><circle cx="100" cy="605" r="109" fill="#fff1e7" opacity=".7"/><g font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif">
<text x="600" y="76" text-anchor="middle" font-size="40" font-weight="700" fill="#24425d">文章だけでなく「検索用の数字」も結び付ける</text>
<rect x="63" y="166" width="330" height="335" rx="18" fill="#e4f2ff" stroke="#bed0df" stroke-width="3"/><text x="227" y="224" text-anchor="middle" font-size="30" font-weight="700" fill="#24425d">元のチャンク</text>
<rect x="91" y="275" width="276" height="74" rx="18" fill="#fff" stroke="#bed0df" stroke-width="3"/><text x="229" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="#24425d">【改訂版】10時集合</text>
<rect x="91" y="371" width="276" height="70" rx="18" fill="#fff" stroke="#bed0df" stroke-width="3"/><text x="229" y="414" text-anchor="middle" font-size="24" font-weight="700" fill="#24425d">資料ID：A2</text>
<path d="M402 320 L475 320" stroke="#6599bb" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#a)"/>
<rect x="490" y="166" width="651" height="335" rx="18" fill="#e4f6ed" stroke="#bed0df" stroke-width="3"/><text x="815" y="225" text-anchor="middle" font-size="32" font-weight="700" fill="#24425d">登録する記録のイメージ</text>
<rect x="525" y="261" width="577" height="63" rx="18" fill="#fff" stroke="#bed0df" stroke-width="3"/><text x="813.5" y="300.5" text-anchor="middle" font-size="24" font-weight="700" fill="#24425d">ID：A2　ベクトル：[0.3, 0.8, …]</text>
<rect x="525" y="340" width="577" height="63" rx="18" fill="#fff" stroke="#bed0df" stroke-width="3"/><text x="813.5" y="379.5" text-anchor="middle" font-size="22" font-weight="700" fill="#24425d">版：改訂版　出典：町内会のお知らせ</text>
<rect x="525" y="419" width="577" height="55" rx="18" fill="#fff" stroke="#bed0df" stroke-width="3"/><text x="813.5" y="454.5" text-anchor="middle" font-size="22" font-weight="700" fill="#24425d">本文を保存 または 元資料へ参照</text>
<text x="600" y="559" text-anchor="middle" font-size="28" font-weight="700" fill="#24425d">数字の並びだけでは、元の文章は読めない</text>
<text x="600" y="605" text-anchor="middle" font-size="21" font-weight="700" fill="#657f92">※実際の保存項目は製品・設計で異なります</text>
<text x="1005" y="643" text-anchor="middle" font-size="16" font-weight="700" fill="#657f92">AI Portal｜説明用の模式図</text></g></svg>