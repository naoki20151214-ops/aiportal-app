<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="BiasとVariance">
<defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#5698c8" flood-opacity=".17"/></filter></defs>
<rect width="1200" height="675" fill="#f7fbff"/>
<text x="600" y="72" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Bias と Variance</text>
<text x="600" y="116" text-anchor="middle" font-size="22" fill="#547899" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Modelの失敗を「ずれ」と「ばらつき」に分けて考える</text>
<g transform="translate(95 180)" filter="url(#s)">
<rect width="455" height="365" rx="34" fill="#fff"/>
<text x="228" y="52" text-anchor="middle" font-size="29" font-weight="800" fill="#7a91a7" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">High Bias</text>
<circle cx="228" cy="210" r="115" fill="#f4f8fb" stroke="#b6cadb" stroke-width="4"/>
<circle cx="228" cy="210" r="76" fill="none" stroke="#b6cadb" stroke-width="4"/><circle cx="228" cy="210" r="36" fill="none" stroke="#b6cadb" stroke-width="4"/>
<circle cx="140" cy="155" r="10" fill="#8098ad"/><circle cx="160" cy="180" r="10" fill="#8098ad"/><circle cx="145" cy="205" r="10" fill="#8098ad"/><circle cx="180" cy="170" r="10" fill="#8098ad"/><circle cx="155" cy="235" r="10" fill="#8098ad"/><circle cx="188" cy="220" r="10" fill="#8098ad"/>
<text x="228" y="335" text-anchor="middle" font-size="19" fill="#697f95" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">予測が同じ方向へずれる</text>
</g>
<g transform="translate(650 180)" filter="url(#s)">
<rect width="455" height="365" rx="34" fill="#fff"/>
<text x="228" y="52" text-anchor="middle" font-size="29" font-weight="800" fill="#e57550" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">High Variance</text>
<circle cx="228" cy="210" r="115" fill="#fff8f5" stroke="#ecc0b1" stroke-width="4"/>
<circle cx="228" cy="210" r="76" fill="none" stroke="#ecc0b1" stroke-width="4"/><circle cx="228" cy="210" r="36" fill="none" stroke="#ecc0b1" stroke-width="4"/>
<circle cx="135" cy="145" r="10" fill="#e57550"/><circle cx="310" cy="155" r="10" fill="#e57550"/><circle cx="185" cy="290" r="10" fill="#e57550"/><circle cx="305" cy="270" r="10" fill="#e57550"/><circle cx="228" cy="115" r="10" fill="#e57550"/><circle cx="125" cy="260" r="10" fill="#e57550"/><circle cx="330" cy="215" r="10" fill="#e57550"/>
<text x="228" y="335" text-anchor="middle" font-size="19" fill="#697f95" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Training Dataが変わると予測も大きく変わる</text>
</g>
<text x="600" y="610" text-anchor="middle" font-size="23" font-weight="700" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">未知Dataで最も安定する、ちょうどよいModel Complexityを探す。</text>
</svg>