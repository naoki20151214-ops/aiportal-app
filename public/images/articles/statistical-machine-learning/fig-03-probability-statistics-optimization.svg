<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="確率・統計・最適化">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ff"/><stop offset="1" stop-color="#dff3ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#4f96c7" flood-opacity=".18"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<text x="600" y="74" text-anchor="middle" font-size="45" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">確率・統計・最適化</text>
<text x="600" y="118" text-anchor="middle" font-size="22" fill="#547899" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">統計的機械学習を支える3つの視点</text>
<g filter="url(#s)">
<rect x="60" y="185" width="330" height="350" rx="34" fill="#fff"/>
<rect x="435" y="185" width="330" height="350" rx="34" fill="#fff"/>
<rect x="810" y="185" width="330" height="350" rx="34" fill="#fff"/>
</g>
<text x="225" y="238" text-anchor="middle" font-size="29" font-weight="800" fill="#1970bb" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Probability</text>
<path d="M105 440 C155 440 168 280 225 280 C282 280 295 440 345 440" fill="none" stroke="#2d86d6" stroke-width="8"/>
<text x="225" y="492" text-anchor="middle" font-size="19" fill="#617d98" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">不確実性を数値で扱う</text>
<text x="600" y="238" text-anchor="middle" font-size="29" font-weight="800" fill="#1970bb" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Statistics</text>
<g transform="translate(500 300)" fill="#37a8e8"><rect x="0" y="100" width="34" height="90" rx="6"/><rect x="52" y="55" width="34" height="135" rx="6"/><rect x="104" y="20" width="34" height="170" rx="6"/><rect x="156" y="75" width="34" height="115" rx="6"/></g>
<text x="600" y="492" text-anchor="middle" font-size="19" fill="#617d98" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Sampleから傾向を推定</text>
<text x="975" y="238" text-anchor="middle" font-size="29" font-weight="800" fill="#1970bb" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Optimization</text>
<path d="M860 430 C900 330 930 390 970 300 C1010 230 1050 285 1100 235" fill="none" stroke="#ff9c2d" stroke-width="8"/>
<circle cx="1100" cy="235" r="13" fill="#ff9c2d"/>
<text x="975" y="492" text-anchor="middle" font-size="19" fill="#617d98" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Lossが小さくなるParameterへ</text>
<text x="600" y="600" text-anchor="middle" font-size="23" font-weight="700" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">ばらつきを理解し、規則性を推定し、Modelを最適化する。</text>
</svg>