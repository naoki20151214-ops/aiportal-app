<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="80" text-anchor="middle" font-size="44" font-weight="900" fill="#082c63">一つ出したら、また次を予測する</text><g font-size="22" font-weight="800" text-anchor="middle"><rect x="75" y="235" width="240" height="145" rx="25" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="195" y="300" fill="#46718f">コンビニで</text><text x="195" y="340" fill="#46718f">＿＿＿</text><path d="M335 307 H415" stroke="#7398b0" stroke-width="7"/><rect x="435" y="235" width="240" height="145" rx="25" fill="#eaf5ff" stroke="#a9cae3" stroke-width="3"/><text x="555" y="300" fill="#2f6e9b">おにぎりを</text><text x="555" y="340" fill="#638198">予測</text><path d="M695 307 H775" stroke="#7398b0" stroke-width="7"/><rect x="795" y="235" width="330" height="145" rx="25" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="960" y="292" fill="#2f765f">コンビニでおにぎりを</text><text x="960" y="338" fill="#2f765f">買った。</text></g><path d="M960 415 C960 530 555 530 555 415" fill="none" stroke="#6ea88f" stroke-width="6"/><text x="755" y="505" text-anchor="middle" font-size="22" font-weight="800" fill="#2f765f">長くなった文脈で、また次を予測</text><text x="600" y="590" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87">予測 → 出力 → 予測 → 出力 を繰り返す</text></svg>