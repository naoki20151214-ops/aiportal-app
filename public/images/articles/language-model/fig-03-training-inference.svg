<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="80" text-anchor="middle" font-size="44" font-weight="900" fill="#082c63">Trainingで学び、Inferenceで文章を作る</text><rect x="80" y="180" width="465" height="330" rx="30" fill="#fff5ed" stroke="#e2bea3" stroke-width="3"/><text x="312" y="245" text-anchor="middle" font-size="28" font-weight="900" fill="#95694d">Training</text><text x="312" y="310" text-anchor="middle" font-size="22" fill="#7e7168">大量の文章を見る</text><text x="312" y="360" text-anchor="middle" font-size="22" fill="#7e7168">↓</text><text x="312" y="405" text-anchor="middle" font-size="22" fill="#7e7168">次を予測して間違いを測る</text><text x="312" y="455" text-anchor="middle" font-size="22" font-weight="900" fill="#95694d">Parameterを調整</text><path d="M570 345 H630" stroke="#7398b0" stroke-width="8"/><rect x="655" y="180" width="465" height="330" rx="30" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="887" y="245" text-anchor="middle" font-size="28" font-weight="900" fill="#2f765f">Inference</text><text x="887" y="310" text-anchor="middle" font-size="22" fill="#61796f">新しい文章を受け取る</text><text x="887" y="360" text-anchor="middle" font-size="22" fill="#61796f">↓</text><text x="887" y="405" text-anchor="middle" font-size="22" fill="#61796f">学習済みParameterで次を予測</text><text x="887" y="455" text-anchor="middle" font-size="22" font-weight="900" fill="#2f765f">文章を出力</text><text x="600" y="590" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87">これまで学んだTrainingとInferenceが、文章生成につながる</text></svg>