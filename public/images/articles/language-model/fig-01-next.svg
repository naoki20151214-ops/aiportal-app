<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="80" text-anchor="middle" font-size="44" font-weight="900" fill="#082c63">この続きには、何が来そう？</text><rect x="80" y="205" width="480" height="250" rx="28" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="320" y="290" text-anchor="middle" font-size="29" font-weight="900" fill="#355f87">今日の空は青くて、とても</text><text x="320" y="365" text-anchor="middle" font-size="50" font-weight="900" fill="#2874ba">＿＿＿</text><path d="M590 330 H690" stroke="#7398b0" stroke-width="8"/><g font-size="24" font-weight="800"><rect x="720" y="185" width="390" height="90" rx="22" fill="#eaf7f2"/><text x="760" y="240" fill="#2f765f">きれい</text><text x="1040" y="240" text-anchor="end" fill="#2f765f">高い</text><rect x="720" y="295" width="330" height="90" rx="22" fill="#eaf5ff"/><text x="760" y="350" fill="#2f6e9b">気持ちいい</text><text x="980" y="350" text-anchor="end" fill="#2f6e9b">中</text><rect x="720" y="405" width="160" height="90" rx="22" fill="#f3f6f8"/><text x="760" y="460" fill="#71818c">おいしい</text><text x="850" y="460" text-anchor="end" fill="#71818c">低い</text></g><text x="600" y="585" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87">ここまでの文章から、続きの候補を計算する</text></svg>