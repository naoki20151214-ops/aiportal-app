<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="AIの歴史を学ぶ3つの理由">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#d9f2ff"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1479e8"/><stop offset="1" stop-color="#27c3e8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6aa9d8" flood-opacity=".18"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/><circle cx="1080" cy="90" r="150" fill="#fff" opacity=".45"/><circle cx="80" cy="590" r="130" fill="#bcecff" opacity=".35"/>
<text x="600" y="72" font-size="44" font-weight="800" fill="#082b66" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif"><tspan x="600" dy="0">AIの歴史を学ぶ3つの理由</tspan></text>
<text x="600" y="124" font-size="21" font-weight="500" fill="#47719b" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif"><tspan x="600" dy="0">過去を知ると現在のAIが見えやすくなる</tspan></text>
<rect x="70" y="155" width="1060" height="450" rx="34" fill="#ffffff" opacity=".94" filter="url(#shadow)"/>

<g><rect x="130" y="210" width="430" height="125" rx="24" fill="#e9f3ff"/><circle cx="185" cy="272" r="30" fill="#2f86e6"/><text x="185" y="282" text-anchor="middle" font-size="28" font-weight="800" fill="#fff" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">1</text><text x="235" y="263" font-size="23" font-weight="700" fill="#153d70" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif"><tspan x="235" dy="0">今のAIの位置が分かる</tspan></text></g><g><rect x="640" y="210" width="430" height="125" rx="24" fill="#eafaff"/><circle cx="695" cy="272" r="30" fill="#27bddb"/><text x="695" y="282" text-anchor="middle" font-size="28" font-weight="800" fill="#fff" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">2</text><text x="745" y="263" font-size="23" font-weight="700" fill="#153d70" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif"><tspan x="745" dy="0">過大評価・過小評価を避ける</tspan></text></g><g><rect x="130" y="365" width="430" height="125" rx="24" fill="#e9f3ff"/><circle cx="185" cy="427" r="30" fill="#2f86e6"/><text x="185" y="437" text-anchor="middle" font-size="28" font-weight="800" fill="#fff" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">3</text><text x="235" y="418" font-size="23" font-weight="700" fill="#153d70" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif"><tspan x="235" dy="0">古い課題が今も続く</tspan></text></g><g><rect x="640" y="365" width="430" height="125" rx="24" fill="#eafaff"/><circle cx="695" cy="427" r="30" fill="#27bddb"/><text x="695" y="437" text-anchor="middle" font-size="28" font-weight="800" fill="#fff" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">4</text><text x="745" y="418" font-size="23" font-weight="700" fill="#153d70" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif"><tspan x="745" dy="0">技術の組み合わせが見える</tspan></text></g>
<text x="600" y="555" font-size="22" font-weight="600" fill="#47719b" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif"><tspan x="600" dy="0">歴史は未来予測ではなく、現在を正しく理解するための地図</tspan></text>
<text x="600" y="645" text-anchor="middle" font-size="17" fill="#5b7d9e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">AI Portal｜やさしく学び、正確に理解する</text></svg>