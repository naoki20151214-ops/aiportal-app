<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">文字・画像・音声・動画</title><desc id="desc">文字、画像、音声、動画の4種類を独立した箱に示す。</desc><defs><linearGradient id="bg"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#effaf5"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#6090b6" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="75" font-size="39" text-anchor="middle" font-weight="700" fill="#193d62">文字・画像・音声・動画</text><text x="600" y="120" font-size="22" text-anchor="middle" font-weight="700" fill="#67849b">一つの情報にも、いろいろな形がある</text><rect x="40" y="213" width="258" height="316" rx="20" stroke="#afcee6" stroke-width="3" fill="#e9f4ff"/><text x="169" y="286" font-size="29" text-anchor="middle" font-weight="700" fill="#244969">文字</text><text x="169" y="396" font-size="42" text-anchor="middle" font-weight="700" fill="#244969">午後2時</text><rect x="327" y="213" width="258" height="316" rx="20" stroke="#e0c4a9" stroke-width="3" fill="#fff1e5"/><text x="456" y="286" font-size="29" text-anchor="middle" font-weight="700" fill="#244969">画像</text><text x="456" y="396" font-size="42" text-anchor="middle" font-weight="700" fill="#244969">▧</text><rect x="614" y="213" width="258" height="316" rx="20" stroke="#c6bae3" stroke-width="3" fill="#f2eeff"/><text x="743" y="286" font-size="29" text-anchor="middle" font-weight="700" fill="#244969">音声</text><text x="743" y="396" font-size="42" text-anchor="middle" font-weight="700" fill="#244969">♪</text><rect x="901" y="213" width="258" height="316" rx="20" stroke="#add6bf" stroke-width="3" fill="#e7f7ee"/><text x="1030" y="286" font-size="29" text-anchor="middle" font-weight="700" fill="#244969">動画</text><text x="1030" y="396" font-size="42" text-anchor="middle" font-weight="700" fill="#244969">▶</text><text x="600" y="585" font-size="23" text-anchor="middle" font-weight="700" fill="#244969">違う種類の情報を、一つの質問に使うことができる</text><text x="600" y="643" font-size="16" text-anchor="middle" font-weight="700" fill="#7e91a0">AI Portal｜理解のための模式図。特定モデルの内部構造ではありません。</text></g></svg>