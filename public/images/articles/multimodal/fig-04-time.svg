<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">動画には時間の流れがある</title><desc id="desc">机の上からボールが転がって床へ落ちる様子を3コマで示す。</desc><defs><linearGradient id="bg"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#effaf5"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#6090b6" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="75" font-size="39" text-anchor="middle" font-weight="700" fill="#193d62">動画には時間の流れがある</text><text x="600" y="120" font-size="22" text-anchor="middle" font-weight="700" fill="#67849b">位置だけでなく、順番も手掛かりになる</text><rect x="67" y="196" width="336" height="347" rx="20" stroke="#bdd6e5" stroke-width="3" fill="#fff"/><text x="243" y="257" font-size="28" text-anchor="middle" font-weight="700" fill="#244969">最初</text><path d="M114 426 H345" stroke="#bd9f80" stroke-width="14"/><circle cx="243" cy="347" r="32" fill="#e8967e" stroke="#bf6b59" stroke-width="4"/><text x="243" y="502" font-size="22" text-anchor="middle" font-weight="700" fill="#244969">机の上</text><rect x="429" y="196" width="336" height="347" rx="20" stroke="#bdd6e5" stroke-width="3" fill="#fff"/><text x="605" y="257" font-size="28" text-anchor="middle" font-weight="700" fill="#244969">次</text><path d="M476 426 H707" stroke="#bd9f80" stroke-width="14"/><circle cx="605" cy="375" r="32" fill="#e8967e" stroke="#bf6b59" stroke-width="4"/><text x="605" y="502" font-size="22" text-anchor="middle" font-weight="700" fill="#244969">端へ移動</text><rect x="791" y="196" width="336" height="347" rx="20" stroke="#bdd6e5" stroke-width="3" fill="#fff"/><text x="967" y="257" font-size="28" text-anchor="middle" font-weight="700" fill="#244969">最後</text><path d="M838 426 H1069" stroke="#bd9f80" stroke-width="14"/><circle cx="967" cy="463" r="32" fill="#e8967e" stroke="#bf6b59" stroke-width="4"/><text x="967" y="502" font-size="22" text-anchor="middle" font-weight="700" fill="#244969">下へ落ちる</text><text x="600" y="599" font-size="24" text-anchor="middle" font-weight="700" fill="#244969">一枚の静止画とは違い、前後の変化を扱う</text><text x="600" y="643" font-size="16" text-anchor="middle" font-weight="700" fill="#7e91a0">AI Portal｜理解のための模式図。特定モデルの内部構造ではありません。</text></g></svg>