<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">入力をつなげて回答する</title><desc id="desc">画像と音声の情報を数値として扱い、必要な情報を結び付けて答える概念図。</desc><defs><linearGradient id="bg"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#effaf5"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#6090b6" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="75" font-size="39" text-anchor="middle" font-weight="700" fill="#193d62">入力をつなげて回答する</text><text x="600" y="120" font-size="22" text-anchor="middle" font-weight="700" fill="#67849b">写真と質問を結び付ける</text><rect x="57" y="197" width="256" height="250" rx="20" stroke="#e0c3a7" stroke-width="3" fill="#fff1e5"/><text x="185" y="285" font-size="34" text-anchor="middle" font-weight="700" fill="#244969">写真</text><text x="185" y="371" font-size="26" text-anchor="middle" font-weight="700" fill="#244969">午後2時</text><rect x="345" y="197" width="256" height="250" rx="20" stroke="#a8cae5" stroke-width="3" fill="#e9f4ff"/><text x="473" y="285" font-size="34" text-anchor="middle" font-weight="700" fill="#244969">声</text><text x="473" y="371" font-size="25" text-anchor="middle" font-weight="700" fill="#244969">何時から？</text><path d="M620 325 H693" fill="none" stroke="#6090b6" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="711" y="197" width="421" height="250" rx="20" stroke="#aad6ba" stroke-width="3" fill="#e5f7ed"/><text x="921" y="275" font-size="28" text-anchor="middle" font-weight="700" fill="#28785a">情報を数値化</text><text x="921" y="344" font-size="26" text-anchor="middle" font-weight="700" fill="#28785a">関係付けて回答</text><text x="921" y="406" font-size="30" text-anchor="middle" font-weight="700" fill="#28785a">午後2時</text><text x="600" y="534" font-size="22" text-anchor="middle" font-weight="700" fill="#244969">音声を文字へ変換する方式も、音声を直接扱う方式もある</text><text x="600" y="643" font-size="16" text-anchor="middle" font-weight="700" fill="#7e91a0">AI Portal｜理解のための模式図。特定モデルの内部構造ではありません。</text></g></svg>