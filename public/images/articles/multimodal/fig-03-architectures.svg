<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">一つのモデルとは限らない</title><desc id="desc">マルチモーダルは一つのモデルによる方式と複数の処理をつなぐ方式がある。</desc><defs><linearGradient id="bg"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#effaf5"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#6090b6" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="75" font-size="39" text-anchor="middle" font-weight="700" fill="#193d62">一つのモデルとは限らない</text><text x="600" y="120" font-size="22" text-anchor="middle" font-weight="700" fill="#67849b">複数の機能をつなぐ方式もある</text><rect x="63" y="186" width="515" height="340" rx="20" stroke="#aecce6" stroke-width="3" fill="#eaf3ff"/><text x="320" y="251" font-size="29" text-anchor="middle" font-weight="700" fill="#244969">統合した一つのモデル</text><rect x="132" y="323" width="377" height="124" rx="20" stroke="#aecce6" stroke-width="3" fill="#fff"/><text x="320" y="380" font-size="26" text-anchor="middle" font-weight="700" fill="#244969">画像・音声・文字</text><text x="320" y="424" font-size="22" text-anchor="middle" font-weight="700" fill="#244969">まとめて扱う</text><rect x="615" y="186" width="522" height="340" rx="20" stroke="#b2d8c5" stroke-width="3" fill="#e9f8f0"/><text x="876" y="251" font-size="29" text-anchor="middle" font-weight="700" fill="#244969">複数の仕組みを連携</text><rect x="648" y="324" width="152" height="119" rx="20" stroke="#b2d8c5" stroke-width="3" fill="#fff"/><text x="724" y="377" font-size="22" text-anchor="middle" font-weight="700" fill="#244969">音声</text><text x="724" y="411" font-size="20" text-anchor="middle" font-weight="700" fill="#244969">処理</text><rect x="814" y="324" width="152" height="119" rx="20" stroke="#b2d8c5" stroke-width="3" fill="#fff"/><text x="890" y="377" font-size="22" text-anchor="middle" font-weight="700" fill="#244969">画像</text><text x="890" y="411" font-size="20" text-anchor="middle" font-weight="700" fill="#244969">処理</text><rect x="980" y="324" width="152" height="119" rx="20" stroke="#b2d8c5" stroke-width="3" fill="#fff"/><text x="1056" y="377" font-size="22" text-anchor="middle" font-weight="700" fill="#244969">回答</text><text x="1056" y="411" font-size="20" text-anchor="middle" font-weight="700" fill="#244969">作成</text><text x="600" y="591" font-size="23" text-anchor="middle" font-weight="700" fill="#244969">アプリの見た目だけでは内部構造は分からない</text><text x="600" y="643" font-size="16" text-anchor="middle" font-weight="700" fill="#7e91a0">AI Portal｜理解のための模式図。特定モデルの内部構造ではありません。</text></g></svg>