<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">写真と声を、一緒に使うAI</title><desc id="desc">イベントのポスター写真には午後2時の文字があり、声の質問『何時から？』と合わせて回答を出す例。</desc><defs><linearGradient id="bg"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#effaf5"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#6090b6" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="75" font-size="39" text-anchor="middle" font-weight="700" fill="#193d62">写真と声を、一緒に使うAI</text><text x="600" y="120" font-size="22" text-anchor="middle" font-weight="700" fill="#67849b">イベントポスターに声で質問</text><rect x="75" y="178" width="473" height="362" rx="20" stroke="#bdd6e5" stroke-width="3" fill="#fff"/><rect x="124" y="226" width="373" height="256" rx="20" stroke="#e2c6a5" stroke-width="3" fill="#fff3e2"/><text x="310" y="293" font-size="36" text-anchor="middle" font-weight="700" fill="#8a674a">秋の音楽会</text><text x="310" y="380" font-size="28" text-anchor="middle" font-weight="700" fill="#8a674a">日曜日 午後2時</text><rect x="655" y="178" width="473" height="158" rx="20" stroke="#b4d1e5" stroke-width="3" fill="#e9f4ff"/><text x="894" y="244" font-size="25" text-anchor="middle" font-weight="700" fill="#244969">声の質問</text><text x="894" y="297" font-size="35" text-anchor="middle" font-weight="700" fill="#244969">何時から？</text><rect x="655" y="373" width="473" height="167" rx="20" stroke="#a7d4b9" stroke-width="3" fill="#e6f7ef"/><text x="894" y="439" font-size="27" text-anchor="middle" font-weight="700" fill="#257858">AIの回答</text><text x="894" y="495" font-size="34" text-anchor="middle" font-weight="700" fill="#257858">午後2時です</text><path d="M558 343 H641" fill="none" stroke="#6090b6" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M894 344 V362" fill="none" stroke="#6090b6" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600" y="596" font-size="27" text-anchor="middle" font-weight="700" fill="#244969">写真と声の情報を結び付ける</text><text x="600" y="643" font-size="16" text-anchor="middle" font-weight="700" fill="#7e91a0">AI Portal｜理解のための模式図。特定モデルの内部構造ではありません。</text></g></svg>