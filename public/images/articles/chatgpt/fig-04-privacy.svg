<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">入力前に確認する三つのこと</title><desc id="d">AIへ情報を渡す前に公開情報・必要な情報・個人情報を分けてチェックする図</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" stroke="#759cbf" fill="none" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="#fbfdff"/><circle cx="1075" cy="96" r="145" fill="#edf5ff"/><circle cx="80" cy="602" r="115" fill="#fff5e7"/><g font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif"><text x="600" y="77" font-size="38" fill="#24445e" font-weight="700" text-anchor="middle">入力前に確認する三つのこと</text><rect x="62" y="174" width="333" height="240" rx="24" fill="#e5f7ed" stroke="#c3d5e2" stroke-width="2.5"/><text x="228.5" y="283.605" font-size="27" fill="#24445e" font-weight="700" text-anchor="middle">公開してよい情報</text><text x="228.5" y="322.755" font-size="27" fill="#24445e" font-weight="700" text-anchor="middle">例：清掃予定の案内</text><rect x="434" y="174" width="333" height="240" rx="24" fill="#e9f3ff" stroke="#c3d5e2" stroke-width="2.5"/><text x="600.5" y="283.605" font-size="27" fill="#24445e" font-weight="700" text-anchor="middle">作業に必要な情報</text><text x="600.5" y="322.755" font-size="27" fill="#24445e" font-weight="700" text-anchor="middle">例：集合時刻と持ち物</text><rect x="805" y="174" width="333" height="240" rx="24" fill="#fff0e7" stroke="#c3d5e2" stroke-width="2.5"/><text x="971.5" y="283.605" font-size="27" fill="#24445e" font-weight="700" text-anchor="middle">渡さない情報</text><text x="971.5" y="322.755" font-size="27" fill="#24445e" font-weight="700" text-anchor="middle">例：名簿や電話番号</text><rect x="198" y="470" width="811" height="102" rx="24" fill="#eaeafb" stroke="#c3d5e2" stroke-width="2.5"/><text x="603.5" y="511.375" font-size="25" fill="#24445e" font-weight="700" text-anchor="middle">共有する前に内容・設定・相手を確認</text><text x="603.5" y="547.625" font-size="25" fill="#24445e" font-weight="700" text-anchor="middle">必要ない個人情報は送らない</text><text x="600" y="628" font-size="18" fill="#617a8e" font-weight="700" text-anchor="middle">AI Portal｜教育用の模式図。実際の製品画面・動作とは異なります。</text></g></svg>