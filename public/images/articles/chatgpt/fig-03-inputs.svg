<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ChatGPTに渡せる情報の例</title><desc id="d">文章・画像・ファイル・音声を入力に用いる場合と、生成内容を人が確認する構成を図示</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" stroke="#759cbf" fill="none" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="#fbfdff"/><circle cx="1075" cy="96" r="145" fill="#edf5ff"/><circle cx="80" cy="602" r="115" fill="#fff5e7"/><g font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif"><text x="600" y="77" font-size="38" fill="#24445e" font-weight="700" text-anchor="middle">ChatGPTに渡せる情報の例</text><rect x="54" y="154" width="235" height="143" rx="24" fill="#e8f4ff" stroke="#c3d5e2" stroke-width="2.5"/><text x="171.5" y="215.875" font-size="25" fill="#24445e" font-weight="700" text-anchor="middle">文字の質問</text><text x="171.5" y="252.125" font-size="25" fill="#24445e" font-weight="700" text-anchor="middle">清掃の案内文</text><rect x="324" y="154" width="234" height="143" rx="24" fill="#fff2dd" stroke="#c3d5e2" stroke-width="2.5"/><text x="441" y="215.875" font-size="25" fill="#24445e" font-weight="700" text-anchor="middle">写真や画像</text><text x="441" y="252.125" font-size="25" fill="#24445e" font-weight="700" text-anchor="middle">古いポスター</text><rect x="594" y="154" width="234" height="143" rx="24" fill="#e8f7ec" stroke="#c3d5e2" stroke-width="2.5"/><text x="711" y="215.875" font-size="25" fill="#24445e" font-weight="700" text-anchor="middle">ファイル</text><text x="711" y="252.125" font-size="25" fill="#24445e" font-weight="700" text-anchor="middle">お知らせPDF</text><rect x="864" y="154" width="278" height="143" rx="24" fill="#eee9ff" stroke="#c3d5e2" stroke-width="2.5"/><text x="1003" y="215.875" font-size="25" fill="#24445e" font-weight="700" text-anchor="middle">声・音声</text><text x="1003" y="252.125" font-size="25" fill="#24445e" font-weight="700" text-anchor="middle">聞きたいこと</text><path d="M605 320