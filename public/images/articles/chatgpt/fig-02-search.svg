<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">検索が使えると何が変わる？</title><desc id="d">検索しない回答は学習済みモデルを利用し、検索すると外部の情報源を使える場合があると比較</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" stroke="#759cbf" fill="none" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="#fbfdff"/><circle cx="1075" cy="96" r="145" fill="#edf5ff"/><circle cx="80" cy="602" r="115" fill="#fff5e7"/><g font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif"><text x="600" y="77" font-size="38" fill="#24445e" font-weight="700" text-anchor="middle">検索が使えると何が変わる？</text><rect x="61" y="157" width="516" height="101" rx="24" fill="#fff1df" stroke="#c3d5e2" stroke-width="2.5"/><text x="319" y="216.68" font-size="27" fill="#24445e" font-weight="700" text-anchor="middle">① 検索しない場合</text><rect x="61" y="294" width="516" height="168" rx="24" fill="#fff9ee" stroke="#c3d5e2" stroke-width="2.5"/><text x="319" y="367.98999999999995" font-size="26" fill="#24445e" font-weight="700" text-anchor="middle">質問 → モデル</text><text x="319" y="405.69" font-size="26" fill="#24445e" font-weight="700" text-anchor="middle">学習済みの情報を使う</text><rect x="625" y="157" width="516" height="101" rx="24" fill="#e6f4ff" stroke="#c3d5e2" stroke-width="2.5"/><text x="883" y="216.68" font-size="27" fill="#24445e" font-weight="700" text-anchor="middle">② 検索する場合</text><rect x="625" y="294" width="516" height="168" rx="24" fill="#e8f6ef" stroke="#c3d5e2" stroke-width="2.5"/><text x="883" y="368.375" font-size="25" fill="#24445e" font-weight="700" text-anchor="middle">質問 → ウェブ検索 → モデル</text><text x="883" y="404.625" font-size="25" fill="#24445e" font-weight="700" text-anchor="middle">引用元と更新日を確認</text><rect x="169" y="511" width="875" height="76" rx="24" fill="#e9edff" stroke="#c3d5e2" stroke-width="2.5"/><text x="606.5" y="557.16" font-size="24" fill="#24445e" font-weight="700" text-anchor="middle">検索できても、資料の正しさを確認する必要があります</text><text x="600" y="628" font-size="18" fill="#617a8e" font-weight="700" text-anchor="middle">AI Portal｜教育用の模式図。実際の製品画面・動作とは異なります。</text></g></svg>