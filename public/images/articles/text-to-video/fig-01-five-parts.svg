<title id="t">プロンプトを五つに分ける</title><desc id="d">被写体・動作・場所と時間・カメラ・雰囲気の五つの観点から同じ映像を設計。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9ea"/><stop offset="1" stop-color="#eaf8fb"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)" stroke="none" stroke-width="0"/><circle cx="1110" cy="83" r="70" fill="#d7efe1" stroke="none" stroke-width="0"/><circle cx="68" cy="600" r="75" fill="#ffe3d2" stroke="none" stroke-width="0"/><rect x="45" y="35" width="1110" height="103" rx="26" fill="#fff" stroke="none" stroke-width="0"/><text x="600" y="100" fill="#274456" text-anchor="middle" font-size="37" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">文章を「映像の設計図」にする五つの欄</text><rect x="38" y="223" width="212" height="268" rx="22" fill="#d9eef7" stroke="#b3cdd1" stroke-width="2"/><circle cx="144" cy="274" r="31" fill="#fff" stroke="#b3cdd1" stroke-width="2"/><text x="144" y="285" fill="#4386a3" text-anchor="middle" font-size="28" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">1</text><text x="144" y="362" fill="#274456" text-anchor="middle" font-size="27" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">被写体</text><text x="144" y="420" fill="#566f7d" text-anchor="middle" font-size="18" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">クロワッサン一つ</text><rect x="269" y="223" width="212" height="268" rx="22" fill="#d7efe1" stroke="#b3cdd1" stroke-width="2"/><circle cx="375" cy="274" r="31" fill="#fff" stroke="#b3cdd1" stroke-width="2"/><text x="375" y="285" fill="#4386a3" text-anchor="middle" font-size="28" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">2</text><text x="375" y="362" fill="#274456" text-anchor="middle" font-size="27" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">動作</text><text x="375" y="420" fill="#566f7d" text-anchor="middle" font-size="18" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">湯気がゆっくり上がる</text><rect x="500" y="223" width="212" height="268" rx="22" fill="#ffe3d2" stroke="#b3cdd1" stroke-width="2"/><circle cx="606" cy="274" r="31" fill="#fff" stroke="#b3cdd1" stroke-width="2"/><text x="606" y="285" fill="#4386a3" text-anchor="middle" font-size="28" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">3</text><text x="606" y="362" fill="#274456" text-anchor="middle" font-size="27" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">場面</text><text x="606" y="420" fill="#566f7d" text-anchor="middle" font-size="18" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">パン屋の朝・窓際</text><rect x="731" y="223" width="212" height="268" rx="22" fill="#fff7e8" stroke="#b3cdd1" stroke-width="2"/><circle cx="837" cy="274" r="31" fill="#fff" stroke="#b3cdd1" stroke-width="2"/><text x="837" y="285" fill="#4386a3" text-anchor="middle" font-size="28" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">4</text><text x="837" y="362" fill="#274456" text-anchor="middle" font-size="27" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">カメラ</text><text x="837" y="420" fill="#566f7d" text-anchor="middle" font-size="18" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">固定した視点</text><rect x="962" y="223" width="212" height="268" rx="22" fill="#d9eef7" stroke="#b3cdd1" stroke-width="2"/><circle cx="1068" cy="274" r="31" fill="#fff" stroke="#b3cdd1" stroke-width="2"/><text x="1068" y="285" fill="#4386a3" text-anchor="middle" font-size="28" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">5</text><text x="1068" y="362" fill="#274456" text-anchor="middle" font-size="27" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">雰囲気</text><text x="1068" y="420" fill="#566f7d" text-anchor="middle" font-size="18" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">静かで温かい</text><rect x="132" y="530" width="936" height="63" rx="18" fill="#fff" stroke="#b3cdd1" stroke-width="2"/><text x="600" y="570" fill="#274456" text-anchor="middle" font-size="26" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">すべてを書く必要はない。大切な要素から具体化する。</text>
<text x="1138" y="649" fill="#566f7d" text-anchor="end" font-size="18" font-weight="400" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">AI Portal ｜ イメージ図</text>
