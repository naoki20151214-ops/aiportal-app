<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">主役・動き・視点を検査し直す改善フロー</title><desc id="d">映像の失敗を主役の違い・動きの違い・視点の違いへ切り分け、プロンプトを一か所ずつ見直す。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9ea"/><stop offset="1" stop-color="#eaf8fb"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)" stroke="none" stroke-width="0"/><circle cx="1110" cy="83" r="70" fill="#d7efe1" stroke="none" stroke-width="0"/><circle cx="68" cy="600" r="75" fill="#ffe3d2" stroke="none" stroke-width="0"/><rect x="42" y="33" width="1116" height="106" rx="25" fill="#fff" stroke="none" stroke-width="0"/><text x="600" y="101" fill="#274456" text-anchor="middle" font-size="40" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">失敗を一つずつ切り分ける</text><rect x="46" y="201" width="347" height="350" rx="25" fill="#d9eef7" stroke="#b3cdd1" stroke-width="2"/><text x="219" y="266" fill="#274456" text-anchor="middle" font-size="29" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">主役が違う</text><text x="219" y="332" fill="#566f7d" text-anchor="middle" font-size="23" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">何を一番見せたい？</text><rect x="69" y="375" width="300" height="92" rx="17" fill="#fff" stroke="none" stroke-width="0"/><text x="219" y="430" fill="#274456" text-anchor="middle" font-size="20" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">クロワッサンを中心に</text><rect x="429" y="201" width="347" height="350" rx="25" fill="#d7efe1" stroke="#b3cdd1" stroke-width="2"/><text x="602" y="266" fill="#274456" text-anchor="middle" font-size="29" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">動きが違う</text><text x="602" y="332" fill="#566f7d" text-anchor="middle" font-size="23" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">何を動かしたい？</text><rect x="452" y="375" width="300" height="92" rx="17" fill="#fff" stroke="none" stroke-width="0"/><text x="602" y="430" fill="#274456" text-anchor="middle" font-size="20" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">パンは固定・湯気を動かす</text><rect x="812" y="201" width="347" height="350" rx="25" fill="#ffe3d2" stroke="#b3cdd1" stroke-width="2"/><text x="985" y="266" fill="#274456" text-anchor="middle" font-size="29" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">カメラが違う</text><text x="985" y="332" fill="#566f7d" text-anchor="middle" font-size="23" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">視点をどう見せたい？</text><rect x="835" y="375" width="300" height="92" rx="17" fill="#fff" stroke="none" stroke-width="0"/><text x="985" y="430" fill="#274456" text-anchor="middle" font-size="20" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">カメラを固定する</text><text x="600" y="603" fill="#274456" text-anchor="middle" font-size="26" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">違う場所を確認 → 一つ修正 → 再生成後に確認</text>
<text x="1138" y="649" fill="#566f7d" text-anchor="end" font-size="18" font-weight="400" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">AI Portal ｜ イメージ図</text>
</svg>
