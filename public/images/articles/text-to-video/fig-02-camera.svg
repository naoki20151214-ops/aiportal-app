<title id="t">固定・パン・ドリー：視点の動かし方</title><desc id="d">固定はカメラ位置と向きがそのまま、パンは位置を変えず横に向きを回す、ドリーはカメラごと前進する。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9ea"/><stop offset="1" stop-color="#eaf8fb"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)" stroke="none" stroke-width="0"/><circle cx="1110" cy="83" r="70" fill="#d7efe1" stroke="none" stroke-width="0"/><circle cx="68" cy="600" r="75" fill="#ffe3d2" stroke="none" stroke-width="0"/><rect x="42" y="33" width="1116" height="103" rx="26" fill="#fff" stroke="none" stroke-width="0"/><text x="600" y="100" fill="#274456" text-anchor="middle" font-size="37" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">カメラを止める？ 向ける？ 近づける？</text><rect x="48" y="175" width="347" height="387" rx="26" fill="#d9eef7" stroke="#b3cdd1" stroke-width="2"/><text x="222" y="235" fill="#274456" text-anchor="middle" font-size="33" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">固定カメラ</text><text x="222" y="276" fill="#566f7d" text-anchor="middle" font-size="22" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">視点は動かない</text><rect x="101" y="328" width="244" height="148" rx="20" fill="#fff" stroke="none" stroke-width="0"/><g transform="translate(223 397) scale(0.45)"><path d="M-76 30Q-104 -12 -49 -42Q-2 -75 62 -36Q102 -3 67 33Q16 53 -66 42Z" fill="#f6be73" stroke="#9b693f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-38 -43Q-47 5 -15 40M-1 -53Q-9 5 22 40M37 -45Q19 1 49 28" fill="none" stroke="#d18d55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M143 512L170 492L198 513" fill="none" stroke="#274456" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="429" y="175" width="347" height="387" rx="26" fill="#fff7e8" stroke="#b3cdd1" stroke-width="2"/><text x="603" y="235" fill="#274456" text-anchor="middle" font-size="33" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">パン</text><text x="603" y="276" fill="#566f7d" text-anchor="middle" font-size="22" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">その場で横を向く</text><rect x="482" y="328" width="244" height="148" rx="20" fill="#fff" stroke="none" stroke-width="0"/><g transform="translate(604 397) scale(0.45)"><path d="M-76 30Q-104 -12 -49 -42Q-2 -75 62 -36Q102 -3 67 33Q16 53 -66 42Z" fill="#f6be73" stroke="#9b693f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-38 -43Q-47 5 -15 40M-1 -53Q-9 5 22 40M37 -45Q19 1 49 28" fill="none" stroke="#d18d55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M524 512L551 492L579 513" fill="none" stroke="#274456" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="810" y="175" width="347" height="387" rx="26" fill="#d7efe1" stroke="#b3cdd1" stroke-width="2"/><text x="984" y="235" fill="#274456" text-anchor="middle" font-size="33" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">ドリーイン</text><text x="984" y="276" fill="#566f7d" text-anchor="middle" font-size="22" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">カメラごと近づく</text><rect x="863" y="328" width="244" height="148" rx="20" fill="#fff" stroke="none" stroke-width="0"/><g transform="translate(985 397) scale(0.45)"><path d="M-76 30Q-104 -12 -49 -42Q-2 -75 62 -36Q102 -3 67 33Q16 53 -66 42Z" fill="#f6be73" stroke="#9b693f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-38 -43Q-47 5 -15 40M-1 -53Q-9 5 22 40M37 -45Q19 1 49 28" fill="none" stroke="#d18d55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M905 512L932 492L960 513" fill="none" stroke="#274456" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M562 480Q600 441 637 480" fill="none" stroke="#b47a4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M996 478L1070 478M1057 469L1070 478L1057 487" fill="n