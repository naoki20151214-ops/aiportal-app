<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">RAGの三つの仕事</title><desc id="d">Retrieveで関連資料を検索し、Augmentで質問に資料を添え、GenerateでLLMが回答を生成する3段階。</desc><defs><marker id="tip" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L12 6.5 L1 12" stroke="#6f98b6" stroke-width="2" fill="none" stroke-linejoin="round"/></marker><linearGradient id="wash" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset=".52" stop-color="#fffcf5"/><stop offset="1" stop-color="#f0f8f5"/></linearGradient></defs><rect width="1200" height="675" fill="url(#wash)"/><circle cx="1081" cy="86" r="118" fill="#e6f1ff" opacity=".67"/><circle cx="95" cy="621" r="142" fill="#fce8dc" opacity=".55"/><g font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">
<text x="600" y="73" text-anchor="middle" font-size="42" font-weight="700" fill="#203b59">RAGは３つの仕事をつなげる</text>
<rect x="53" y="146" width="341" height="352" rx="22" fill="#e9f3ff" stroke="#b8cbd9" stroke-width="3"/>
<rect x="430" y="146" width="341" height="352" rx="22" fill="#f1edff" stroke="#b8cbd9" stroke-width="3"/>
<rect x="807" y="146" width="341" height="352" rx="22" fill="#e4f6ec" stroke="#b8cbd9" stroke-width="3"/>
<text x="223" y="203" text-anchor="middle" font-size="33" font-weight="700" fill="#203b59">① Retrieve</text><text x="600" y="203" text-anchor="middle" font-size="33" font-weight="700" fill="#203b59">② Augment</text><text x="978" y="203" text-anchor="middle" font-size="33" font-weight="700" fill="#203b59">③ Generate</text>
<text x="223" y="247" text-anchor="middle" font-size="29" font-weight="700" fill="#203b59">資料を探す</text><text x="600" y="247" text-anchor="middle" font-size="27" font-weight="700" fill="#203b59">質問と資料を合わせる</text><text x="978" y="247" text-anchor="middle" font-size="29" font-weight="700" fill="#203b59">回答を作る</text>
<g transform="translate(167 287)"><rect x="0" y="0" width="105" height="136" rx="12" fill="#ffffff" stroke="#b8cbd9" stroke-width="3"/><path d="M77 0V28H105" stroke="#b8cbd9" stroke-width="2" fill="#bad8f7"/><rect x="18" y="41" width="68" height="8" rx="4" fill="#bad8f7"/><rect x="18" y="65" width="60" height="7" rx="3" fill="#d1dae0"/><rect x="18" y="87" width="55" height="7" rx="3" fill="#d1dae0"/><rect x="18" y="109" width="45" height="7" rx="3" fill="#d1dae0"/></g>
<rect x="505" y="301" width="196" height="66" rx="22" fill="#ffffff" stroke="#b8cbd9" stroke-width="3"/><text x="603" y="342" text-anchor="middle" font-size="24" font-weight="700" fill="#203b59">質問 ＋ 資料</text>
<g transform="translate(898 287) scale(0.9)"><ellipse cx="86" cy="203" rx="78" ry="18" fill="#a3bace" opacity=".2"/><path d="M22 108 Q10 113 10 139 L10 164 Q10 182 33 183 L140 183 Q163 181 163 165 L163 135 Q162 108 148 105Z" fill="#c9e4ff" stroke="#203b59" stroke-width="3"/><rect x="12" y="42" width="152" height="104" rx="35" fill="#ffffff" stroke="#203b59" stroke-width="4"/><rect x="35" y="72" width="106" height="56" rx="19" fill="#daedff"/><circle cx="64" cy="98" r="11" fill="#203b59"/><circle cx="111" cy="98" r="11" fill="#203b59"/><path d="M72 115 Q88 130 103 115" stroke="#203b59" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M87 41 V17" stroke="#203b59" stroke-width="4"/><circle cx="87" cy="14" r="11" fill="#ffcbb8" stroke="#203b59" stroke-width="3"/><circle cx="12" cy="141" r="11" fill="#a9d9c1" stroke="#203b59" stroke-width="2"/><circle cx="163" cy="141" r="11" fill="#a9d9c1" stroke="#203b59" stroke-width="2"/></g>
<text x="976" y="480" text-anchor="middle" font-size="27" font-weight="700" fill="#58728b">LLM</text>
