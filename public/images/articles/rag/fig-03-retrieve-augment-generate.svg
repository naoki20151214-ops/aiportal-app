<text x="223" y="551" text-anchor="middle" font-size="23" font-weight="700" fill="#58728b">見つからなければ</text>
<text x="223" y="581" text-anchor="middle" font-size="23" font-weight="700" fill="#58728b">無理に答えない</text>
<text x="599" y="552" text-anchor="middle" font-size="23" font-weight="700" fill="#58728b">関連する箇所だけ</text>
<text x="599" y="581" text-anchor="middle" font-size="23" font-weight="700" fill="#58728b">入力に追加</text>
<text x="978" y="552" text-anchor="middle" font-size="23" font-weight="700" fill="#58728b">出典と照合して</text>
<text x="978" y="581" text-anchor="middle" font-size="23" font-weight="700" fill="#58728b">正しさを確認</text>
<text x="1162" y="652" text-anchor="end" font-size="17" fill="#58728b">AI Portal｜教育用の模式図</text></g></svg>