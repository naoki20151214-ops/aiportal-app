<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">RAGとは？資料を探してから答える</title><desc id="d">町内会の質問を受け、AIロボットが掲示板から更新版の案内を見つけ、その内容に沿って回答するイメージ。</desc><defs><marker id="tip" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L12 6.5 L1 12" stroke="#6f98b6" stroke-width="2" fill="none" stroke-linejoin="round"/></marker><linearGradient id="wash" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset=".52" stop-color="#fffcf5"/><stop offset="1" stop-color="#f0f8f5"/></linearGradient></defs><rect width="1200" height="675" fill="url(#wash)"/><circle cx="1081" cy="86" r="118" fill="#e6f1ff" opacity=".67"/><circle cx="95" cy="621" r="142" fill="#fce8dc" opacity=".55"/><g font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif">
