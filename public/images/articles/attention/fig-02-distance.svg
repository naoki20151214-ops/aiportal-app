<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">離れた言葉の情報を参考にする</title><desc id="d">文章の中に挟まれた別の語を越えて対応を考えるイメージ。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6faff"/><stop offset="1" stop-color="#ecf8f7"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#5f80ab"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif"><text x="600" y="75" font-size="43" fill="#0e315d" font-weight="700" text-anchor="middle">隣の言葉だけでは足りない</text><text x="600" y="120" font-size="23" fill="#496987" font-weight="500" text-anchor="middle">遠くの言葉も、いま処理する位置の計算に関係することがあります</text><rect x="70" y="230" width="237" height="130" rx="22" fill="#e7f4ff" stroke="#81b4dc" stroke-width="3"/><text x="188" y="304" font-size="37" fill="#1c6499" font-weight="700" text-anchor="middle">帽子</text><rect x="340" y="230" width="237" height="130" rx="22" fill="#fff" stroke="#d2dfec" stroke-width="3"/><text x="459" y="302" font-size="30" fill="#667b93" font-weight="700" text-anchor="middle">途中の言葉</text><rect x="610" y="230" width="237" height="130" rx="22" fill="#fff" stroke="#d2dfec" stroke-width="3"/><text x="729" y="302" font-size="28" fill="#667b93" font-weight="700" text-anchor="middle">さらに別の語</text><rect x="882" y="230" width="237" height="130" rx="22" fill="#e2f4ee" stroke="#79bea7" stroke-width="3"/><text x="999" y="304" font-size="37" fill="#176a53" font-weight="700" text-anchor="middle">それ</text><path d="M188 219 Q590 82 999 219" fill="none" stroke="#438cc8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M980 206 L1004 224 L1016 195" fill="none" stroke="#438cc8" stroke-width="7" stroke-linejoin="round"/><rect x="245" y="427" width="710" height="112" rx="20" fill="#fff" stroke="#b7d6e2" stroke-width="2"/><text x="600" y="475" font-size="30" fill="#295e8b" font-weight="700" text-anchor="middle">文章の位置の距離だけでは決まらない</text><text x="600" y="518" font-size="25" fill="#416d83" font-weight="500" text-anchor="middle">どの位置の情報を利用するかを計算する</text><text x="600" y="618" font-size="19" fill="#667e97" font-weight="500" text-anchor="middle">図中の弧は、実際に学習された対応を示すものではありません</text><text x="600" y="650" font-size="16" fill="#7691aa" font-weight="500" text-anchor="middle">AI Portal ｜ 学習用の模式図・実際のAttentionの重みを表すものではありません</text></g></svg>