<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">動詞が変わると「それ」の解釈も変わる</title><desc id="d">かぶる→帽子、履く→靴の二つの文章で文脈の必要性を示す。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6faff"/><stop offset="1" stop-color="#ecf8f7"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#5f80ab"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif"><text x="600" y="75" font-size="43" fill="#0e315d" font-weight="700" text-anchor="middle">たった一語で、手掛かりが変わる</text><text x="600" y="120" font-size="23" fill="#496987" font-weight="500" text-anchor="middle">前半の単語が同じでも、「かぶる」と「履く」で解釈が変わります</text><rect x="80" y="183" width="1040" height="165" rx="24" fill="#ffffff" stroke="#bbd7ec" stroke-width="3"/><text x="142" y="233" font-size="24" fill="#47718e" font-weight="700" text-anchor="start">文章 A</text><text x="156" y="297" font-size="40" fill="#2669a7" font-weight="700" text-anchor="start">帽子</text><text x="286" y="297" font-size="32" fill="#16365f" font-weight="700" text-anchor="start">と</text><text x="350" y="297" font-size="40" fill="#b95851" font-weight="700" text-anchor="start">靴</text><text x="490" y="297" font-size="30" fill="#16365f" font-weight="700" text-anchor="start">→ それを</text><rect x="694" y="245" width="195" height="62" rx="16" fill="#def2ea" stroke="#84b8a7" stroke-width="2"/><text x="790" y="290" font-size="33" fill="#137058" font-weight="700" text-anchor="middle">かぶった</text><text x="952" y="292" font-size="30" fill="#2669a7" font-weight="700" text-anchor="start">帽子</text><rect x="80" y="365" width="1040" height="165" rx="24" fill="#ffffff" stroke="#e8c5bb" stroke-width="3"/><text x="142" y="413" font-size="24" fill="#ad6559" font-weight="700" text-anchor="start">文章 B</text><text x="156" y="476" font-size="40" fill="#2669a7" font-weight="700" text-anchor="start">帽子</text><text x="286" y="476" font-size="32" fill="#16365f" font-weight="700" text-anchor="start">と</text><text x="350" y="476" font-size="40" fill="#b95851" font-weight="700" text-anchor="start">靴</text><text x="490" y="476" font-size="30" fill="#16365f" font-weight="700" text-anchor="start">→ それを</text><rect x="694" y="425" width="195" height="62" rx="16" fill="#fff0e9" stroke="#e8b8ac" stroke-width="2"/><text x="790" y="471" font-size="33" fill="#a7473e" font-weight="700" text-anchor="middle">履いた</text><text x="952" y="471" font-size="30" fill="#b95851" font-weight="700" text-anchor="start">靴</text><text x="600" y="618" font-size="19" fill="#667e97" font-weight="500" text-anchor="middle">この例は仕組みを学ぶための文章例です</text><text x="600" y="650" font-size="16" fill="#7691aa" font-weight="500" text-anchor="middle">AI Portal ｜ 学習用の模式図・実際のAttentionの重みを表すものではありません</text></g></svg>