<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Attentionで情報を混ぜて別の表現を作る</title><desc id="d">複数位置から数値の情報を集め、更新用の数値表現ができる模式図。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6faff"/><stop offset="1" stop-color="#ecf8f7"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#5f80ab"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif"><text x="600" y="75" font-size="43" fill="#0e315d" font-weight="700" text-anchor="middle">別の位置の「数値情報」を取り込む</text><text x="600" y="120" font-size="23" fill="#496987" font-weight="500" text-anchor="middle">文字を交換するのではなく、ベクトルを計算します</text><rect x="82" y="180" width="320" height="112" rx="18" fill="#e3f3ff" stroke="#91bfdf" stroke-width="3"/><text x="243" y="224" font-size="29" fill="#235f91" font-weight="700" text-anchor="middle">「帽子」の位置</text><text x="243" y="270" font-size="25" fill="#4c7797" font-weight="500" text-anchor="middle">数値情報 A</text><rect x="82" y="320" width="320" height="112" rx="18" fill="#fff0ed" stroke="#e4b5ae" stroke-width="3"/><text x="243" y="366" font-size="29" fill="#ac5149" font-weight="700" text-anchor="middle">「靴」の位置</text><text x="243" y="410" font-size="25" fill="#a4706b" font-weight="500" text-anchor="middle">数値情報 B</text><rect x="82" y="460" width="320" height="112" rx="18" fill="#eeecff" stroke="#cbc6e9" stroke-width="3"/><text x="243" y="505" font-size="29" fill="#6055aa" font-weight="700" text-anchor="middle">「それ」の位置</text><text x="243" y="548" font-size="25" fill="#8077b2" font-weight="500" text-anchor="middle">数値情報 C</text><path d="M411 239 Q575 235 692 360" fill="none" stroke="#5a99c6" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M411 379 H692" fill="none" stroke="#d88880" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M411 516 Q575 522 692 401" fill="none" stroke="#8f86b7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><rect x="703" y="267" width="415" height="205" rx="22" fill="#e7f5ed" stroke="#86c8b0" stroke-width="4"/><text x="912" y="329" font-size="31" fill="#1d7258" font-weight="700" text-anchor="middle">「それ」の位置に</text><text x="912" y="383" font-size="35" fill="#1d7258" font-weight="700" text-anchor="middle">新しい計算結果</text><text x="912" y="430" font-size="27" fill="#417a68" font-weight="500" text-anchor="middle">（数値表現）</text><text x="600" y="618" font-size="19" fill="#667e97" font-weight="500" text-anchor="middle">矢印の太さは説明上の演出であり、実際の重みではありません</text><text x="600" y="650" font-size="16" fill="#7691aa" font-weight="500" text-anchor="middle">AI Portal ｜ 学習用の模式図・実際のAttentionの重みを表すものではありません</text></g></svg>