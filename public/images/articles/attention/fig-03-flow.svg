<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Attentionの対応から情報取り込みまで</title><desc id="d">関連を計算、重みを決定、数値情報を組み合わせる、の三段階。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6faff"/><stop offset="1" stop-color="#ecf8f7"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#5f80ab"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif"><text x="600" y="75" font-size="43" fill="#0e315d" font-weight="700" text-anchor="middle">「参考先を決める」だけでは終わらない</text><text x="600" y="120" font-size="23" fill="#496987" font-weight="500" text-anchor="middle">情報を取り込んで初めて、更新に使う計算結果になります</text><rect x="65" y="200" width="300" height="245" rx="23" fill="#e9f4ff" stroke="#a6cae9" stroke-width="3"/><text x="215" y="268" font-size="32" fill="#245f96" font-weight="700" text-anchor="middle">① 対応を計算</text><text x="215" y="324" font-size="24" fill="#466c89" font-weight="500" text-anchor="middle">各位置の数値表現</text><text x="215" y="369" font-size="24" fill="#466c89" font-weight="500" text-anchor="middle">同士を計算する</text><rect x="451" y="200" width="300" height="245" rx="23" fill="#f2f3ff" stroke="#bdbbe6" stroke-width="3"/><text x="601" y="268" font-size="32" fill="#5e54a5" font-weight="700" text-anchor="middle">② 重みを決める</text><text x="601" y="324" font-size="24" fill="#64608e" font-weight="500" text-anchor="middle">どの位置の情報を</text><text x="601" y="369" font-size="24" fill="#64608e" font-weight="500" text-anchor="middle">どれほど使うか</text><rect x="837" y="200" width="300" height="245" rx="23" fill="#e6f6ee" stroke="#9ccdb6" stroke-width="3"/><text x="987" y="268" font-size="32" fill="#26735e" font-weight="700" text-anchor="middle">③ 数値を混ぜる</text><text x="987" y="324" font-size="24" fill="#487668" font-weight="500" text-anchor="middle">参照先の数値情報を</text><text x="987" y="369" font-size="24" fill="#487668" font-weight="500" text-anchor="middle">重みに応じて足す</text><path d="M370 320 H445" fill="none" stroke="#6884ad" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M756 320 H830" fill="none" stroke="#6884ad" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="176" y="490" width="850" height="84" rx="20" fill="#fff" stroke="#d1e4ed" stroke-width="2"/><text x="601" y="540" font-size="29" fill="#235673" font-weight="700" text-anchor="middle">重みだけでなく、取り込む数値情報が必要</text><text x="600" y="618" font-size="19" fill="#667e97" font-weight="500" text-anchor="middle">この3段階は理解用の整理です。実装では行列計算等を用います</text><text x="600" y="650" font-size="16" fill="#7691aa" font-weight="500" text-anchor="middle">AI Portal ｜ 学習用の模式図・実際のAttentionの重みを表すものではありません</text></g></svg>