<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">因果マスクで未来の情報を参照しない</title><desc id="d">生成モデルの現在位置が過去と現在を参照でき未来を参照できない。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6faff"/><stop offset="1" stop-color="#ecf8f7"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#5f80ab"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif"><text x="600" y="75" font-size="43" fill="#0e315d" font-weight="700" text-anchor="middle">未来のTokenは参照できない</text><text x="600" y="120" font-size="23" fill="#496987" font-weight="500" text-anchor="middle">ChatGPT型の自己回帰モデルで使われるCausal Maskの考え方</text><rect x="77" y="183" width="1047" height="321" rx="24" fill="#fff" stroke="#cddfed" stroke-width="2"/><text x="600" y="237" font-size="29" fill="#264f78" font-weight="700" text-anchor="middle">いま処理中の位置から見た参照先</text><rect x="123" y="287" width="260" height="121" rx="18" fill="#e5f5ee" stroke="#a2cdbc" stroke-width="3"/><text x="253" y="345" font-size="31" fill="#24735f" font-weight="700" text-anchor="middle">過去の位置</text><text x="253" y="389" font-size="23" fill="#407765" font-weight="500" text-anchor="middle">参照できる</text><rect x="470" y="287" width="260" height="121" rx="18" fill="#e5f5ee" stroke="#a2cdbc" stroke-width="3"/><text x="600" y="345" font-size="31" fill="#24735f" font-weight="700" text-anchor="middle">現在の位置</text><text x="600" y="389" font-size="23" fill="#407765" font-weight="500" text-anchor="middle">参照できる</text><rect x="816" y="287" width="260" height="121" rx="18" fill="#fff1f0" stroke="#e9b5ad" stroke-width="3"/><text x="946" y="345" font-size="31" fill="#a34e47" font-weight="700" text-anchor="middle">未来の位置</text><text x="946" y="389" font-size="23" fill="#b3655e" font-weight="500" text-anchor="middle">参照できない</text><text x="252" y="458" font-size="36" fill="#16855e" font-weight="700" text-anchor="middle">✓</text><text x="600" y="458" font-size="36" fill="#16855e" font-weight="700" text-anchor="middle">✓</text><text x="946" y="458" font-size="36" fill="#b84d47" font-weight="700" text-anchor="middle">×</text><rect x="185" y="539" width="830" height="52" rx="14" fill="#e9f3fe" stroke="#c0d7ed" stroke-width="2"/><text x="600" y="573" font-size="22" fill="#416783" font-weight="500" text-anchor="middle">文章全体を見る別のモデルでは、制限が異なる場合もあります</text><text x="600" y="618" font-size="19" fill="#667e97" font-weight="500" text-anchor="middle">この図は参照可能な位置の違いを単純化したものです</text><text x="600" y="650" font-size="16" fill="#7691aa" font-weight="500" text-anchor="middle">AI Portal ｜ 学習用の模式図・実際のAttentionの重みを表すものではありません</text></g></svg>