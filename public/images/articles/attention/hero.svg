<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Attentionとは？ 青い帽子と赤い靴の例</title><desc id="d">それをかぶった、の「それ」がどちらなのかを考える。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6faff"/><stop offset="1" stop-color="#ecf8f7"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#5f80ab"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif"><text x="600" y="75" font-size="43" fill="#0e315d" font-weight="700" text-anchor="middle">「それをかぶった」の「それ」は？</text><text x="600" y="120" font-size="23" fill="#496987" font-weight="500" text-anchor="middle">昨日、青い帽子と赤い靴を買った。翌朝、それをかぶって出かけた。</text><rect x="105" y="178" width="425" height="285" rx="28" fill="#ecf6ff" stroke="#bddaf1" stroke-width="3"/><rect x="670" y="178" width="425" height="285" rx="28" fill="#fff1ef" stroke="#f4c4bd" stroke-width="3"/><g transform="translate(209 218) scale(0.95)"><path d="M20 118 H198 Q216 118 216 105 Q216 93 198 93 H181 L166 25 Q163 9 146 9 H68 Q52 9 47 25 L32 93 H18 Q0 93 0 105 Q0 118 20 118Z" fill="#68afd8" stroke="#397cae" stroke-width="6"/><path d="M37 89 H180" stroke="#ecfaff" stroke-width="12"/></g><g transform="translate(773 227) scale(0.95)"><path d="M12 102 Q27 92 52 76 L77 25 Q83 17 95 27 L126 63 Q163 68 191 81 Q215 96 215 115 Q215 132 195 132 H33 Q12 132 12 113Z" fill="#f1907f" stroke="#bf5856" stroke-width="6"/><path d="M82 66 L116 79 M75 81 L110 94" stroke="#fff8f2" stroke-width="7"/><path d="M20 113 H210" stroke="#fff7e8" stroke-width="10"/></g><text x="313" y="417" font-size="33" fill="#215a8e" font-weight="700" text-anchor="middle">青い帽子</text><text x="883" y="417" font-size="33" fill="#a44343" font-weight="700" text-anchor="middle">赤い靴</text><path d="M600 475 V510" fill="none" stroke="#5786a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M586 503 L600 521 L614 503" fill="none" stroke="#5786a8" stroke-width="5"/><rect x="335" y="518" width="530" height="65" rx="22" fill="#ffffff" stroke="#8ac4b6" stroke-width="3"/><text x="600" y="562" font-size="29" fill="#176b5a" font-weight="700" text-anchor="middle">文脈を手掛かりに考える</text><text x="600" y="607" font-size="19" fill="#64778e" font-weight="500" text-anchor="middle">人間の理解とAI内部の計算は同じではありません</text></g></svg>