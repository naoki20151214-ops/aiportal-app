<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">言葉から絵が生まれるまで</title><desc id="d">指示文から新しく水彩風の公園清掃イラストが生成される流れ</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#739cc2" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="#f9fcff"/><circle cx="1100" cy="95" r="125" fill="#edf4ff"/><circle cx="80" cy="591" r="140" fill="#fff7eb"/><g font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif"><text x="600" y="75" fill="#25415d" text-anchor="middle" font-size="38" font-weight="700">言葉から絵が生まれるまで</text><g transform="translate(45 240)"><path d="M35 25q40-20 75 2v118q-40-18-75 3z" fill="#fff" stroke="#5897d0" stroke-width="5"/><path d="M110 27q39-22 78 0v121q-40-19-78-3z" fill="#fffaf0" stroke="#5897d0" stroke-width="5"/><path d="M110 27v118" fill="none" stroke="#5897d0" stroke-width="4"/><path d="M55 52h36M55 69h36M129 52h39M129 69h39" stroke="#cbdce8" stroke-width="3"/></g><rect x="272" y="183" width="403" height="150" rx="22" fill="#e5f3ff" stroke="#c3d6df" stroke-width="2.5"/><text x="473.5" y="248.82" fill="#25415d" text-anchor="middle" font-size="27" font-weight="700">秋の公園で親子が</text><text x="473.5" y="285.54" fill="#25415d" text-anchor="middle" font-size="27" font-weight="700">落ち葉を集める絵</text><path d="M680 254L771 254" fill="none" stroke="#739cc2" stroke-width="5" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="793" y="158" width="351" height="204" rx="22" fill="#e4f7ed" stroke="#c3d6df" stroke-width="2.5"/><text x="968.5" y="250.14000000000001" fill="#25415d" text-anchor="middle" font-size="29" font-weight="700">AIが画像を生成</text><text x="968.5" y="289.58000000000004" fill="#25415d" text-anchor="middle" font-size="29" font-weight="700">やさしい水彩風</text><g><rect x="874" y="385" width="196" height="150" rx="12" fill="#fff" stroke="#609cc0" stroke-width="4"/><circle cx="921.04" cy="430" r="13.5" fill="#ffcf73"/><path d="M884 512.5l62.72 -67.5 41.16 30 31.36 -36 39.2 72" fill="#a6dbc0" stroke="#5eae90" stroke-width="3"/></g><text x="600" y="563" fill="#25415d" text-anchor="middle" font-size="25" font-weight="700">文章は完成した絵の設計図ではなく条件です</text><text x="600" y="635" fill="#25415d" text-anchor="middle" font-size="18" font-weight="700">AI Portal｜架空の例を使った模式図です</text></g></svg>