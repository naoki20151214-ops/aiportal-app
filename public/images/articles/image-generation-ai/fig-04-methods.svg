<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">画像生成には複数の方式がある</title><desc id="d">拡散モデルで繰り返しノイズを更新する方法と画像のトークンを順番に生成する方法を比べる</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#739cc2" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="#f9fcff"/><circle cx="1100" cy="95" r="125" fill="#edf4ff"/><circle cx="80" cy="591" r="140" fill="#fff7eb"/><g font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif"><text x="600" y="75" fill="#25415d" text-anchor="middle" font-size="38" font-weight="700">画像生成には複数の方式がある</text><rect x="58" y="170" width="514" height="107" rx="22" fill="#e5f3ff" stroke="#c3d6df" stroke-width="2.5"/><text x="315" y="233.36" fill="#25415d" text-anchor="middle" font-size="29" font-weight="700">拡散モデルの代表例</text><rect x="58" y="315" width="514" height="186" rx="22" fill="#e4f7ed" stroke="#c3d6df" stroke-width="2.5"/><text x="315" y="380.46" fill="#25415d" text-anchor="middle" font-size="27" font-weight="700">ノイズの表現を</text><text x="315" y="417.18" fill="#25415d" text-anchor="middle" font-size="27" font-weight="700">何段階かで更新</text><text x="315" y="453.9" fill="#25415d" text-anchor="middle" font-size="27" font-weight="700">→ 画像を作る</text><rect x="633" y="170" width="509" height="107" rx="22" fill="#f0edff" stroke="#c3d6df" stroke-width="2.5"/><text x="887.5" y="233.36" fill="#25415d" text-anchor="middle" font-size="29" font-weight="700">自己回帰的な方式</text><rect x="633" y="315" width="509" height="186" rx="22" fill="#ffefdc" stroke="#c3d6df" stroke-width="2.5"/><text x="887.5" y="380.46" fill="#25415d" text-anchor="middle" font-size="27" font-weight="700">画像を表す情報を</text><text x="887.5" y="417.18" fill="#25415d" text-anchor="middle" font-size="27" font-weight="700">順に予測</text><text x="887.5" y="453.9" fill="#25415d" text-anchor="middle" font-size="27" font-weight="700">→ 画像を作る</text><text x="600" y="572" fill="#25415d" text-anchor="middle" font-size="25" font-weight="700">すべての画像生成AIが拡散モデルではありません</text><text x="600" y="635" fill="#25415d" text-anchor="middle" font-size="18" font-weight="700">AI Portal｜架空の例を使った模式図です</text></g></svg>