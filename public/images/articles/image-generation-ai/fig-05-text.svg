<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">絵がきれいでも文字は確認</title><desc id="d">画像生成で時刻を誤描画する場合は背景だけ生成し正しい文字を別に載せる</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#739cc2" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="#f9fcff"/><circle cx="1100" cy="95" r="125" fill="#edf4ff"/><circle cx="80" cy="591" r="140" fill="#fff7eb"/><g font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif"><text x="600" y="75" fill="#25415d" text-anchor="middle" font-size="38" font-weight="700">絵がきれいでも文字は確認</text><rect x="73" y="164" width="482" height="207" rx="22" fill="#ffebe9" stroke="#c3d6df" stroke-width="2.5"/><text x="314" y="239.96" fill="#25415d" text-anchor="middle" font-size="27" font-weight="700">AIが作ったポスター</text><text x="314" y="276.68" fill="#25415d" text-anchor="middle" font-size="27" font-weight="700">絵は自然だけれど</text><text x="314" y="313.40000000000003" fill="#25415d" text-anchor="middle" font-size="27" font-weight="700">『集合18時』と誤記</text><rect x="646" y="164" width="482" height="207" rx="22" fill="#e4f7ed" stroke="#c3d6df" stroke-width="2.5"/><text x="887" y="240.97999999999996" fill="#25415d" text-anchor="middle" font-size="26" font-weight="700">改善したポスター</text><text x="887" y="276.34" fill="#25415d" text-anchor="middle" font-size="26" font-weight="700">絵だけAIで作る</text><text x="887" y="311.69999999999993" fill="#25415d" text-anchor="middle" font-size="26" font-weight="700">『集合10時』を正確に入力</text><path d="M556 270L634 270" fill="none" stroke="#739cc2" stroke-width="5" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="188" y="441" width="827" height="110" rx="22" fill="#e5f3ff" stroke="#c3d6df" stroke-width="2.5"/><text x="601.5" y="487.15999999999997" fill="#25415d" text-anchor="middle" font-size="26" font-weight="700">日時・住所・電話番号など</text><text x="601.5" y="522.52" fill="#25415d" text-anchor="middle" font-size="26" font-weight="700">重要な数字は元資料で確認</text><text x="600" y="635" fill="#25415d" text-anchor="middle" font-size="18" font-weight="700">AI Portal｜架空の例を使った模式図です</text></g></svg>