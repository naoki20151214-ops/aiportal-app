<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">GeminiとGoogleの資料を使うとき</title><desc id="d">町内会の担当者がAIに質問し、GmailとGoogle Driveの資料のうち正式な改訂版を探す場面</desc><defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" stroke="#7ba4be" stroke-width="2" fill="none"/></marker></defs><rect width="1200" height="675" fill="#fafdff"/><circle cx="1098" cy="76" r="150" fill="#eff4ff"/><circle cx="94" cy="586" r="145" fill="#fff5e9"/><text x="600" y="74" text-anchor="middle" font-family="'Noto Sans JP',Meiryo,sans-serif" font-size="38" font-weight="700" fill="#24435d">GeminiとGoogleの資料を使うとき</text><rect x="57" y="150" width="462" height="142" rx="23" fill="#e9f4ff" stroke="#afc9dc" stroke-width="2.7"/><text x="288" y="230.66666666666666" text-anchor="middle" font-family="'Noto Sans JP',Meiryo,sans-serif" font-size="29" font-weight="700" fill="#24435d">相談：清掃は何時集合？</text><path d="M529 218L637 218" stroke="#7ba4be" stroke-width="5" fill="none" marker-end="url(#a)"/><rect x="656" y="150" width="478" height="142" rx="23" fill="#e8f7ec" stroke="#afc9dc" stroke-width="2.7"/><text x="895" y="230.66666666666666" text-anchor="middle" font-family="'Noto Sans JP',Meiryo,sans-serif" font-size="29" font-weight="700" fill="#24435d">Geminiの回答の候補</text><rect x="62" y="364" width="506" height="153" rx="23" fill="#ffebe9" stroke="#afc9dc" stroke-width="2.7"/><text x="315" y="428" text-anchor="middle" font-family="'Noto Sans JP',Meiryo,sans-serif" font-size="30" font-weight="700" fill="#24435d">メール：旧版</text><text x="315" y="473" text-anchor="middle" font-family="'Noto Sans JP',Meiryo,sans-serif" font-size="30" font-weight="700" fill="#24435d">午前9時集合</text><rect x="626" y="364" width="507" height="153" rx="23" fill="#e0f6ec" stroke="#afc9dc" stroke-width="2.7"/><text x="879.5" y="428" text-anchor="middle" font-family="'Noto Sans JP',Meiryo,sans-serif" font-size="30" font-weight="700" fill="#2