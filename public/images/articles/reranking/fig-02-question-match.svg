<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">質問に答える文を比べる</title><desc id="d">質問は清掃の集合時刻。持ち物情報は時刻の質問に答えない</desc><rect width="1200" height="675" fill="#f9fcff"/><g font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="#24425d"><text x="600" y="80" font-size="37">質問に答える文を比べる</text><rect x="90" y="145" width="1020" height="91" rx="24" fill="#e5f3ff"/><text x="600" y="202.5" font-size="26">質問：清掃は何時に集合？</text><rect x="90" y="297" width="480" height="200" rx="24" fill="#fff0ed"/><text x="330" y="388.5" font-size="26">軍手を持ってくる</text><text x="330" y="429.5" font-size="26">→ 時刻には答えない</text><rect x="633" y="297" width="480" height="200" rx="24" fill="#e3f6ed"/><text x="873" y="388.5" font-size="26">集合は午前10時</text><text x="873" y="429.5" font-size="26">→ 時刻を答える</text><text x="600" y="587" font-size="26">話題が近いことと、答えになることは別</text><text x="600" y="641" font-size="18">AI Portal｜説明用の模式図</text></g></svg>