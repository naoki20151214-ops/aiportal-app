<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">検索から回答までの三段階</title><desc id="d">Retrieverで資料の候補を集め、Rerankerで比較してLLMへ渡す</desc><rect width="1200" height="675" fill="#f9fcff"/><g font-family="sans-serif" text-anchor="middle" fill="#24425d" font-size="35" font-weight="bold"><text x="600" y="80">探す → 比べる → 答える</text><rect x="50" y="210" width="330" height="190" rx="25" fill="#e5f3ff"/><rect x="435" y="210" width="330" height="190" rx="25" fill="#f0ecff"/><rect x="820" y="210" width="330" height="190" rx="25" fill="#e3f6ed"/><text x="215" y="300">① Retriever</text><text x="600" y="300">② Reranker</text><text x="985" y="300">③ LLM</text><text x="215" y="355" font-size="27">候補を探す</text><text x="600" y="355" font-size="27">順位を見直す</text><text x="985" y="355" font-size="27">回答を作る</text><text x="600" y="568" font-size="27">Rerankingは候補を探し直すわけではない</text><text x="600" y="640" font-size="18">AI Portal｜架空の模式図</text></g></svg>