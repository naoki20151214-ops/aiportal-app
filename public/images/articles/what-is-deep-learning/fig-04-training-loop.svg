<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="76" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">見る → 予想 → 比べる → 少し直す</text><text x="600" y="116" text-anchor="middle" font-size="22" fill="#587895" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">この繰り返しで、内部の見方を調整していく</text><g transform="translate(75 245)"><rect width="220" height="140" rx="25" fill="#fff" stroke="#d3e2ed" stroke-width="3"/><text x="110" y="58" text-anchor="middle" font-size="25" font-weight="900" fill="#3a6e94" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">1. 見る</text><text x="110" y="100" text-anchor="middle" font-size="18" fill="#687f90" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">猫・犬の写真</text></g><path d="M305 315 H365" stroke="#638da9" stroke-width="7"/><g transform="translate(375 245)"><rect width="220" height="140" rx="25" fill="#fff" stroke="#d3e2ed" stroke-width="3"/><text x="110" y="58" text-anchor="middle" font-size="25" font-weight="900" fill="#3a6e94" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">2. 予想</text><text x="110" y="100" text-anchor="middle" font-size="18" fill="#687f90" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">「猫かな？」</text></g><path d="M605 315 H665" stroke="#638da9" stroke-width="7"/><g transform="translate(675 245)"><rect width="220" height="140" rx="25" fill="#fff" stroke="#ead9cb" stroke-width="3"/><text x="110" y="58" text-anchor="middle" font-size="25" font-weight="900" fill="#98684a" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">3. 比べる</text><text x="110" y="100" text-anchor="middle" font-size="18" fill="#7d746e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">正解と確認</text></g><path d="M905 315 H965" stroke="#638da9" stroke-width="7"/><g transform="translate(975 245)"><rect width="150" height="140" rx="25" fill="#e9f7f1" stroke="#abd5c4" stroke-width="3"/><text x="75" y="58" text-anchor="middle" font-size="25" font-weight="900" fill="#2f765f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">4. 直す</text><text x="75" y="100" text-anchor="middle" font-size="17" fill="#62786f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">少し調整</text></g><path d="M1050 410 C1050 520 190 520 190 410" fill="none" stroke="#9bb9cd" stroke-width="6" stroke-dasharray="12 10"/><text x="600" y="580" text-anchor="middle" font-size="22" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">何度も繰り返す。</text></svg>