<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="76" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">AIの中にMachine Learning、その中にDeep Learning</text><circle cx="600" cy="385" r="245" fill="#e8f4fd" stroke="#8dbce0" stroke-width="4"/><circle cx="600" cy="405" r="170" fill="#d7ecfa" stroke="#62a5d3" stroke-width="4"/><circle cx="600" cy="430" r="95" fill="#bce0f3" stroke="#318bc2" stroke-width="4"/><text x="600" y="205" text-anchor="middle" font-size="29" font-weight="900" fill="#2d6d9d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">AI</text><text x="600" y="315" text-anchor="middle" font-size="27" font-weight="900" fill="#2874a6" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Machine Learning</text><text x="600" y="440" text-anchor="middle" font-size="23" font-weight="900" fill="#145d8e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Deep Learning</text><text x="600" y="625" text-anchor="middle" font-size="22" fill="#57758a" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Deep LearningはAI全体ではなく、Machine Learningの一分野。</text></svg>