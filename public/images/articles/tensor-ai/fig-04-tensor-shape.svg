<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="78" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Shapeを見ると、Tensorの形が分かる</text><g transform="translate(140 185)"><rect width="920" height="320" rx="32" fill="#fff" stroke="#bdd5e6" stroke-width="3"/><text x="460" y="72" text-anchor="middle" font-size="42" font-weight="900" fill="#34739d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">32 × 224 × 224 × 3</text><text x="115" y="155" text-anchor="middle" font-size="22" font-weight="800" fill="#52758e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">32</text><text x="115" y="195" text-anchor="middle" font-size="19" fill="#6a7f8d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">枚数</text><text x="345" y="155" text-anchor="middle" font-size="22" font-weight="800" fill="#52758e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">224</text><text x="345" y="195" text-anchor="middle" font-size="19" fill="#6a7f8d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">高さ</text><text x="575" y="155" text-anchor="middle" font-size="22" font-weight="800" fill="#52758e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">224</text><text x="575" y="195" text-anchor="middle" font-size="19" fill="#6a7f8d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">横幅</text><text x="805" y="155" text-anchor="middle" font-size="22" font-weight="800" fill="#52758e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">3</text><text x="805" y="195" text-anchor="middle" font-size="19" fill="#6a7f8d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">色</text><text x="460" y="270" text-anchor="middle" font-size="23" fill="#447766" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Shape = 各軸にいくつ数字があるか</text></g><text x="600" y="585" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">AIのCodeでは、Shape確認がとても基本的な作業になる。</text></svg>