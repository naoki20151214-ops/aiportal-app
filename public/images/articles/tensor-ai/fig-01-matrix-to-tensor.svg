<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="78" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">2次元の行列から、3次元のTensorへ</text><g transform="translate(120 220)"><rect width="320" height="220" rx="28" fill="#fff" stroke="#b8d2e4" stroke-width="3"/><text x="160" y="48" text-anchor="middle" font-size="24" font-weight="900" fill="#34739d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">行列</text><text x="160" y="120" text-anchor="middle" font-size="34" fill="#4e8bb3" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">縦 × 横</text><text x="160" y="175" text-anchor="middle" font-size="21" fill="#637c8e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">2つの軸</text></g><path d="M465 330 H600" stroke="#7598af" stroke-width="8"/><g transform="translate(640 185)"><rect x="50" y="45" width="300" height="190" rx="26" fill="#f7fbfe" stroke="#91bdd8" stroke-width="3"/><rect x="20" y="75" width="300" height="190" rx="26" fill="#fff" stroke="#91bdd8" stroke-width="3"/><text x="170" y="48" text-anchor="middle" font-size="24" font-weight="900" fill="#34739d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Tensor</text><text x="170" y="150" text-anchor="middle" font-size="32" fill="#4e8bb3" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">縦 × 横 × 奥行き</text><text x="170" y="215" text-anchor="middle" font-size="21" fill="#637c8e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">3つの軸</text></g><text x="600" y="575" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">軸を増やすことで、より複雑なDataを一つにまとめられる。</text></svg>