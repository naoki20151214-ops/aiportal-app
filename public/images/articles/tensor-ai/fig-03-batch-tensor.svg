<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="78" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">複数枚まとめると、軸がもう1つ増える</text><g transform="translate(100 210)"><rect x="0" y="80" width="240" height="150" rx="22" fill="#fff" stroke="#a8c7db" stroke-width="3"/><rect x="30" y="50" width="240" height="150" rx="22" fill="#f7fbfe" stroke="#a8c7db" stroke-width="3"/><rect x="60" y="20" width="240" height="150" rx="22" fill="#edf6fb" stroke="#a8c7db" stroke-width="3"/><text x="150" y="275" text-anchor="middle" font-size="22" fill="#5a788d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">複数の画像</text></g><path d="M430 340 H560" stroke="#7398b0" stroke-width="8"/><g transform="translate(600 185)"><rect width="480" height="310" rx="30" fill="#fff" stroke="#b8d2e4" stroke-width="3"/><text x="240" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#34739d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Batch Tensor</text><text x="240" y="125" text-anchor="middle" font-size="30" fill="#4d8bb4" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">枚数 × 高さ × 横幅 × 色</text><text x="240" y="185" text-anchor="middle" font-size="21" fill="#637c8e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Batchの軸が追加される</text><text x="240" y="240" text-anchor="middle" font-size="21" fill="#637c8e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">例：32枚をまとめて計算</text></g><text x="600" y="585" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Dataをまとめて処理するためにもTensorが使われる。</text></svg>