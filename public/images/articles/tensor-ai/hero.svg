<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="70" y="72" font-size="23" font-weight="700" fill="#2874ba" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">AI Portal｜Tensor</text><text x="70" y="145" font-size="48" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">行列だけでは足りない。</text><text x="70" y="203" font-size="48" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">数字をもっと重ねる。</text><text x="70" y="250" font-size="24" fill="#55758f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">画像・Batch・GPUをつなぐ数字のまとまり</text><g transform="translate(120 340)"><rect width="250" height="150" rx="24" fill="#fff" stroke="#bdd5e6" stroke-width="3"/><text x="125" y="52" text-anchor="middle" font-size="23" font-weight="900" fill="#37759d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">行列</text><text x="125" y="100" text-anchor="middle" font-size="22" fill="#5b7890" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">縦 × 横</text></g><path d="M395 415 H520" stroke="#7397af" stroke-width="8"/><g transform="translate(550 305)"><rect width="280" height="220" rx="28" fill="#eaf4fb" stroke="#8fbdd9" stroke-width="3"/><rect x="45" y="55" width="150" height="100" rx="12" fill="#fff" stroke="#8fbdd9" stroke-width="3"/><rect x="75" y="35" width="150" height="100" rx="12" fill="#f6fbff" stroke="#8fbdd9" stroke-width="3"/><text x="140" y="190" text-anchor="middle" font-size="24" font-weight="900" fill="#34739d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Tensor</text></g><path d="M850 415 H950" stroke="#7397af" stroke-width="8"/><g transform="translate(970 340)"><rect width="150" height="150" rx="24" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="75" y="55" text-anchor="middle" font-size="22" font-weight="900" fill="#2f76