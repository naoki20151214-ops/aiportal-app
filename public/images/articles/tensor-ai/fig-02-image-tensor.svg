<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="78" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">カラー画像は3つの軸で表せる</text><g transform="translate(120 190)"><rect width="330" height="300" rx="30" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="165" y="48" text-anchor="middle" font-size="24" font-weight="900" fill="#46718f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">画像</text><rect x="65" y="90" width="200" height="140" rx="18" fill="#eaf4fb" stroke="#8fbdd9" stroke-width="3"/><text x="165" y="165" text-anchor="middle" font-size="22" fill="#4e7894" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">1枚のカラー画像</text></g><path d="M475 340 H590" stroke="#7398b0" stroke-width="8"/><g transform="translate(620 185)"><rect width="450" height="310" rx="30" fill="#fff" stroke="#b8d2e4" stroke-width="3"/><text x="225" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#34739d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Tensor</text><text x="225" y="125" text-anchor="middle" font-size="34" fill="#4d8bb4" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">高さ × 横幅 × 色</text><text x="225" y="185" text-anchor="middle" font-size="22" fill="#637c8e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Height × Width × Channel</text><text x="225" y="245" text-anchor="middle" font-size="22" fill="#637c8e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">色 = Red / Green / Blue</text></g><text x="600" y="585" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">順番はFrameworkで変わっても、「複数の軸を持つ」点は同じ。</text></svg>