<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="0%から100%までの確率の感覚">
<rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="78" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">確率は「どれくらいありそう？」の目盛り</text><text x="600" y="118" text-anchor="middle" font-size="22" fill="#587895" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">0%から100%までで、不確実さを表す</text>
<line x1="130" y1="330" x2="1070" y2="330" stroke="#b9d5e9" stroke-width="18" stroke-linecap="round"/>
<circle cx="130" cy="330" r="28" fill="#a6b8c5"/><circle cx="600" cy="330" r="28" fill="#f0a256"/><circle cx="1070" cy="330" r="28" fill="#2e9d7b"/>
<text x="130" y="260" text-anchor="middle" font-size="42" font-weight="900" fill="#607785" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">0%</text><text x="600" y="260" text-anchor="middle" font-size="42" font-weight="900" fill="#bf7540" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">50%</text><text x="1070" y="260" text-anchor="middle" font-size="42" font-weight="900" fill="#23775f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">100%</text>
<text x="130" y="395" text-anchor="middle" font-size="22" font-weight="800" fill="#617887" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">まず起こらない</text><text x="600" y="395" text-anchor="middle" font-size="22" font-weight="800" fill="#8b6a52" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">どちらとも言いにくい</text><text x="1070" y="395" text-anchor="middle" font-size="22" font-weight="800" fill="#3b715f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">起こると考えている</text>
<rect x="335" y="485" width="530" height="100" rx="24" fill="#fff" stroke="#cee1ef" stroke-width="3"/><text x="600" y="526" text-anchor="middle" font-size="22" font-weight="900" fill="#355f80" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">50%は「一回の結果が半分になる」意味ではない</text><text x="600" y="558" text-anchor="middle" font-size="19" fill="#60788b" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">同じような試行を何度も考えたときの起こりやすさ</text>
</svg>