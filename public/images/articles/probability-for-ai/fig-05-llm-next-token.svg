<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="LLMが次のToken候補から一つを選ぶ">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#678da9"/></marker></defs><rect width="1200" height="675" fill="#f8fcff"/>
<text x="600" y="76" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">LLMも「次に何が来そうか」を比べている</text><text x="600" y="116" text-anchor="middle" font-size="22" fill="#587895" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">文脈 → 次のToken候補 → 1つ選ぶ → また次を予測</text>
<rect x="70" y="245" width="300" height="150" rx="28" fill="#fff" stroke="#d5e4ef" stroke-width="3"/><text x="220" y="302" text-anchor="middle" font-size="25" font-weight="900" fill="#35698f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">日本の首都は</text><text x="220" y="350" text-anchor="middle" font-size="18" fill="#687d8c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">ここまでが文脈</text>
<path d="M380 320 H470" stroke="#678da9" stroke-width="8" marker-end="url(#a)"/>
<g transform="translate(485 190)"><rect width="360" height="270" rx="28" fill="#fff" stroke="#d9e6ef" stroke-width="3"/><text x="180" y="46" text-anchor="middle" font-size="22" font-weight="900" fill="#355f80" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">次のToken候補</text><text x="42" y="100" font-size="22" fill="#355f80" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">東京</text><rect x="130" y="77" width="170" height="28" rx="14" fill="#3c95cf"/><text x="320" y="100" font-size="19" fill="#355f80" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">高い</text><text x="42" y="160" font-size="22" fill="#765f50" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">大阪</text><rect x="130" y="137" width="60" height="28" rx="14" fill="#d39a70"/><text x="320" y="160" font-size="19" fill="#765f50" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">低い</text><text x="42" y="220" font-size="22" fill="#60745e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">京都</text><rect x="130" y="197" width="42" height="28" rx="14" fill="#7cab78"/><text x="320" y="220" font-size="19" fill="#60745e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">低い</text></g>
<path d="M855 320 H945" stroke="#678da9" stroke-width="8" marker-end="url(#a)"/><rect x="960" y="250" width="170" height="140" rx="26" fill="#e9f6f1" stroke="#8ccbb4" stroke-width="3"/><text x="1045" y="305" text-anchor="middle" font-size="23" font-weight="900" fill="#2c765f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">東京</text><text x="1045" y="350" text-anchor="middle" font-size="18" fill="#5f766e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">文脈に追加</text>
<text x="600" y="575" text-anchor="middle" font-size="23" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">一語増えるたびに、また次の候補を計算する。</text>
</svg>