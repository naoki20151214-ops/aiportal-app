<text x="600" y="590" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">新しい情報を得たら、「どれくらいありそうか」を更新する。</text>
