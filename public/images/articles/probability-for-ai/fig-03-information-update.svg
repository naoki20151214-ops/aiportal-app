<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="新しい情報で迷惑メールの確率が変わる">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#678da9"/></marker></defs><rect width="1200" height="675" fill="#f8fcff"/>
<text x="600" y="76" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">情報が増えると、確率は変わる</text><text x="600" y="116" text-anchor="middle" font-size="22" fill="#587895" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">「最初の予想」を、新しい証拠で更新する</text>
<g transform="translate(85 210)"><rect width="350" height="280" rx="30" fill="#fff" stroke="#d7e5ef" stroke-width="3"/><text x="175" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#376a91" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">件名だけ見た</text><rect x="60" y="95" width="230" height="120" rx="18" fill="#eef5fa"/><path d="M60 95 L175 172 L290 95" fill="none" stroke="#8fb2cb" stroke-width="4"/><text x="175" y="252" text-anchor="middle" font-size="38" font-weight="900" fill="#5f7f96" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">20%</text></g>
<path d="M455 350 H745" stroke="#678da9" stroke-width="8" marker-end="url(#a)"/><rect x="505" y="250" width="190" height="92" rx="20" fill="#fff2e9" stroke="#e9b48d" stroke-width="3"/><text x="600" y="284" text-anchor="middle" font-size="18" font-weight="800" fill="#9f6a46" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">本文を読むと…</text><text x="600" y="314" text-anchor="middle" font-size="17" fill="#7d6b60" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">怪しいURLなど</text>
