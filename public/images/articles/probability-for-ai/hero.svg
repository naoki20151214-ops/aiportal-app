<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="同じ猫判定でも99%と51%では意味が違う">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#e8f4ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#6689a6" flood-opacity=".18"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<text x="70" y="72" font-size="23" font-weight="700" fill="#2874ba" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">AI Portal｜はじめてのProbability</text>
<text x="70" y="145" font-size="50" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">どちらも「猫」。</text>
<text x="70" y="204" font-size="50" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">でも、同じ意味ではない。</text>
<text x="70" y="250" font-size="24" fill="#55758f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">99%と51%の違いから、AIの確率を考える</text>
<g transform="translate(85 320)" filter="url(#s)"><rect width="430" height="230" rx="32" fill="#fff"/><circle cx="115" cy="108" r="72" fill="#dcefff"/><path d="M58 74 L80 32 L111 72 M172 74 L150 32 L119 72" fill="#8cb8d7"/><circle cx="91" cy="103" r="6" fill="#345d7c"/><circle cx="139" cy="103" r="6" fill="#345d7c"/><path d="M101 127 Q115 139 129 127" fill="none" stroke="#345d7c" stroke-width="5" stroke-linecap="round"/><text x="278" y="84" text-anchor="middle" font-size="27" font-weight="900" fill="#2c6797" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">猫</text><text x="278" y="145" text-anchor="middle" font-size="54" font-weight="900" fill="#1978c5" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">99%</text><text x="278" y="184" text-anchor="middle" font-size="18" fill="#5d788e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">かなり迷いが少ない</text></g>
<g transform="translate(685 320)" filter="url(#s)"><rect width="430" height="230" rx="32" fill="#fff"/><circle cx="115" cy="108" r="72" fill="#f2f3f4"/><path d="M58 74 L80 32 L111 72 M172 74 L150 32 L119 72" fill="#aeb7be"/><circle cx="91" cy="103" r="6" fill="#5d656a"/><circle cx="139" cy="103" r="6" fill="#5d656a"/><path d="M101 127 Q115 137 129 127" fill="none" stroke="#5d656a" stroke-width="5" stroke-linecap="round"/><text x="278" y="84" text-anchor="middle" font-size="27" font-weight="900" fill="#5d6d78" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">猫</text><text x="278" y="145" text-anchor="middle" font-size="54" font-weight="900" fill="#db7a55" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">51%</text><text x="278" y="184" text-anchor="middle" font-size="18" fill="#786f69" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">ほとんど迷っている</text></g>
<text x="600" y="625" text-anchor="middle" font-size="25" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Probability = 「どれくらいありそうか」を数字で持つ</text>
</svg>