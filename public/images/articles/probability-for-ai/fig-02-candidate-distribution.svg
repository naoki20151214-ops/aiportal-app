<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="猫犬うさぎの候補ごとの確率">
<rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="76" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">答えは1個でも、候補は1個とは限らない</text><text x="600" y="116" text-anchor="middle" font-size="22" fill="#587895" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">AIは候補ごとの「ありそう度」を持てる</text>
<g transform="translate(110 180)"><rect width="980" height="350" rx="34" fill="#fff" stroke="#d6e5f0" stroke-width="3"/>
<text x="80" y="90" font-size="27" font-weight="900" fill="#2c6e9f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">猫</text><rect x="180" y="58" width="650" height="50" rx="25" fill="#e4f2fc"/><rect x="180" y="58" width="455" height="50" rx="25" fill="#3d95cf"/><text x="870" y="92" text-anchor="middle" font-size="30" font-weight="900" fill="#2c6e9f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">70%</text>
<text x="80" y="185" font-size="27" font-weight="900" fill="#8b6c54" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">犬</text><rect x="180" y="153" width="650" height="50" rx="25" fill="#f7eee7"/><rect x="180" y="153" width="130" height="50" rx="25" fill="#d79562"/><text x="870" y="187" text-anchor="middle" font-size="30" font-weight="900" fill="#9b6945" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">20%</text>
<text x="80" y="280" font-size="27" font-weight="900" fill="#57765e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">うさぎ</text><rect x="180" y="248" width="650" height="50" rx="25" fill="#ecf5ee"/><rect x="180" y="248" width="65" height="50" rx="25" fill="#72aa7d"/><text x="870" y="282" text-anchor="middle" font-size="30" font-weight="900" fill="#4e7d59" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">10%</text></g>
<text x="600" y="602" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">「猫」と答えても、犬20%・うさぎ10%という情報は残っている。</text>
</svg>