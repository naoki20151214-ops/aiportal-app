<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="予測70%と実際の正答頻度のCalibration">
<rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="76" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">「70%」は、本当に70%当たる？</text><text x="600" y="116" text-anchor="middle" font-size="22" fill="#587895" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Probabilityの数字と現実の頻度が対応しているかを見る</text>
<line x1="180" y1="535" x2="1020" y2="535" stroke="#a8c4d8" stroke-width="4"/><line x1="180" y1="535" x2="180" y2="185" stroke="#a8c4d8" stroke-width="4"/>
<line x1="180" y1="535" x2="965" y2="220" stroke="#b6c6d2" stroke-width="5" stroke-dasharray="12 10"/><text x="970" y="205" font-size="18" fill="#6c7f8d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">理想</text>
<circle cx="735" cy="314" r="20" fill="#2f9a78"/><circle cx="735" cy="385" r="20" fill="#df7b55"/>
<text x="770" y="320" font-size="22" font-weight="800" fill="#2e765f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">70%予測 → 実際も約70%</text><text x="770" y="391" font-size="22" font-weight="800" fill="#a96046" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">70%予測 → 実際は約50%</text>
<text x="600" y="595" text-anchor="middle" font-size="22" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">高い数字が出ることと、その数字が信頼できることは別問題。</text>
</svg>