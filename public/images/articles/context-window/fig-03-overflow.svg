<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">上限を超えたらどうなる？</title><desc id="desc">長い入力が容量を超えるときの一般的な三パターン。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0f9f6"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6493b9" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="82" font-size="40" text-anchor="middle" font-weight="700" fill="#103962">上限を超えたらどうなる？</text><text x="600" y="125" font-size="22" text-anchor="middle" font-weight="550" fill="#638098">省略・要約・エラーなど、サービスの扱いはさまざま</text><rect x="66" y="181" width="1068" height="126" rx="21" fill="#edf5ff" stroke="#b2d1e9" stroke-width="3"/><text x="250" y="238" font-size="28" text-anchor="middle" font-weight="700" fill="#1d4a70">長い会話や資料</text><rect x="485" y="205" width="602" height="66" rx="12" fill="#fff" stroke="#b2c8db" stroke-width="3"/><text x="786" y="248" font-size="24" text-anchor="middle" font-weight="700" fill="#667f93">一度に扱える上限を超えた</text><path d="M600 308 V349" stroke="#6493b9" stroke-width="7" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><rect x="68" y="382" width="344" height="151" rx="21" fill="#fff0ed" stroke="#e3b5ac" stroke-width="3"/><text x="240" y="453" font-size="30" text-anchor="middle" font-weight="700" fill="#1d4a70">一部を省略</text><rect x="427" y="382" width="344" height="151" rx="21" fill="#e7f4ff" stroke="#abcce1" stroke-width="3"/><text x="599" y="453" font-size="30" text-anchor="middle" font-weight="700" fill="#1d4a70">短く要約</text><rect x="786" y="382" width="344" height="151" rx="21" fill="#e8f6ef" stroke="#afd2be" stroke-width="3"/><text x="958" y="453" font-size="30" text-anchor="middle" font-weight="700" fill="#1d4a70">処理を止める</text><text x="600" y="586" font-size="22" text-anchor="middle" font-weight="700" fill="#557b94">どの方法になるかは、モデルやサービスの設計次第</text><text x="600" y="642" font-size="16" text-anchor="middle" font-weight="450" fill="#7990a1">AI Portal ｜ 理解のための模式図。具体的なモデルの上限値を表すものではありません</text></g></svg>