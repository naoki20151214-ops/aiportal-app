<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">コンテキストは机の広さに似ている</title><desc id="desc">小さい机には資料を一部しか置けず、大きな机では多くの資料を置ける比喩。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0f9f6"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6493b9" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="82" font-size="40" text-anchor="middle" font-weight="700" fill="#103962">コンテキストは机の広さに似ている</text><text x="600" y="125" font-size="22" text-anchor="middle" font-weight="550" fill="#638098">一度の処理で広げられる資料には上限がある</text><rect x="60" y="183" width="480" height="326" rx="27" fill="#fff" stroke="#b9d5e6" stroke-width="3"/><text x="299" y="238" font-size="32" text-anchor="middle" font-weight="700" fill="#1d4a70">小さな机</text><rect x="130" y="281" width="339" height="159" rx="10" fill="#dfecf2" stroke="#8cb8cc" stroke-width="3"/><rect x="157" y="308" width="130" height="105" rx="5" fill="#fff2df" stroke="#ddb88c" stroke-width="3"/><text x="222" y="362" font-size="24" text-anchor="middle" font-weight="700" fill="#1d4a70">電車</text><rect x="310" y="308" width="130" height="105" rx="5" fill="#e8f8f0" stroke="#a2cbb2" stroke-width="3"/><text x="375" y="362" font-size="24" text-anchor="middle" font-weight="700" fill="#1d4a70">宿</text><rect x="659" y="183" width="480" height="326" rx="27" fill="#fff" stroke="#b9d5e6" stroke-width="3"/><text x="899" y="238" font-size="32" text-anchor="middle" font-weight="700" fill="#1d4a70">広い机</text><rect x="714" y="279" width="374" height="163" rx="11" fill="#dcecf3" stroke="#91bacc" stroke-width="3"/><rect x="732" y="293" width="158" height="59" rx="8" fill="#fff2df" stroke="#c8d9df" stroke-width="2"/><text x="812" y="333" font-size="23" text-anchor="middle" font-weight="700" fill="#1d4a70">電車</text><rect x="909" y="293" width="158" height="59" rx="8" fill="#e8f8f0" stroke="#c8d9df" stroke-width="2"/><text x="989" y="333" font-size="23" text-anchor="middle" font-weight="700" fill="#1d4a70">宿</text><rect x="732" y="360" width="158" height="59" rx="8" fill="#e5eeff" stroke="#c8d9df" stroke-width="2"/><text x="812" y="400" font-size="23" text-anchor="middle" font-weight="700" fill="#1d4a70">観光</text><rect x="909" y="360" width="158" height="59" rx="8" fill="#fce7ed" stroke="#c8d9df" stroke-width="2"/><text x="989" y="400" font-size="23" text-anchor="middle" font-weight="700" fill="#1d4a70">食事</text><text x="299" y="558" font-size="25" text-anchor="middle" font-weight="700" fill="#5b778f">置ける情報が少ない</text><text x="899" y="558" font-size="25" text-anchor="middle" font-weight="700" fill="#3e7b69">置ける情報が多い</text><text x="600" y="604" font-size="18" text-anchor="middle" font-weight="700" fill="#71899d">ただし、本物の机があるわけではありません</text><text x="600" y="642" font-size="16" text-anchor="middle" font-weight="450" fill="#7990a1">AI Portal ｜ 理解のための模式図。具体的なモデルの上限値を表すものではありません</text></g></svg>