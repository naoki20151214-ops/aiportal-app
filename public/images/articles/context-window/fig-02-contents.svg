<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">コンテキストには何が入る？</title><desc id="desc">コンテキストウィンドウ内に今の質問、会話履歴、資料、指示などが入る模式図。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0f9f6"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6493b9" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="82" font-size="40" text-anchor="middle" font-weight="700" fill="#103962">コンテキストには何が入る？</text><text x="600" y="125" font-size="22" text-anchor="middle" font-weight="550" fill="#638098">会話だけでなく、資料や指示もスペースを使う</text><rect x="92" y="194" width="1016" height="351" rx="26" fill="#fff" stroke="#a9c9df" stroke-width="3"/><text x="600" y="250" font-size="31" text-anchor="middle" font-weight="700" fill="#1d4a70">今回の処理に渡される情報</text><rect x="135" y="312" width="220" height="120" rx="16" fill="#ecf1ff" stroke="#b7c0df" stroke-width="3"/><text x="245" y="384" font-size="24" text-anchor="middle" font-weight="700" fill="#1d4a70">サービスの指示</text><rect x="372" y="312" width="220" height="120" rx="16" fill="#e8f7ef" stroke="#a0d2bb" stroke-width="3"/><text x="482" y="384" font-size="24" text-anchor="middle" font-weight="700" fill="#1d4a70">過去の会話</text><rect x="609" y="312" width="220" height="120" rx="16" fill="#fff2e6" stroke="#dec4a7" stroke-width="3"/><text x="719" y="384" font-size="24" text-anchor="middle" font-weight="700" fill="#1d4a70">貼り付けた資料</text><rect x="846" y="312" width="220" height="120" rx="16" fill="#e6f4ff" stroke="#a7cfe5" stroke-width="3"/><text x="956" y="384" font-size="24" text-anchor="middle" font-weight="700" fill="#1d4a70">今の質問</text><path d="M600 445 V489" stroke="#6096ba" stroke-width="7" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><text x="600" y="528" font-size="25" text-anchor="middle" font-weight="700" fill="#406682">これらを合わせて、扱える量の上限を考える</text><text x="600" y="591" font-size="19" text-anchor="middle" font-weight="700" fill="#65869b">回答用Tokenの扱いはモデルやサービスによって異なります</text><text x="600" y="642" font-size="16" text-anchor="middle" font-weight="450" fill="#7990a1">AI Portal ｜ 理解のための模式図。具体的なモデルの上限値を表すものではありません</text></g></svg>