<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">長い会話、AIはどこまで見られる？</title><desc id="desc">長くなった旅行の会話で、初期の重要条件が処理対象に残らない可能性を描く。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0f9f6"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6493b9" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="82" font-size="40" text-anchor="middle" font-weight="700" fill="#103962">長い会話、AIはどこまで見られる？</text><text x="600" y="125" font-size="22" text-anchor="middle" font-weight="550" fill="#638098">最初は「電車で行く」と伝えたはずなのに…</text><rect x="76" y="177" width="470" height="331" rx="24" fill="#fff" stroke="#c3d9e7" stroke-width="3"/><text x="311" y="222" font-size="31" text-anchor="middle" font-weight="700" fill="#1d4a70">チャットの履歴</text><rect x="114" y="245" width="395" height="49" rx="18" fill="#d9f4e6" stroke="#99ccb0" stroke-width="3"/><text x="311.5" y="284" font-size="24" text-anchor="middle" font-weight="700" fill="#315f84">電車で行く</text><rect x="114" y="302" width="395" height="49" rx="18" fill="#eaf4ff" stroke="#bdd2e3" stroke-width="3"/><text x="311.5" y="341" font-size="24" text-anchor="middle" font-weight="700" fill="#315f84">ホテルを決める</text><rect x="114" y="359" width="395" height="49" rx="18" fill="#eaf4ff" stroke="#bdd2e3" stroke-width="3"/><text x="311.5" y="398" font-size="24" text-anchor="middle" font-weight="700" fill="#315f84">観光地を選ぶ</text><rect x="114" y="416" width="395" height="49" rx="18" fill="#eaf4ff" stroke="#bdd2e3" stroke-width="3"/><text x="311.5" y="455" font-size="24" text-anchor="middle" font-weight="700" fill="#315f84">旅程をまとめて</text><rect x="651" y="177" width="470" height="331" rx="24" fill="#fff" stroke="#c3d9e7" stroke-width="3"/><text x="886" y="222" font-size="31" text-anchor="middle" font-weight="700" fill="#1d4a70">AIの今回の入力</text><rect x="706" y="248" width="362" height="61" rx="15" fill="#fce8e5" stroke="#e6aca6" stroke-width="3"/><text x="887" y="288" font-size="24" text-anchor="middle" font-weight="700" fill="#aa5b52">電車の指定は未収録？</text><rect x="706" y="327" width="362" height="116" rx="15" fill="#e7f6ee" stroke="#a5d4b9" stroke-width="3"/><text x="887" y="371" font-size="29" text-anchor="middle" font-weight="700" fill="#286c55">最近の旅行相談</text><text x="887" y="409" font-size="23" text-anchor="middle" font-weight="700" fill="#417f68">いま参照できる情報</text><path d="M552 354 H640" stroke="#6096ba" stroke-width="8" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><text x="600" y="554" font-size="25" text-anchor="middle" font-weight="700" fill="#345e7b">画面の履歴と、回答に渡る情報は必ずしも同じではない</text><text x="600" y="642" font-size="16" text-anchor="middle" font-weight="450" fill="#7990a1">AI Portal ｜ 理解のための模式図。具体的なモデルの上限値を表すものではありません</text></g></svg>