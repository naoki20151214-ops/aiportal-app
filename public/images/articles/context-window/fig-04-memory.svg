<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">履歴・メモリ・コンテキストの違い</title><desc id="desc">保存された会話履歴、別途保管されるメモリ、現在の入力として渡された範囲を比較する。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0f9f6"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6493b9" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="82" font-size="40" text-anchor="middle" font-weight="700" fill="#103962">履歴・メモリ・コンテキストの違い</text><text x="600" y="125" font-size="22" text-anchor="middle" font-weight="550" fill="#638098">「保存していること」と「いま渡されること」は別</text><rect x="68" y="215" width="337" height="252" rx="22" fill="#e8f3ff" stroke="#a5c7e2" stroke-width="3"/><text x="236" y="286" font-size="30" text-anchor="middle" font-weight="700" fill="#1d4a70">会話履歴</text><text x="236" y="367" font-size="19" text-anchor="middle" font-weight="700" fill="#586d7e">以前のやり取りを保存</text><rect x="426" y="215" width="337" height="252" rx="22" fill="#fff2e7" stroke="#dfc4a4" stroke-width="3"/><text x="594" y="286" font-size="30" text-anchor="middle" font-weight="700" fill="#1d4a70">メモリ</text><text x="594" y="367" font-size="19" text-anchor="middle" font-weight="700" fill="#586d7e">後で使うため別に保持</text><rect x="784" y="215" width="337" height="252" rx="22" fill="#e5f7ec" stroke="#9ed0b4" stroke-width="3"/><text x="952" y="286" font-size="30" text-anchor="middle" font-weight="700" fill="#1d4a70">今回のコンテキスト</text><text x="952" y="367" font-size="19" text-anchor="middle" font-weight="700" fill="#586d7e">今の回答に渡る情報</text><text x="600" y="550" font-size="24" text-anchor="middle" font-weight="700" fill="#395f7c">保存されていても、毎回すべて参照できるとは限らない</text><text x="600" y="642" font-size="16" text-anchor="middle" font-weight="450" fill="#7990a1">AI Portal ｜ 理解のための模式図。具体的なモデルの上限値を表すものではありません</text></g></svg>