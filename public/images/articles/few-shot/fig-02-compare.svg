<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Zero-shotとFew-shotの違い</title><desc id="desc">左には回答例なし、右には二組のお手本があり、同じ新しい依頼をする。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0faf4"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#5a8db4" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="74" text-anchor="middle" font-size="39" fill="#173d61" font-weight="700">Zero-shotとFew-shotの違い</text><text x="600" y="117" text-anchor="middle" font-size="22" fill="#5f7e95" font-weight="700">変わるのは、見せるお手本の数</text><rect x="68" y="182" width="505" height="343" fill="#eaf3ff" stroke="#b3cfe6" stroke-width="3" rx="20"/><text x="321" y="245" text-anchor="middle" font-size="34" fill="#316b98" font-weight="700">Zero-shot</text><text x="321" y="330" text-anchor="middle" font-size="29" fill="#254d69" font-weight="700">回答のお手本：0件</text><text x="321" y="426" text-anchor="middle" font-size="24" fill="#254d69" font-weight="700">新しい清掃案内を頼む</text><rect x="627" y="182" width="505" height="343" fill="#e8f8ef" stroke="#abd6be" stroke-width="3" rx="20"/><text x="880" y="245" text-anchor="middle" font-size="34" fill="#27785b" font-weight="700">Few-shot</text><text x="880" y="330" text-anchor="middle" font-size="29" fill="#27785b" font-weight="700">回答のお手本：2件</text><text x="880" y="426" text-anchor="middle" font-size="24" fill="#27785b" font-weight="700">新しい清掃案内を頼む</text><text x="600" y="584" text-anchor="middle" font-size="22" fill="#557b92" font-weight="700">少数例の有無が違う。どちらも正確さの保証ではない。</text><text x="600" y="638" text-anchor="middle" font-size="16" fill="#8095a5" font-weight="700">AI Portal｜説明用の模式図。出力結果を保証するものではありません。</text></g></svg>