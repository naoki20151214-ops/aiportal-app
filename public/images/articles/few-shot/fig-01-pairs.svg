<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">お手本は「入力と出力」の組</title><desc id="desc">防災訓練と花壇の手入れの入力・出力の組を並べ、形式を示す。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0faf4"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#5a8db4" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="74" text-anchor="middle" font-size="39" fill="#173d61" font-weight="700">お手本は「入力と出力」の組</text><text x="600" y="117" text-anchor="middle" font-size="22" fill="#5f7e95" font-weight="700">内容だけでなく、答え方の見本を見せる</text><rect x="70" y="175" width="502" height="361" fill="#fff" stroke="#b6d3e4" stroke-width="3" rx="20"/><text x="320" y="231" text-anchor="middle" font-size="29" fill="#254d69" font-weight="700">お手本①</text><rect x="109" y="266" width="423" height="91" fill="#e9f3ff" stroke="#adcae4" stroke-width="3" rx="20"/><text x="320" y="321" text-anchor="middle" font-size="25" fill="#254d69" font-weight="700">入力：防災訓練</text><path d="M320 368 V399" stroke="#5a8db4" stroke-width="6" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="109" y="420" width="423" height="87" fill="#e7f8ee" stroke="#aad4bc" stroke-width="3" rx="20"/><text x="320" y="471" text-anchor="middle" font-size="22" fill="#2d755c" font-weight="700">出力：【防災訓練のお知らせ】</text><rect x="630" y="175" width="502" height="361" fill="#fff" stroke="#b6d3e4" stroke-width="3" rx="20"/><text x="881" y="231" text-anchor="middle" font-size="29" fill="#254d69" font-weight="700">お手本②</text><rect x="670" y="266" width="421" height="91" fill="#e9f3ff" stroke="#adcae4" stroke-width="3" rx="20"/><text x="880" y="321" text-anchor="middle" font-size="24" fill="#254d69" font-weight="700">入力：花壇の手入れ</text><path d="M880 368 V399" stroke="#5a8db4" stroke-width="6" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="670" y="420" width="421" height="87" fill="#e7f8ee" stroke="#aad4bc" stroke-width="3" rx="20"/><text x="880" y="471" text-anchor="middle" font-size="20" fill="#2d755c" font-weight="700">出力：【花壇のお手入れのお知らせ】</text><text x="600" y="590" text-anchor="middle" font-size="22" fill="#55768d" font-weight="700">二つとも、見出し → 日時・場所 → 持ち物の順番</text><text x="600" y="638" text-anchor="middle" font-size="16" fill="#8095a5" font-weight="700">AI Portal｜説明用の模式図。出力結果を保証するものではありません。</text></g></svg>