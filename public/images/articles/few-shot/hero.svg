<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">お手本を二つ見せると？</title><desc id="desc">二つの入力と出力の見本から三つ目の清掃活動のお知らせを作る。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0faf4"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#5a8db4" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="74" text-anchor="middle" font-size="39" fill="#173d61" font-weight="700">お手本を二つ見せると？</text><text x="600" y="117" text-anchor="middle" font-size="22" fill="#5f7e95" font-weight="700">防災訓練・花壇の手入れから、公園清掃のお知らせへ</text><rect x="57" y="189" width="345" height="343" fill="#eaf3ff" stroke="#b3cfe6" stroke-width="3" rx="20"/><text x="230" y="240" text-anchor="middle" font-size="27" fill="#254d69" font-weight="700">お手本①</text><text x="230" y="290" text-anchor="middle" font-size="28" fill="#254d69" font-weight="700">防災訓練</text><text x="230" y="355" text-anchor="middle" font-size="23" fill="#254d69" font-weight="700">月曜日 午前10時</text><text x="230" y="410" text-anchor="middle" font-size="24" fill="#254d69" font-weight="700">【お知らせ】</text><rect x="430" y="189" width="345" height="343" fill="#f4efff" stroke="#c4b9e4" stroke-width="3" rx="20"/><text x="600" y="240" text-anchor="middle" font-size="27" fill="#254d69" font-weight="700">お手本②</text><text x="600" y="290" text-anchor="middle" font-size="28" fill="#254d69" font-weight="700">花壇の手入れ</text><text x="600" y="355" text-anchor="middle" font-size="23" fill="#254d69" font-weight="700">土曜日 午前8時</text><text x="600" y="410" text-anchor="middle" font-size="24" fill="#254d69" font-weight="700">【お知らせ】</text><rect x="805" y="189" width="338" height="343" fill="#e7f8ef" stroke="#a9d7bf" stroke-width="3" rx="20"/><text x="974" y="240" text-anchor="middle" font-size="27" fill="#27765a" font-weight="700">新しいお願い</text><text x="974" y="290" text-anchor="middle" font-size="28" fill="#27765a" font-weight="700">清掃活動</text><text x="974" y="355" text-anchor="middle" font-size="23" fill="#27765a" font-weight="700">日曜日 午前9時</text><text x="974" y="410" text-anchor="middle" font-size="23" fill="#27765a" font-weight="700">同じ書き方で</text><path d="M779 357 H796" stroke="#5a8db4" stroke-width="6" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600" y="579" text-anchor="middle" font-size="26" fill="#254d69" font-weight="700">見本の形を参考に、新しい回答を作る</text><text x="600" y="638" text-anchor="middle" font-size="16" fill="#8095a5" font-weight="700">AI Portal｜説明用の模式図。出力結果を保証するものではありません。</text></g></svg>