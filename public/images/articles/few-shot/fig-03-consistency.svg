<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">そろったお手本が分かりやすい</title><desc id="desc">統一した見出し、日時場所、持ち物の順番とバラバラな例を比較。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0faf4"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#5a8db4" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="74" text-anchor="middle" font-size="39" fill="#173d61" font-weight="700">そろったお手本が分かりやすい</text><text x="600" y="117" text-anchor="middle" font-size="22" fill="#5f7e95" font-weight="700">形式がばらばらだと、意図が伝わりにくい</text><rect x="70" y="184" width="501" height="368" fill="#e8f8ef" stroke="#a9d6bd" stroke-width="3" rx="20"/><text x="320" y="241" text-anchor="middle" font-size="29" fill="#22785a" font-weight="700">形式がそろっている</text><rect x="113" y="276" width="412" height="78" fill="#fff" stroke="#b1d6c4" stroke-width="3" rx="20"/><text x="320" y="321" text-anchor="middle" font-size="23" fill="#267659" font-weight="700">見出し → 日時 → 持ち物</text><rect x="113" y="379" width="412" height="78" fill="#fff" stroke="#b1d6c4" stroke-width="3" rx="20"/><text x="320" y="426" text-anchor="middle" font-size="23" fill="#267659" font-weight="700">見出し → 日時 → 持ち物</text><rect x="627" y="184" width="501" height="368" fill="#fff0eb" stroke="#dfb9ad" stroke-width="3" rx="20"/><text x="877" y="241" text-anchor="middle" font-size="29" fill="#98594f" font-weight="700">形式がばらばら</text><rect x="668" y="276" width="418" height="78" fill="#fff" stroke="#e1bfb6" stroke-width="3" rx="20"/><text x="877" y="321" text-anchor="middle" font-size="23" fill="#a3675e" font-weight="700">日時 → 見出し → 持ち物</text><rect x="668" y="379" width="418" height="78" fill="#fff" stroke="#e1bfb6" stroke-width="3" rx="20"/><text x="877" y="426" text-anchor="middle" font-size="24" fill="#a3675e" font-weight="700">本文だけ・持ち物なし</text><text x="600" y="597" text-anchor="middle" font-size="22" fill="#567c91" font-weight="700">お手本の共通点を、仕事に必要なものだけにそろえる</text><text x="600" y="638" text-anchor="middle" font-size="16" fill="#8095a5" font-weight="700">AI Portal｜説明用の模式図。出力結果を保証するものではありません。</text></g></svg>