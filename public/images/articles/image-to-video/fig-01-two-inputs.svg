<title id="t">Text-to-VideoとImage-to-Videoの出発点</title><desc id="d">文章だけで見た目と動きを条件にする方式と、画像で見た目を与え文章で動きを指定する方式の二つの構成。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9eb"/><stop offset="1" stop-color="#e8f7fa"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)" stroke="none" stroke-width="0"/><circle cx="1096" cy="86" r="85" fill="#d2eeda" stroke="none" stroke-width="0"/><circle cx="96" cy="604" r="65" fill="#ffdfca" stroke="none" stroke-width="0"/>
<rect x="51" y="34" width="1098" height="96" rx="22" fill="#ffffff" stroke="none" stroke-width="0"/><text x="600" y="100" fill="#263f53" font-size="36" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-weight="700">出発点が違うと、指示の役割も変わる</text><rect x="51" y="168" width="524" height="387" rx="26" fill="#fff8e8" stroke="#a6c6cf" stroke-width="2"/><text x="314" y="215" fill="#263f53" font-size="31" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-weight="600">Text-to-Video</text><rect x="107" y="274" width="410" height="95" rx="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="312" y="314" fill="#263f53" font-size="25" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-weight="600">文章：見た目 ＋ 動き</text><text x="312" y="349" fill="#647c87" font-size="21" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-weight="600">「白い灯台、雲が流れる」</text><path d="M308 390L308 437m-12 -9l12 9l-12 9" fill="none" stroke="#2d7b9c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="152" y="453" width="315" height="64" rx="20" fill="#bce2f4" stroke="none" stroke-width="0"/><text x="309" y="493" fill="#263f53" font-size="24" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-weight="600">新しい動画を生成</text><rect x="629" y="168" width="521" height="387" rx="26" fill="#d2eeda" stroke="#a6c6cf" stroke-width="2"/><text x="891" y="215" fill="#263f53" font-size="31" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-weight="600">Image-to-Video</text><rect x="691" y="253" width="228" height="166" rx="19" fill="#e9f7fb" stroke="#a6c6cf" stroke-width="2"/><circle cx="741.16" cy="301" r="22" fill="#f9c777" stroke="none" stroke-width="0"/><path d="M698 345.96000000000004Q741.16 336 795.88 349.28T911 345.96000000000004L911 412H699Z" fill="#bce2f4" stroke="#72b9cf" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(820.96 374.18) scale(0.52)"><path d="M-56 118L-34 -78L35 -78L56 118Z" fill="#ffffff" stroke="#263f53" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="-45" y="-98" width="91" height="26" rx="4" fill="#e06d5e" stroke="#263f53" stroke-width="3"/><rect x="-38" y="-137" width="75" height="36" rx="6" fill="#ffffff" stroke="#263f53" stroke-width="3"/><path d="M-49 -139L0 -177L48 -139Z" fill="#e06d5e" stroke="#263f53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-15" y="58" width="30" height="60" rx="9" fill="#e9f7fb" stroke="#263f53" stroke-width="3"/><rect x="-13" y="-11" width="26" height="32" rx="8" fill="#bce2f4" stroke="#263f53" stroke-width="3"/><path d="M-62 117H64" fill="none" stroke="#263f53" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M703 384.14Q750.28 369.2 791.32 389.12T908 387.46000000000004" fill="none" stroke="#2d7b9c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="944" y="281" width="169" height="103" rx="19" fill="#ffffff" stroke="none" stroke-width="0"/><text x="1027" y="321" fill="#263f53" font-size="22" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-weight="600">文章は</text><text x="1027" y="351" fill="#2d7b9c" font-size="22" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-weight="600">動き中心</text><path d="M912 457L912 489m-12 -9l12 9l-12 9" fill="none" stroke="#2d7b9c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="747" y="498" width="315" height="47" rx="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="904" y="529" fill="#263f53" font-size="21" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-weight="600">画像を条件に動画を生成</text><text x="600" y="602" fill="#647c87" font-size="22" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-weight="600">※どちらも、希望どおりの映像になる保証はありません</text>
<text x="1123" y="644" fill="#647c87" font-size="17" text-anchor="end" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-weight="400">AI Portal｜学習用の概念図</text>
