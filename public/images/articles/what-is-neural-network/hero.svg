<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="70" y="72" font-size="23" font-weight="700" fill="#2874ba" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">AI Portal｜Neural Network</text><text x="70" y="145" font-size="50" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">大量の数字が、</text><text x="70" y="205" font-size="50" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">どうやって「猫」になる？</text><text x="70" y="252" font-size="24" fill="#55758f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">小さな計算を何層もつないで、答えへ近づける</text><g transform="translate(100 340)"><rect width="180" height="140" rx="26" fill="#fff" stroke="#d7e4ee" stroke-width="3"/><text x="90" y="58" text-anchor="middle" font-size="22" font-weight="900" fill="#4d718d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">写真</text><text x="90" y="100" text-anchor="middle" font-size="18" fill="#647a89" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">たくさんの数字</text></g><path d="M300 410 H410" stroke="#7095af" stroke-width="8"/><g transform="translate(430 325)"><circle cx="50" cy="65" r="20" fill="#4e98c7"/><circle cx="50" cy="125" r="20" fill="#4e98c7"/><circle cx="150" cy="45" r="20" fill="#61a9d5"/><circle cx="150" cy="95" r="20" fill="#61a9d5"/><circle cx="150" cy="145" r="20" fill="#61a9d5"/><circle cx="250" cy="65" r="20" fill="#76b9dd"/><circle cx="250" cy="125" r="20" fill="#76b9dd"/><path d="M70 65 L130 45 M70 65 L130 95 M70 65 L130 145 M70 125 L130 45 M70 125 L130 95 M70 125 L130 145 M170 45 L230 65 M170 95 L230 65 M170 95 L230 125 M170 145 L230 125" stroke="#a5c8de" stroke-width="4"/></g><path d="M720 410 H830" stroke="#7095af" stroke-width="8"/><g transform="translate(850 340)"><rect width="250" height="140" rx="26" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="125" y="58" text-anchor="middle" font-size="22" font-weight="900" fill="#2f765f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">出力</text><text x="125" y="103" text-anchor="middle" font-size="32" font-weight="900" fill="#25705a" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">「猫」</text></g><text x="600" y="610" text-anchor="middle" font-size="25" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Neural Network = 小さな計算を大量につないだ仕組み</text></svg>