<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="78" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">学習とは、Weightを少しずつ直すこと</text><g transform="translate(90 240)"><rect width="230" height="145" rx="26" fill="#fff" stroke="#d4e3ed" stroke-width="3"/><text x="115" y="58" text-anchor="middle" font-size="24" font-weight="900" fill="#3b7096" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">予想</text><text x="115" y="105" text-anchor="middle" font-size="25" fill="#60798b" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">「犬 60%」</text></g><path d="M335 313 H430" stroke="#7397af" stroke-width="7"/><g transform="translate(445 240)"><rect width="230" height="145" rx="26" fill="#fff5ed" stroke="#e2bea3" stroke-width="3"/><text x="115" y="58" text-anchor="middle" font-size="24" font-weight="900" fill="#95694d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">正解</text><text x="115" y="105" text-anchor="middle" font-size="25" fill="#806f63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">「猫」</text></g><path d="M690 313 H785" stroke="#7397af" stroke-width="7"/><g transform="translate(800 220)"><rect width="300" height="185" rx="26" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="150" y="55" text-anchor="middle" font-size="24" font-weight="900" fill="#2f765f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Weightを少し直す</text><text x="150" y="105" text-anchor="middle" font-size="19" fill="#61796f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">次は猫に近づくように</text><text x="150" y="140" text-anchor="middle" font-size="19" fill="#61796f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">内部の数字を調整</text></g><path d="M950 420 C950 535 205 535 205 410" fill="none" stroke="#9bb9cd" stroke-width="6" stroke-dasharray="12 10"/><text x="600" y="600" text-anchor="middle" font-size="23" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">予想 → 正解と比べる → 少し直す → また予想する</text></svg>