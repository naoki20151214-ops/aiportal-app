<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="同じデータとモデルでも設定値ひとつで学習結果が変わる">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e1efff"/></linearGradient><linearGradient id="good" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1268c4"/><stop offset="1" stop-color="#27b4cf"/></linearGradient><linearGradient id="bad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3a261"/><stop offset="1" stop-color="#e85b67"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#5683aa" flood-opacity=".2"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<text x="70" y="74" font-size="23" font-weight="700" fill="#2874ba" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">AI Portal｜Hyperparameter Story</text>
<text x="70" y="150" font-size="54" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">同じData。同じModel。</text>
<text x="70" y="212" font-size="54" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">なのに、結果が違う。</text>
<text x="70" y="258" font-size="24" fill="#507392" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">AIの「学び方」を決める、もう一つの設計層</text>
<g transform="translate(80 326)" filter="url(#s)"><rect width="430" height="230" rx="30" fill="#fff"/><text x="30" y="42" font-size="20" font-weight="800" fill="#2a6fae" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Learning Rate = 0.001</text><path d="M50 171 C115 135 165 139 222 112 S333 68 380 64" fill="none" stroke="url(#good)" stroke-width="12" stroke-linecap="round"/><circle cx="380" cy="64" r="16" fill="#1ca6c3"/><text x="215" y="206" text-anchor="middle" font-size="23" font-weight="800" fill="#24618e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Lossが安定して下がる</text></g>
<g transform="translate(690 326)" filter="url(#s)"><rect width="430" height="230" rx="30" fill="#fff"/><text x="30" y="42" font-size="20" font-weight="800" fill="#c55a54" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Learning Rate = 0.1</text><path d="M48 169 L110 84 L173 156 L236 68 L300 149 L378 60" fill="none" stroke="url(#bad)" stroke-width="12" stroke-linejoin="round"/><text x="215" y="206" text-anchor="middle" font-size="23" font-weight="800" fill="#9b504f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Lossが暴れることもある</text></g>
<text x="600" y="625" text-anchor="middle" font-size="25" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Modelが学ぶ前に、「どう学ばせるか」を決めなければならない。</text>
</svg>