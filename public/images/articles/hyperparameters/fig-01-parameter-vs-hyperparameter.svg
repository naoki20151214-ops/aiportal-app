<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="ParameterとHyperparameterの違い">
<defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#5d86aa" flood-opacity=".16"/></filter></defs><rect width="1200" height="675" fill="#f8fcff"/>
<text x="600" y="76" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">学習ループの「内側」と「外側」</text>
<text x="600" y="116" text-anchor="middle" font-size="22" fill="#587895" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">ParameterとHyperparameterは、同じ数字でも役割が違う</text>
<g filter="url(#s)"><rect x="95" y="175" width="450" height="360" rx="34" fill="#e8f4ff"/><rect x="655" y="175" width="450" height="360" rx="34" fill="#ecf9f3"/></g>
<text x="320" y="232" text-anchor="middle" font-size="32" font-weight="900" fill="#1268ad" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Parameter</text><text x="880" y="232" text-anchor="middle" font-size="32" font-weight="900" fill="#188467" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Hyperparameter</text>
<rect x="175" y="285" width="290" height="120" rx="22" fill="#fff" stroke="#72b4e5" stroke-width="3"/><text x="320" y="333" text-anchor="middle" font-size="24" font-weight="800" fill="#285f8d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Weight / Bias</text><text x="320" y="372" text-anchor="middle" font-size="20" fill="#57758e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Training Dataから更新</text>
<rect x="735" y="275" width="290" height="148" rx="22" fill="#fff" stroke="#6bc5a5" stroke-width="3"/><text x="880" y="319" text-anchor="middle" font-size="22" font-weight="800" fill="#2d725f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Learning Rate</text><text x="880" y="352" text-anchor="middle" font-size="22" font-weight="800" fill="#2d725f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Batch Size / Depth</text><text x="880" y="389" text-anchor="middle" font-size="19" fill="#57758e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">学習方法・構造を制御</text>
<path d="M320 455 V500" stroke="#3d89c3" stroke-width="7"/><path d="M300 482 L320 505 L340 482" fill="none" stroke="#3d89c3" stroke-width="7"/><text x="320" y="528" text-anchor="middle" font-size="20" font-weight="700" fill="#3a6688" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Modelが学ぶ</text>
<path d="M880 455 V500" stroke="#39a27f" stroke-width="7"/><path d="M860 482 L880 505 L900 482" fill="none" stroke="#39a27f" stroke-width="7"/><text x="880" y="528" text-anchor="middle" font-size="20" font-weight="700" fill="#3a6e61" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">開発者・探索法が選ぶ</text>
<text x="600" y="615" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">AIの中で学ぶ値と、AIの学び方を決める値を分けて考える。</text>
</svg>