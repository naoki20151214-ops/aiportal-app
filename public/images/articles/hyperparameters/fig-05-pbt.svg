<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Population Based Trainingは複数モデルを競わせ途中でハイパーパラメータも変える">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6488a5"/></marker></defs><rect width="1200" height="675" fill="#f8fcff"/>
<text x="600" y="74" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Trainingしながら、設定まで進化させる</text><text x="600" y="114" text-anchor="middle" font-size="22" fill="#587895" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Population Based Training（PBT）の考え方</text>
<g transform="translate(70 190)"><rect width="255" height="270" rx="28" fill="#edf6ff"/><text x="128" y="45" text-anchor="middle" font-size="24" font-weight="900" fill="#2b72a7" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Model A</text><text x="128" y="82" text-anchor="middle" font-size="18" fill="#55758b" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">LR 0.001</text><path d="M42 205 C85 175 120 168 163 128 S213 88 225 80" fill="none" stroke="#2d91c6" stroke-width="9"/><text x="128" y="242" text-anchor="middle" font-size="18" font-weight="800" fill="#2d6b93" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">成績：良い</text></g>
<g transform="translate(472 190)"><rect width="255" height="270" rx="28" fill="#fff2ec"/><text x="128" y="45" text-anchor="middle" font-size="24" font-weight="900" fill="#bd6355" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Model B</text><text x="128" y="82" text-anchor="middle" font-size="18" fill="#7d6a63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">LR 0.08</text><path d="M42 205 L88 130 L130 188 L175 117 L225 180" fill="none" stroke="#df7565" stroke-width="9"/><text x="128" y="242" text-anchor="middle" font-size="18" font-weight="800" fill="#9f5b50" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">成績：悪い</text></g>
<g transform="translate(875 190)"><rect width="255" height="270" rx="28" fill="#edf9f4"/><text x="128" y="45" text-anchor="middle" font-size="24" font-weight="900" fill="#26785f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Model C</text><text x="128" y="82" text-anchor="middle" font-size="18" fill="#55756c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">LR 0.004</text><path d="M42 205 C92 190 120 150 157 142 S210 105 225 90" fill="none" stroke="#2ca17d" stroke-width="9"/><text x="128" y="242" text-anchor="middle" font-size="18" font-weight="800" fill="#2e745f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">成績：中</text></g>
<path d="M325 325 H455" stroke="#6488a5" stroke-width="7" marker-end="url(#a)"/><path d="M727 325 H858" stroke="#6488a5" stroke-width="7" marker-end="url(#a)"/>
<rect x="375" y="500" width="450" height="88" rx="24" fill="#fff" stroke="#99b7cb" stroke-width="3"/><text x="600" y="536" text-anchor="middle" font-size="21" font-weight="900" fill="#355f7a" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">良いModelの状態を利用しつつ</text><text x="600" y="565" text-anchor="middle" font-size="20" fill="#58758b" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Hyperparameterを変えてTrainingを続ける</text>
<text x="600" y="638" text-anchor="middle" font-size="22" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Hyperparameterは「開始前に一度だけ固定する値」とは限らない。</text>
</svg>