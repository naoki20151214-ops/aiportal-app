<rect x="660" y="292" width="150" height="88" rx="18" fill="#fff"/><text x="735" y="328" text-anchor="middle" font-size="19" font-weight="800" fill="#365f80" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Model</text><text x="735" y="354" text-anchor="middle" font-size="17" fill="#58758b" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Weight / Bias</text>
<path d="M595 336 H652" stroke="#4b8fbe" stroke-width="7" marker-end="url(#a)"/><path d="M735 392 C735 455 520 455 520 392" fill="none" stroke="#4b8fbe" stroke-width="6" marker-end="url(#a)"/>
