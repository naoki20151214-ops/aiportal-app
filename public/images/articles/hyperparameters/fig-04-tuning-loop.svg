<rect x="915" y="240" width="230" height="120" rx="24" fill="#fff3e9" stroke="#e5aa78" stroke-width="3"/><text x="1030" y="282" text-anchor="middle" font-size="20" font-weight="900" fill="#9f6841" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Validation Score</text><text x="1030" y="316" text-anchor="middle" font-size="18" fill="#7c6b5e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">次の判断材料</text>
<path d="M285 300 H352" stroke="#45a17f" stroke-width="7" marker-end="url(#a)"/><path d="M840 300 H907" stroke="#db9360" stroke-width="7" marker-end="url(#a)"/><path d="M1030 375 C1030 590 170 590 170 375" fill="none" stroke="#6b91ac" stroke-width="6" stroke-dasharray="12 9" marker-end="url(#a)"/>
