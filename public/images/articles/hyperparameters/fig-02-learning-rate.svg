<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Learning Rateが大きすぎても小さすぎても困る">
<rect width="1200" height="675" fill="#f9fcff"/><text x="600" y="74" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">一歩の大きさで、学習は変わる</text><text x="600" y="116" text-anchor="middle" font-size="22" fill="#5a7893" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Learning Rate = 「谷底へ進む一歩の大きさ」</text>
<path d="M90 210 C265 180 300 570 600 570 C900 570 930 180 1110 210" fill="#e8f4ff" stroke="#7db5db" stroke-width="5"/>
<text x="600" y="605" text-anchor="middle" font-size="21" font-weight="800" fill="#396988" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">低いLoss</text>
<g><circle cx="170" cy="240" r="18" fill="#e86763"/><path d="M180 243 L430 430 L770 310 L965 405" fill="none" stroke="#e86763" stroke-width="10" stroke-linejoin="round"/><path d="M942 389 L972 408 L948 431" fill="none" stroke="#e86763" stroke-width="8"/></g>
<text x="250" y="180" font-size="23" font-weight="900" fill="#bd544f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">大きすぎる</text><text x="250" y="212" font-size="19" fill="#7b6260" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">谷底を飛び越えて不安定</text>
<g><circle cx="255" cy="292" r="16" fill="#368fcb"/><circle cx="305" cy="336" r="14" fill="#368fcb"/><circle cx="350" cy="382" r="12" fill="#368fcb"/><circle cx="390" cy="421" r="10" fill="#368fcb"/><path d="M264 300 L295 327 M315 345 L340 372 M360 390 L380 412" stroke="#368fcb" stroke-width="7"/></g>
<text x="90" y="470" font-size="23" font-weight="900" fill="#2b72a5" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">小さすぎる</text><text x="90" y="502" font-size="19" fill="#5d7487" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">方向は合っていても進みが遅い</text>
<circle cx="600" cy="553" r="19" fill="#23a67f"/><path d="M470 425 C520 470 555 520 600 553" fill="none" stroke="#23a67f" stroke-width="9"/><text x="705" y="525" font-size="23" font-weight="900" fill="#268366" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">ちょうどよい</text><text x="705" y="557" font-size="19" fill="#5f756f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">速さと安定性を両立</text>
</svg>