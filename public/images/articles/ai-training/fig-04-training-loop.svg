<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="78" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">学習は、同じ流れを何度も回す</text><g transform="translate(70 245)"><rect width="190" height="130" rx="24" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="95" y="55" text-anchor="middle" font-size="23" font-weight="900" fill="#46718f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Data</text><text x="95" y="94" text-anchor="middle" font-size="19" fill="#617a8c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">入力する</text></g><path d="M275 310 H355" stroke="#7398b0" stroke-width="7"/><g transform="translate(370 245)"><rect width="190" height="130" rx="24" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="95" y="55" text-anchor="middle" font-size="23" font-weight="900" fill="#46718f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">予想</text><text x="95" y="94" text-anchor="middle" font-size="19" fill="#617a8c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">答えを出す</text></g><path d="M575 310 H655" stroke="#7398b0" stroke-width="7"/><g transform="translate(670 245)"><rect width="190" height="130" rx="24" fill="#fff5ed" stroke="#e2bea3" stroke-width="3"/><text x="95" y="55" text-anchor="middle" font-size="23" font-weight="900" fill="#95694d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Loss</text><text x="95" y="94" text-anchor="middle" font-size="19" fill="#7e7168" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">ズレを測る</text></g><path d="M875 310 H955" stroke="#7398b0" stroke-width="7"/><g transform="translate(970 245)"><rect width="160" height="130" rx="24" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="80" y="55" text-anchor="middle" font-size="23" font-weight="900" fill="#2