<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="78" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">まず、Dataと学習の基準を用意する</text><g transform="translate(120 200)"><rect width="320" height="280" rx="30" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="160" y="50" text-anchor="middle" font-size="25" font-weight="900" fill="#46718f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Data</text><circle cx="160" cy="135" r="56" fill="#dceeff"/><path d="M118 118 L132 88 L158 116 M202 118 L188 88 L162 116" fill="#8bb4d4"/><text x="160" y="225" text-anchor="middle" font-size="23" fill="#5b788c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">猫の画像</text></g><path d="M470 340 H585" stroke="#7398b0" stroke-width="8"/><g transform="translate(620 200)"><rect width="430" height="280" rx="30" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="215" y="52" text-anchor="middle" font-size="25" font-weight="900" fill="#2f765f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">改善するための基準</text><text x="215" y="125" text-anchor="middle" font-size="28" fill="#477766" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">正解：猫</text><text x="215" y="185" text-anchor="middle" font-size="20" fill="#61796f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">または次Tokenなど</text><text x="215" y="225" text-anchor="middle" font-size="20" fill="#61796f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">予想を評価できる信号</text></g><text x="600" y="585" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">人がラベルを付ける場合も、Data自身から学習信号を作る場合もある。</text></svg>