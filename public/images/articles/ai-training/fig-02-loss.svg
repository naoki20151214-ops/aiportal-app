<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="78" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">予想と正解のズレを、Lossで測る</text><g transform="translate(100 215)"><rect width="300" height="240" rx="28" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="150" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#46718f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Modelの予想</text><text x="150" y="125" text-anchor="middle" font-size="29" fill="#55778d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">猫 30%</text><text x="150" y="180" text-anchor="middle" font-size="29" fill="#55778d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">犬 70%</text></g><g transform="translate(450 215)"><rect width="300" height="240" rx="28" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="150" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#2f765f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">正解</text><text x="150" y="140" text-anchor="middle" font-size="38" font-weight="900" fill="#2a715b" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">猫</text></g><path d="M770 335 H850" stroke="#7398b0" stroke-width="8"/><g transform="translate(870 230)"><rect width="230" height="210" rx="28" fill="#fff5ed" stroke="#e2bea3" stroke-width="3"/><text x="115" y="55" text-anchor="middle" font-size="25" font-weight="900" fill="#95694d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Loss</text><text x="115" y="115" text-anchor="middle" font-size="21" fill="#7e7168" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">どれくらい</text><text x="115" y="150" text-anchor="middle" font-size="21" fill="#7e7168" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif