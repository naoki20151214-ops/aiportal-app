<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="78" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">一気に直さず、Parameterを少し動かす</text><g transform="translate(120 220)"><rect width="300" height="230" rx="28" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="150" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#46718f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">修正前</text><text x="150" y="125" text-anchor="middle" font-size="34" fill="#5d7b90" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Weight = 0.42</text><text x="150" y="175" text-anchor="middle" font-size="20" fill="#6b7f8d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Lossが大きい</text></g><path d="M445 335 H590" stroke="#7398b0" stroke-width="8"/><text x="518" y="305" text-anchor="middle" font-size="20" font-weight="800" fill="#4e7894" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">少し修正</text><g transform="translate(620 220)"><rect width="360" height="230" rx="28" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="180" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#2f765f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">修正後</text><text x="180" y="125" text-anchor="middle" font-size="34" fill="#477766" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Weight = 0.43</text><text x="180" y="175" text-anchor="middle" font-size="20" fill="#61796f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">次の予想でもう一度確認</text></g><text x="600" y="580" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">小さな修正を何度も積み重ねる。</text></svg>