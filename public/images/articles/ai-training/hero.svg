<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="70" y="72" font-size="23" font-weight="700" fill="#2874ba" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">AI Portal｜Training</text><text x="70" y="145" font-size="48" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">AIは、間違いながら学ぶ。</text><text x="70" y="203" font-size="48" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">予想して、少し直す。</text><text x="70" y="250" font-size="24" fill="#55758f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Training = 間違いが減るように内部の数字を調整する</text><g transform="translate(95 340)"><rect width="190" height="140" rx="25" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="95" y="58" text-anchor="middle" font-size="23" font-weight="900" fill="#46718f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">予想</text><text x="95" y="102" text-anchor="middle" font-size="20" fill="#617a8c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">犬 70%</text></g><path d="M300 410 H395" stroke="#7398b0" stroke-width="8"/><g transform="translate(415 340)"><rect width="190" height="140" rx="25" fill="#fff5ed" stroke="#e4c0a4" stroke-width="3"/><text x="95" y="58" text-anchor="middle" font-size="23" font-weight="900" fill="#95694d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Loss</text><text x="95" y="102" text-anchor="middle" font-size="20" fill="#806f63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">ズレを測る</text></g><path d="M620 410 H715" stroke="#7398b0" stroke-width="8"/><g transform="translate(735 340)"><rect width="190" height="140" rx="25" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="95" y="58" text-anchor="middle" font-size="23" font-weight="900" fill="#2f765f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">修正</text><text x="95" y="102" text-anchor="middle" font-size="20" fill="#477766" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">少しだけ直す</text></g><path d="M940 410 H1035" stroke="#7398b0" stroke-width="8"/><text x="1080" y="420" text-anchor="middle" font-size="46" font-weight="900" fill="#4f88ae" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">↻</text><text x="600" y="610" text-anchor="middle" font-size="25" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">予想 → ズレ → 修正 → 繰り返す</text></svg>