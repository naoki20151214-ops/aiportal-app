<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Training Validation Testの役割">
<defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#5d9dc9" flood-opacity=".18"/></filter><linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff2ff"/><stop offset="1" stop-color="#cce9ff"/></linearGradient><linearGradient id="b2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf9f4"/><stop offset="1" stop-color="#d1f1e5"/></linearGradient><linearGradient id="b3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1e9"/><stop offset="1" stop-color="#ffe1d5"/></linearGradient></defs>
<rect width="1200" height="675" fill="#f8fcff"/>
<text x="600" y="74" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">3つのData Setは、3つの役割</text>
<text x="600" y="118" text-anchor="middle" font-size="22" fill="#557896" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">誰が何を学ぶのかを分ける</text>
<g filter="url(#s)">
<rect x="55" y="175" width="330" height="370" rx="34" fill="url(#b1)"/>
<rect x="435" y="175" width="330" height="370" rx="34" fill="url(#b2)"/>
<rect x="815" y="175" width="330" height="370" rx="34" fill="url(#b3)"/>
</g>
<text x="220" y="230" text-anchor="middle" font-size="30" font-weight="900" fill="#126eb6" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Training</text>
<text x="600" y="230" text-anchor="middle" font-size="30" font-weight="900" fill="#168a6d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Validation</text>
<text x="980" y="230" text-anchor="middle" font-size="30" font-weight="900" fill="#cb604f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Test</text>
<g transform="translate(130 278)">
  <rect width="180" height="126" rx="18" fill="#fff" stroke="#69afe0" stroke-width="3"/>
  <path d="M32 38 H148 M32 65 H148 M32 92 H110" stroke="#69afe0" stroke-width="7" stroke-linecap="round"/>
  <path d="M112 91 l16 16 32-39" fill="none" stroke="#2a8bd1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g transform="translate(510 280)">
  <rect width="180" height="120" rx="18" fill="#fff" stroke="#5cc2a0" stroke-width="3"/>
  <path d="M28 88 L70 55 L104 70 L150 28" fill="none" stroke="#2ea57f" stroke-width="8" stroke-linecap="round"/>
  <circle cx="70" cy="55" r="8" fill="#2ea57f"/><circle cx="104" cy="70" r="8" fill="#2ea57f"/><circle cx="150" cy="28" r="8" fill="#2ea57f"/>
</g>
<g transform="translate(890 276)">
  <rect x="0" y="22" width="180" height="110" rx="16" fill="#fff8f5" stroke="#e69383" stroke-width="3"/>
  <path d="M0 22 L90 84 L180 22" fill="none" stroke="#e69383" stroke-width="3"/>
  <circle cx="150" cy="103" r="26" fill="#e77362"/><path d="M139 103 l9 9 17-20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="220" y="452" text-anchor="middle" font-size="22" font-weight="800" fill="#275c89" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Modelが学ぶ</text>
<text x="220" y="487" text-anchor="middle" font-size="18" fill="#57758f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Parameterを更新</text>
<text x="600" y="452" text-anchor="middle" font-size="22" font-weight="800" fill="#286f61" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">開発者が学ぶ</text>
<text x="600" y="487" text-anchor="middle" font-size="18" fill="#57758f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">設計・設定を調整</text>
<text x="980" y="452" text-anchor="middle" font-size="22" font-weight="800" fill="#8e5148" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">誰も学ばない</text>
<text x="980" y="487" text-anchor="middle" font-size="18" fill="#57758f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">最後に一度だけ確認</text>
<text x="600" y="612" text-anchor="middle" font-size="24" font-weight="700" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">TrainingでModelを育て、Validationで開発し、Testで初めて実力を測る。</text>
</svg>