<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Data Leakage">
<defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#609bc5" flood-opacity=".18"/></filter></defs>
<rect width="1200" height="675" fill="#f8fcff"/>
<text x="600" y="73" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Data Leakage：答えがこっそり混ざる</text>
<text x="600" y="117" text-anchor="middle" font-size="22" fill="#557896" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Prediction時には存在しない情報を使うと、Scoreだけが高くなる</text>
<g transform="translate(70 185)" filter="url(#s)">
  <rect width="430" height="350" rx="34" fill="#fff"/>
  <text x="215" y="52" text-anchor="middle" font-size="28" font-weight="800" fill="#1d6fb6" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Prediction時に使える情報</text>
  <rect x="65" y="100" width="300" height="52" rx="14" fill="#eaf4ff"/><text x="215" y="134" text-anchor="middle" font-size="20" fill="#315e87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">年齢・症状・検査値</text>
  <rect x="65" y="175" width="300" height="52" rx="14" fill="#eaf4ff"/><text x="215" y="209" text-anchor="middle" font-size="20" fill="#315e87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">来院時刻・既往歴</text>
  <circle cx="215" cy="286" r="44" fill="#2d86d6"/><text x="215" y="295" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Model</text>
</g>
<g transform="translate(700 185)" filter="url(#s)">
  <rect width="430" height="350" rx="34" fill="#fff8f5"/>
  <text x="215" y="52" text-anchor="middle" font-size="28" font-weight="800" fill="#c45a4e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">答えを知った後の情報</text>
  <rect x="65" y="105" width="300" height="60" rx="14" fill="#ffe6de" stroke="#eea091" stroke-width="3"/><text x="215" y="143" text-anchor="middle" font-size="20" font-weight="800" fill="#9c5147" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">診断後に処方された薬</text>
  <path d="M215 182 V245" stroke="#e36e5c" stroke-width="8" stroke-dasharray="12 10"/>
  <path d="M198 231 L215 252 L232 231" fill="none" stroke="#e36e5c" stroke-width="8"/>
  <text x="215" y="292" text-anchor="middle" font-size="23" font-weight="900" fill="#c45a4e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">高Scoreに見える</text>
</g>
<path d="M520 360 H680" stroke="#e36e5c" stroke-width="7" stroke-dasharray="15 12"/>
<circle cx="600" cy="360" r="48" fill="#fff" stroke="#edaa9d" stroke-width="4"/>
<text x="600" y="352" text-anchor="middle" font-size="18" font-weight="800" fill="#b9574b" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">未来情報</text>
<text x="600" y="377" text-anchor="middle" font-size="18" font-weight="800" fill="#b9574b" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Leak</text>
<text x="600" y="607" text-anchor="middle" font-size="23" font-weight="700" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Leakageは「Modelが賢い」のではなく、「答えを先に見ている」状態。</text>
</svg>