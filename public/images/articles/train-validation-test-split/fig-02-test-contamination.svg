<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Test Setの汚染">
<defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#6b9ec0" flood-opacity=".18"/></filter></defs>
<rect width="1200" height="675" fill="#f9fcff"/>
<text x="600" y="74" text-anchor="middle" font-size="45" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Testを見ながら改善すると、Testも開発Dataになる</text>
<text x="600" y="118" text-anchor="middle" font-size="22" fill="#557896" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">問題そのものを見なくても、Scoreから情報は漏れる</text>
<g transform="translate(80 185)" filter="url(#s)">
  <rect width="370" height="350" rx="34" fill="#fff"/>
  <text x="185" y="52" text-anchor="middle" font-size="28" font-weight="800" fill="#1d6fb6" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Model Development</text>
  <circle cx="185" cy="160" r="76" fill="#e8f4ff" stroke="#6eb3e0" stroke-width="4"/>
  <path d="M145 163 h80 M185 123 v80" stroke="#2f86d7" stroke-width="10" stroke-linecap="round"/>
  <text x="185" y="285" text-anchor="middle" font-size="21" fill="#597791" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Feature / Hyperparameter</text>
</g>
<g transform="translate(750 185)" filter="url(#s)">
  <rect width="370" height="350" rx="34" fill="#fff8f5"/>
  <text x="185" y="52" text-anchor="middle" font-size="28" font-weight="800" fill="#c95b4f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Test Set</text>
  <rect x="86" y="112" width="198" height="135" rx="18" fill="#fff" stroke="#e69a8d" stroke-width="3"/>
  <path d="M86 112 L185 181 L284 112" fill="none" stroke="#e69a8d" stroke-width="3"/>
  <circle cx="270" cy="242" r="34" fill="#e56f5e"/>
  <text x="270" y="252" text-anchor="middle" font-size="25" font-weight="900" fill="#fff" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">88</text>
  <text x="185" y="302" text-anchor="middle" font-size="19" fill="#795e5a" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">本来は最後まで封印</text>
</g>
<path d="M462 320 C560 270 650 270 738 320" fill="none" stroke="#4c9bd0" stroke-width="8"/>
<path d="M721 300 L744 320 L718 337" fill="none" stroke="#4c9bd0" stroke-width="8"/>
<text x="600" y="286" text-anchor="middle" font-size="20" fill="#376a92" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Scoreを見る</text>
<path d="M738 410 C650 462 555 462 462 410" fill="none" stroke="#e47562" stroke-width="8" stroke-dasharray="15 12"/>
<path d="M480 390 L457 410 L483 428" fill="none" stroke="#e47562" stroke-width="8"/>
<text x="600" y="470" text-anchor="middle" font-size="20" fill="#a05247" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">そのScoreを見て設計変更</text>
<circle cx="600" cy="370" r="48" fill="#fff" stroke="#f0b2a6" stroke-width="4"/>
<text x="600" y="363" text-anchor="middle" font-size="18" font-weight="800" fill="#bf5b4e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">情報が</text>
<text x="600" y="389" text-anchor="middle" font-size="18" font-weight="800" fill="#bf5b4e" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">逆流する</text>
<text x="600" y="607" text-anchor="middle" font-size="23" font-weight="700" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Testを開くたびに、そのTest専用の開発へ少しずつ近づいていく。</text>
</svg>