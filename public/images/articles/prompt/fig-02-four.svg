<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">具体的なプロンプトの四つの目印</title><desc id="desc">同じ清掃案内の依頼を四つの項目に分解した図。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eff9f3"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#648fb5" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',Meiryo,-apple-system,sans-serif"><text x="600" y="78" font-size="38" fill="#173e60" text-anchor="middle" font-weight="700">具体的なプロンプトの四つの目印</text><text x="600" y="125" font-size="22" fill="#667f91" text-anchor="middle" font-weight="500">仕事・材料・読み手・仕上がりを整理する</text><rect x="68" y="196" width="512" height="139" rx="20" fill="#eaf4ff" stroke="#accde6" stroke-width="3"/><text x="324" y="245" font-size="27" fill="#254b68" text-anchor="middle" font-weight="700">① 仕事</text><text x="324" y="299" font-size="27" fill="#254b68" text-anchor="middle" font-weight="700">清掃活動の案内文</text><rect x="623" y="196" width="512" height="139" rx="20" fill="#fff2e8" stroke="#e1c5a9" stroke-width="3"/><text x="879" y="245" font-size="27" fill="#254b68" text-anchor="middle" font-weight="700">② 材料</text><text x="879" y="299" font-size="27" fill="#254b68" text-anchor="middle" font-weight="700">日曜日9時・公園</text><rect x="68" y="361" width="512" height="139" rx="20" fill="#f2eeff" stroke="#c7bde5" stroke-width="3"/><text x="324" y="410" font-size="27" fill="#254b68" text-anchor="middle" font-weight="700">③ 読み手</text><text x="324" y="464" font-size="27" fill="#254b68" text-anchor="middle" font-weight="700">小学生の保護者</text><rect x="623" y="361" width="512" height="139" rx="20" fill="#e8f7ee" stroke="#add5bd" stroke-width="3"/><text x="879" y="410" font-size="27" fill="#254b68" text-anchor="middle" font-weight="700">④ 仕上がり</text><text x="879" y="464" font-size="27" fill="#254b68" text-anchor="middle" font-weight="700">見出しと本文</text><text x="600" y="601" font-size="22" fill="#53788e" text-anchor="middle" font-weight="700">必要に応じて「勝手に事実を足さない」などの条件も伝える</text><text x="600" y="639" font-size="16" fill="#7b91a0" text-anchor="middle" font-weight="450">AI Portal｜考え方を説明するための模式図。回答例は固定ではありません。</text></g></svg>