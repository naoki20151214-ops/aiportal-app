<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">一度で終わりにしなくていい</title><desc id="desc">最初の依頼、回答を確認する工程、追加の修正指示の三段階を示す図。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eff9f3"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#648fb5" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',Meiryo,-apple-system,sans-serif"><text x="600" y="78" font-size="38" fill="#173e60" text-anchor="middle" font-weight="700">一度で終わりにしなくていい</text><text x="600" y="125" font-size="22" fill="#667f91" text-anchor="middle" font-weight="500">初稿を読み、追加のお願いで直していく</text><rect x="56" y="205" width="333" height="268" rx="20" fill="#e7f2ff" stroke="#afcde6" stroke-width="3"/><text x="222" y="264" font-size="29" fill="#254b68" text-anchor="middle" font-weight="700">① お願い</text><text x="222" y="344" font-size="25" fill="#254b68" text-anchor="middle" font-weight="700">案内文を作って</text><text x="222" y="391" font-size="23" fill="#254b68" text-anchor="middle" font-weight="700">日曜日9時、公園</text><rect x="434" y="205" width="333" height="268" rx="20" fill="#fff2e8" stroke="#e2c4a9" stroke-width="3"/><text x="600" y="264" font-size="29" fill="#254b68" text-anchor="middle" font-weight="700">② 確認</text><text x="600" y="341" font-size="23" fill="#254b68" text-anchor="middle" font-weight="700">条件は合ってる？</text><text x="600" y="389" font-size="23" fill="#254b68" text-anchor="middle" font-weight="700">文章は読みやすい？</text><rect x="812" y="205" width="333" height="268" rx="20" fill="#e8f7ee" stroke="#abd4bb" stroke-width="3"/><text x="979" y="264" font-size="27" fill="#254b68" text-anchor="middle" font-weight="700">③ 修正を依頼</text><text x="979" y="340" font-size="24" fill="#254b68" text-anchor="middle" font-weight="700">もっとやさしく</text><text x="979" y="389" font-size="22" fill="#254b68" text-anchor="middle" font-weight="700">日時は変えないで</text><path d="M398 335 H424" fill="none" stroke="#648fb5" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M777 335 H802" fill="none" stroke="#648fb5" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600" y="550" font-size="26" fill="#486f83" text-anchor="middle" font-weight="700">確認して、必要なところだけ直す</text><text x="600" y="639" font-size="16" fill="#7b91a0" text-anchor="middle" font-weight="450">AI Portal｜考え方を説明するための模式図。回答例は固定ではありません。</text></g></svg>