<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">「お知らせを書いて」では足りない</title><desc id="desc">最初の短い指示で仕事だけ分かり、材料、読み手、仕上がりが未指定である図。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eff9f3"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#648fb5" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',Meiryo,-apple-system,sans-serif"><text x="600" y="78" font-size="38" fill="#173e60" text-anchor="middle" font-weight="700">「お知らせを書いて」では足りない</text><text x="600" y="125" font-size="22" fill="#667f91" text-anchor="middle" font-weight="500">仕事は伝わる。でも、ほかの条件は不明のまま</text><rect x="75" y="192" width="1052" height="354" rx="20" fill="#fff" stroke="#c3d9e5" stroke-width="3"/><text x="600" y="250" font-size="34" fill="#254b68" text-anchor="middle" font-weight="700">「お知らせを書いて」</text><rect x="109" y="314" width="224" height="150" rx="16" fill="#e6f4ff" stroke="#abcde7" stroke-width="3"/><text x="221" y="367" font-size="25" fill="#254b68" text-anchor="middle" font-weight="700">仕事</text><text x="221" y="427" font-size="23" fill="#37739b" text-anchor="middle" font-weight="700">書いてほしい</text><rect x="362" y="314" width="224" height="150" rx="16" fill="#fff0e8" stroke="#e4c0a8" stroke-width="3"/><text x="474" y="367" font-size="25" fill="#254b68" text-anchor="middle" font-weight="700">材料</text><text x="474" y="427" font-size="23" fill="#9b7160" text-anchor="middle" font-weight="700">まだ不明</text><rect x="615" y="314" width="224" height="150" rx="16" fill="#fff0e8" stroke="#e4c0a8" stroke-width="3"/><text x="727" y="367" font-size="25" fill="#254b68" text-anchor="middle" font-weight="700">読み手</text><text x="727" y="427" font-size="23" fill="#9b7160" text-anchor="middle" font-weight="700">まだ不明</text><rect x="868" y="314" width="224" height="150" rx="16" fill="#fff0e8" stroke="#e4c0a8" stroke-width="3"/><text x="980" y="367" font-size="25" fill="#254b68" text-anchor="middle" font-weight="700">仕上がり</text><text x="980" y="427" font-size="23" fill="#9b7160" text-anchor="middle" font-weight="700">まだ不明</text><text x="600" y="599" font-size="22" fill="#54778f" text-anchor="middle" font-weight="700">AIが確実に知ることができるのは、渡された情報だけ</text><text x="600" y="639" font-size="16" fill="#7b91a0" text-anchor="middle" font-weight="450">AI Portal｜考え方を説明するための模式図。回答例は固定ではありません。</text></g></svg>