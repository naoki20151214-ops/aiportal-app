<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">プロンプトで、答えはどう変わる？</title><desc id="desc">左の曖昧な依頼と右の具体的な依頼を比較して、必要な情報の違いを描いた図。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eff9f3"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#648fb5" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',Meiryo,-apple-system,sans-serif"><text x="600" y="78" font-size="38" fill="#173e60" text-anchor="middle" font-weight="700">プロンプトで、答えはどう変わる？</text><text x="600" y="125" font-size="22" fill="#667f91" text-anchor="middle" font-weight="500">町内会の案内文をAIへお願いする例</text><rect x="68" y="194" width="475" height="335" rx="20" fill="#fff" stroke="#b6cfe3" stroke-width="3"/><text x="307" y="246" font-size="30" fill="#254b68" text-anchor="middle" font-weight="700">短いお願い</text><rect x="122" y="294" width="368" height="90" rx="15" fill="#f4f6f8" stroke="#d4dfe6" stroke-width="3"/><text x="306" y="350" font-size="27" fill="#254b68" text-anchor="middle" font-weight="700">「お知らせを書いて」</text><text x="307" y="457" font-size="27" fill="#9a6b66" text-anchor="middle" font-weight="700">情報が足りない</text><rect x="650" y="194" width="480" height="335" rx="20" fill="#fff" stroke="#b4d6c4" stroke-width="3"/><text x="891" y="246" font-size="30" fill="#254b68" text-anchor="middle" font-weight="700">具体的なお願い</text><rect x="699" y="283" width="382" height="181" rx="16" fill="#e9f8ee" stroke="#a4d3b8" stroke-width="3"/><text x="889" y="328" font-size="26" fill="#287655" text-anchor="middle" font-weight="700">清掃活動の案内文</text><text x="889" y="370" font-size="26" fill="#287655" text-anchor="middle" font-weight="700">日曜日9時・公園</text><text x="889" y="412" font-size="24" fill="#287655" text-anchor="middle" font-weight="700">保護者向け・やさしく</text><text x="893" y="498" font-size="25" fill="#4a8068" text-anchor="middle" font-weight="700">ほしい形を伝える</text><path d="M553 355 H634" fill="none" stroke="#648fb5" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600" y="589" font-size="26" fill="#456d83" text-anchor="middle" font-weight="700">同じ仕事でも、伝える条件が違う</text><text x="600" y="639" font-size="16" fill="#7b91a0" text-anchor="middle" font-weight="450">AI Portal｜考え方を説明するための模式図。回答例は固定ではありません。</text></g></svg>