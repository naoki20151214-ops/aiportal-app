<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="80" text-anchor="middle" font-size="44" font-weight="900" fill="#082c63">文字・単語・Tokenは同じではない</text><g text-anchor="middle"><rect x="90" y="190" width="300" height="310" rx="28" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="240" y="250" font-size="26" font-weight="900" fill="#46718f">文字</text><text x="240" y="340" font-size="29" fill="#55778d">A｜I｜を</text><text x="240" y="400" font-size="18" fill="#71818c">1文字ずつ</text><rect x="450" y="190" width="300" height="310" rx="28" fill="#eaf5ff" stroke="#a9cae3" stroke-width="3"/><text x="600" y="250" font-size="26" font-weight="900" fill="#2f6e9b">単語</text><text x="600" y="340" font-size="29" fill="#255f8c">AI｜勉強</text><text x="600" y="400" font-size="18" fill="#638198">意味のまとまり</text><rect x="810" y="190" width="300" height="310" rx="28" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="960" y="250" font-size="26" font-weight="900" fill="#2f765f">Token</text><text x="960" y="330" font-size="25" fill="#2a715b">文字の場合も</text><text x="960" y="370" font-size="25" fill="#2a715b">単語の一部の場合も</text><text x="960" y="425" font-size="18" fill="#61796f">Tokenizer次第</text></g><text x="600" y="585" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87">1文字 = 1 Token、1単語 = 1 Token とは限らない</text></svg>