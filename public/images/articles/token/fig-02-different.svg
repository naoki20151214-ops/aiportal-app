<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="80" text-anchor="middle" font-size="43" font-weight="900" fill="#082c63">同じ文章でも、切れ方は一つではない</text><text x="600" y="145" text-anchor="middle" font-size="27" font-weight="900" fill="#355f87">「今日は学校に行きました」</text><rect x="100" y="220" width="440" height="265" rx="28" fill="#eaf5ff" stroke="#a9cae3" stroke-width="3"/><text x="320" y="275" text-anchor="middle" font-size="24" font-weight="900" fill="#2f6e9b">Tokenizer A のイメージ</text><text x="320" y="360" text-anchor="middle" font-size="28" fill="#255f8c">今日｜は｜学校｜に</text><text x="320" y="410" text-anchor="middle" font-size="28" fill="#255f8c">行き｜ました</text><rect x="660" y="220" width="440" height="265" rx="28" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="880" y="275" text-anchor="middle" font-size="24" font-weight="900" fill="#2f765f">Tokenizer B のイメージ</text><text x="880" y="360" text-anchor="middle" font-size="28" fill="#2a715b">今日｜は｜学｜校に</text><text x="880" y="410" text-anchor="middle" font-size="28" fill="#2a715b">行｜きました</text><text x="600" y="575" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87">例は説明用。実際の分割はModel・Encoding・言語などで変わる</text></svg>