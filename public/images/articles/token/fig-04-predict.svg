<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="80" text-anchor="middle" font-size="44" font-weight="900" fill="#082c63">言語Modelは「次のToken」を予測する</text><g text-anchor="middle"><rect x="75" y="230" width="260" height="160" rx="25" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="205" y="290" font-size="22" font-weight="900" fill="#46718f">ここまでのToken列</text><text x="205" y="345" font-size="23" fill="#55778d">私は｜今日｜…</text><path d="M355 310 H435" stroke="#7398b0" stroke-width="7"/><rect x="455" y="230" width="290" height="160" rx="25" fill="#eaf5ff" stroke="#a9cae3" stroke-width="3"/><text x="600" y="290" font-size="22" font-weight="900" fill="#2f6e9b">次を予測</text><text x="600" y="345" font-size="24" fill="#255f8c">候補ごとに計算</text><path d="M765 310 H845" stroke="#7398b0" stroke-width="7"/><rect x="865" y="230" width="260" height="160" rx="25" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/><text x="995" y="290" font-size="22" font-weight="900" fill="#2f765f">1 Token生成</text><text x="995" y="345" font-size="25" fill="#2a715b">→ 追加</text></g><path d="M995 420 C995 535 205 535 205 420" fill="none" stroke="#6ea88f" stroke-width="6"/><text x="600" y="515" text-anchor="middle" font-size="22" font-weight="800" fill="#2f765f">追加された列を使って、また次を予測</text><text x="600" y="590" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87">この繰り返しが、画面では文章に見える</text></svg>