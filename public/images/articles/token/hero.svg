<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="70" y="72" font-size="23" font-weight="700" fill="#2874ba">AI Portal｜Token</text><text x="70" y="145" font-size="45" font-weight="900" fill="#082c63">AIは文章を、何個ずつ読んでいる？</text><text x="70" y="198" font-size="23" fill="#55758f">文字でも単語でもない「Token」という単位</text><rect x="85" y="300" width="260" height="115" rx="24" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="215" y="370" text-anchor="middle" font-size="27" font-weight="900" fill="#46718f">私はAIを勉強中</text><path d="M370 357 H455" stroke="#7398b0" stroke-width="8"/><g font-size="23" font-weight="900" text-anchor="middle"><rect x="480" y="285" width="130" height="85" rx="20" fill="#eaf5ff"/><text x="545" y="338" fill="#2f6e9b">Token</text><rect x="630" y="285" width="130" height="85" rx="20" fill="#eaf7f2"/><text x="695" y="338" fill="#2f765f">Token</text><rect x="780" y="285" width="130" height="85" rx="20" fill="#fff5ed"/><text x="845" y="338" fill="#95694d">Token</text><rect x="930" y="285" width="130" height="85" rx="20" fill="#f1effa"/><text x="995" y="338" fill="#65558c">Token</text></g><text x="770" y="430" text-anchor="middle" font-size="20" fill="#607d91">切れ方はModelやTokenizerで変わる</text><text x="600" y="575" text-anchor="middle" font-size="25" font-weight="800" fill="#355f87">Token = 言語ModelがTextを処理・予測する基本単位</text></svg>