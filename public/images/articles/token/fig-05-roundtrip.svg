<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="75" text-anchor="middle" font-size="42" font-weight="900" fill="#082c63">人間のTextと、Modelの処理をつなぐ</text><g font-size="20" font-weight="900" text-anchor="middle"><rect x="55" y="270" width="160" height="100" rx="22" fill="#fff" stroke="#d5e3ed" stroke-width="3"/><text x="135" y="330" fill="#46718f">Text</text><path d="M230 320 H285" stroke="#7398b0" stroke-width="6"/><rect x="300" y="270" width="160" height="100" rx="22" fill="#eaf5ff"/><text x="380" y="330" fill="#2f6e9b">Token</text><path d="M475 320 H530" stroke="#7398b0" stroke-width="6"/><rect x="545" y="270" width="160" height="100" rx="22" fill="#eef0fa"/><text x="625" y="330" fill="#65558c">Token ID</text><path d="M720 320 H775" stroke="#7398b0" stroke-width="6"/><rect x="790" y="270" width="160" height="100" rx="22" fill="#fff5ed"/><text x="870" y="330" fill="#95694d">Model</text><path d="M965 320 H1020" stroke="#7398b0" stroke-width="6"/><rect x="1035" y="270" width="120" height="100" rx="22" fill="#eaf7f2"/><text x="1095" y="330" fill="#2f765f">次</text></g><path d="M1095 410 C1095 545 135 545 135 410" fill="none" stroke="#6ea88f" stroke-width="6"/><text x="615" y="505" text-anchor="middle" font-size="22" font-weight="800" fill="#2f765f">生成されたToken列を、人間が読めるTextへ戻す</text><text x="600" y="590" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87">Tokenが人間の文章とModelの計算を橋渡しする</text></svg>