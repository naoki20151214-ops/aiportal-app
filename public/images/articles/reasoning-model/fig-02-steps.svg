<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">条件を確かめる四段階</title>
<desc id="d">箱の上限・搬入回数・帰りの回数・終了場所を確認する人間向けの考え方。モデル内部の実際の思考ログではない。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8e9"/><stop offset="1" stop-color="#ecf8fa"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)" stroke="none" stroke-width="0"/>
<circle cx="1125" cy="88" r="64" fill="#d7efe5" stroke="none" stroke-width="0"/><circle cx="83" cy="610" r="72" fill="#fae2d7" stroke="none" stroke-width="0"/>
<rect x="48" y="43" width="1104" height="92" rx="25" fill="#ffffff" stroke="none" stroke-width="0"/><text x="600" y="102" text-anchor="middle" fill="#274154" font-size="39" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">計算する前に、問いを整理する</text><rect x="54" y="212" width="258" height="284" rx="24" fill="#d9f2fc" stroke="#a8c7ce" stroke-width="2"/><circle cx="183" cy="275" r="33" fill="#ffffff" stroke="#a8c7ce" stroke-width="2"/><text x="183" y="286" text-anchor="middle" fill="#1e5162" font-size="30" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">1</text><text x="183" y="365" text-anchor="middle" fill="#274154" font-size="29" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">条件を読む</text><text x="183" y="427" text-anchor="middle" fill="#537081" font-size="21" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">37箱／8箱まで</text><rect x="345" y="212" width="258" height="284" rx="24" fill="#d7efe5" stroke="#a8c7ce" stroke-width="2"/><circle cx="474" cy="275" r="33" fill="#ffffff" stroke="#a8c7ce" stroke-width="2"/><text x="474" y="286" text-anchor="middle" fill="#1e5162" font-size="30" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">2</text><text x="474" y="365" text-anchor="middle" fill="#274154" font-size="29" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">搬入を数える</text><text x="474" y="427" text-anchor="middle" fill="#537081" font-size="21" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">5回で運び切る</text><rect x="636" y="212" width="258" height="284" rx="24" fill="#fff8ea" stroke="#a8c7ce" stroke-width="2"/><circle cx="765" cy="275" r="33" fill="#ffffff" stroke="#a8c7ce" stroke-width="2"/><text x="765" y="286" text-anchor="middle" fill="#1e5162" font-size="30" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">3</text><text x="765" y="365" text-anchor="middle" fill="#274154" font-size="29" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">帰りを数える</text><text x="765" y="427" text-anchor="middle" fill="#537081" font-size="21" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">途中で4回戻る</text><rect x="927" y="212" width="258" height="284" rx="24" fill="#fae2d7" stroke="#a8c7ce" stroke-width="2"/><circle cx="1056" cy="275" r="33" fill="#ffffff" stroke="#a8c7ce" stroke-width="2"/><text x="1056" y="286" text-anchor="middle" fill="#1e5162" font-size="30" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">4</text><text x="1056" y="365" text-anchor="middle" fill="#274154" font-size="29" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">最後を確認</text><text x="1056" y="427" text-anchor="middle" fill="#537081" font-size="21" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">会場で終了 → 9回</text><path d="M313 352L342 352" fill="none" stroke="#317e9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 343 L342 352L330 361" fill="none" stroke="#317e9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M604 352L633 352" fill="none" stroke="#317e9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M621 343 L633 352L621 361" fill="none" stroke="#317e9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M895 352L924 352" fill="none" stroke="#317e9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M912 343 L924 352L912 361" fill="none" stroke="#317e9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="563" text-anchor="middle" fill="#537081" font-size="22" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">図は問題解決の説明用。AIの内部処理をそのまま示すものではありません</text>
<text x="1120" y="645" text-anchor="end" fill="#537081" font-size="17" font-weight="400" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">AI Portal ・学習用の概念図</text>
