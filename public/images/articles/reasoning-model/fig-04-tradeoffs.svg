<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">推論の深さと時間と検算の関係</title>
<desc id="d">簡単な短い質問は軽い処理で答えられる場合があり、複雑な制約を含む質問は追加の検討が役立つ場合がある。どちらも検証が必要。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8e9"/><stop offset="1" stop-color="#ecf8fa"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)" stroke="none" stroke-width="0"/>
<circle cx="1125" cy="88" r="64" fill="#d7efe5" stroke="none" stroke-width="0"/><circle cx="83" cy="610" r="72" fill="#fae2d7" stroke="none" stroke-width="0"/>
<rect x="49" y="37" width="1102" height="100" rx="24" fill="#ffffff" stroke="none" stroke-width="0"/><text x="600" y="101" text-anchor="middle" fill="#274154" font-size="41" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">考える量は、問題に合わせる</text><rect x="62" y="174" width="507" height="386" rx="25" fill="#d9f2fc" stroke="#a8c7ce" stroke-width="2"/><text x="315" y="237" text-anchor="middle" fill="#274154" font-size="32" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">簡単な質問</text><text x="315" y="311" text-anchor="middle" fill="#1e5162" font-size="28" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">「会場は何階？」</text><rect x="134" y="366" width="365" height="72" rx="22" fill="#ffffff" stroke="none" stroke-width="0"/><text x="314" y="411" text-anchor="middle" fill="#317e9a" font-size="27" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">素早く確認</text><text x="315" y="509" text-anchor="middle" fill="#537081" font-size="22" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">元の案内を確かめる</text><rect x="632" y="174" width="507" height="386" rx="25" fill="#fae2d7" stroke="#a8c7ce" stroke-width="2"/><text x="885" y="237" text-anchor="middle" fill="#274154" font-size="32" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">複雑な質問</text><text x="885" y="309" text-anchor="middle" fill="#1e5162" font-size="28" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">「37箱を何回移動？」</text><rect x="704" y="366" width="365" height="72" rx="22" fill="#ffffff" stroke="none" stroke-width="0"/><text x="887" y="411" text-anchor="middle" fill="#ad6a40" font-size="27" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">条件を分けて検討</text><text x="885" y="509" text-anchor="middle" fill="#537081" font-size="22" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">計算と前提を検算</text><text x="600" y="612" text-anchor="middle" fill="#537081" font-size="23" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">より長く考えても、正解が保証されるわけではありません</text>
<text x="1120" y="645" text-anchor="end" fill="#537081" font-size="17" font-weight="400" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">AI Portal ・学習用の概念図</text>
</svg>
