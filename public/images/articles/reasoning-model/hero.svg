stroke-width="0"/></g><text x="208" y="552" text-anchor="middle" fill="#1e5162" font-size="25" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">「搬入は5回」</text><path d="M369 348L430 348" fill="none" stroke="#317e9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M418 339 L430 348L418 357" fill="none" stroke="#317e9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="433" y="179" width="324" height="379" rx="25" fill="#fff8ea" stroke="#a8c7ce" stroke-width="2"/><text x="595" y="244" text-anchor="middle" fill="#274154" font-size="28" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">何を数える？</text><text x="595" y="289" text-anchor="middle" fill="#537081" font-size="21" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">行きだけ？ 帰りも？</text><g transform="translate(595,392) scale(0.88)"><rect x="-55" y="-40" width="110" height="89" rx="22" fill="#e5f4f8" stroke="#274154" stroke-width="4"/><circle cx="-21" cy="-5" r="7" fill="#317e9a" stroke="none" stroke-width="0"/><circle cx="21" cy="-5" r="7" fill="#317e9a" stroke="none" stroke-width="0"/><path d="M-18 19Q0 32 18 19" fill="none" stroke="#274154" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -40L0 -59" fill="none" stroke="#274154" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-65" r="7" fill="#f2bd87" stroke="none" stroke-width="0"/><rect x="-56" y="57" width="112" height="54" rx="20" fill="#d9f2fc" stroke="#274154" stroke-width="4"/><path d="M-45 67L-75 89" fill="none" stroke="#274154" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M45 67L75 89" fill="none" stroke="#274154" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="511" y="484" width="172" height="45" rx="14" fill="#ffffff" stroke="none" stroke-width="0"/><text x="597" y="516" text-anchor="middle" fill="#1e5162" font-size="26" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">9回なの？</text><path d="M766 348L829 348" fill="none" stroke="#317e9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M817 339 L829 348L817 357" fill="none" stroke="#317e9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="833" y="179" width="305" height="379" rx="25" fill="#d7efe5" stroke="#a8c7ce" stroke-width="2"/><text x="985.5" y="244" text-anchor="middle" fill="#274154" font-size="28" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">答えの確認</text><text x="985.5" y="289" text-anchor="middle" fill="#537081" font-size="21" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">行き5回 ＋ 帰り4回</text><text x="983" y="424" text-anchor="middle" fill="#2a8a66" font-size="44" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">合計9回</text><text x="988" y="513" text-anchor="middle" fill="#537081" font-size="22" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">最後は会場で終了</text>
