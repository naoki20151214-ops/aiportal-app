<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">お手本なしで頼む「Zero-shot」</title><desc id="desc">時間・場所・読み手・仕上がりを伝え、お手本の案内文なしでAIへ作成を依頼する。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#f0f9f2"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#638db2" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="72" font-size="39" fill="#1a405e" text-anchor="middle" font-weight="700">お手本なしで頼む「Zero-shot」</text><text x="600" y="120" font-size="22" fill="#5a7d92" text-anchor="middle" font-weight="700">町内会の清掃案内を作る一回目の依頼</text><rect x="72" y="184" width="471" height="348" rx="20" fill="#fff" stroke="#b8d1e6" stroke-width="3"/><text x="306" y="245" font-size="30" fill="#244c69" text-anchor="middle" font-weight="700">AIへ渡すお願い</text><rect x="108" y="285" width="395" height="173" rx="20" fill="#e7f2ff" stroke="#a7c9e1" stroke-width="3"/><text x="305" y="330" font-size="26" fill="#244c69" text-anchor="middle" font-weight="700">日曜日 午前9時</text><text x="305" y="372" font-size="27" fill="#244c69" text-anchor="middle" font-weight="700">公園で清掃活動</text><text x="305" y="419" font-size="23" fill="#244c69" text-anchor="middle" font-weight="700">保護者向け・やさしく</text><rect x="640" y="184" width="486" height="348" rx="20" fill="#fff" stroke="#b1d3c1" stroke-width="3"/><text x="883" y="245" font-size="30" fill="#244c69" text-anchor="middle" font-weight="700">AIが作る案内文</text><rect x="688" y="285" width="392" height="173" rx="20" fill="#e6f7ef" stroke="#b4d8c3" stroke-width="3"/><text x="883" y="341" font-size="27" fill="#28765b" text-anchor="middle" font-weight="700">日曜日の朝、</text><text x="883" y="387" font-size="27" fill="#28765b" text-anchor="middle" font-weight="700">公園で清掃を</text><text x="883" y="427" font-size="27" fill="#28765b" text-anchor="middle" font-weight="700">行います。</text><path d="M556 359 H623" fill="none" stroke="#638db2" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600" y="569" font-size="27" fill="#4c718b" text-anchor="middle" font-weight="700">完成例を渡していない → Zero-shot</text><text x="600" y="637" font-size="16" fill="#7b93a4" text-anchor="middle" font-weight="700">AI Portal｜わかりやすさを重視した模式図。実際のAI出力例ではありません。</text></g></svg>