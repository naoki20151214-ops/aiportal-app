<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">お手本はいくつ？</title><desc id="desc">0件、1件、複数件のお手本を使う方式を三つの箱で比べる。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#f0f9f2"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#638db2" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="72" font-size="39" fill="#1a405e" text-anchor="middle" font-weight="700">お手本はいくつ？</text><text x="600" y="120" font-size="22" fill="#5a7d92" text-anchor="middle" font-weight="700">Zero-shot・One-shot・Few-shotの違い</text><rect x="59" y="205" width="337" height="314" rx="20" fill="#e6f1ff" stroke="#b1cce5" stroke-width="3"/><text x="227" y="272" font-size="30" fill="#346b97" text-anchor="middle" font-weight="700">Zero-shot</text><text x="227" y="361" font-size="48" fill="#346b97" text-anchor="middle" font-weight="700">0 件</text><text x="227" y="461" font-size="24" fill="#346b97" text-anchor="middle" font-weight="700">お手本なし</text><rect x="432" y="205" width="337" height="314" rx="20" fill="#f3efff" stroke="#c4b7e2" stroke-width="3"/><text x="600" y="272" font-size="30" fill="#6659a4" text-anchor="middle" font-weight="700">One-shot</text><text x="600" y="361" font-size="48" fill="#6659a4" text-anchor="middle" font-weight="700">1 件</text><text x="600" y="461" font-size="24" fill="#6659a4" text-anchor="middle" font-weight="700">お手本一つ</text><rect x="805" y="205" width="337" height="314" rx="20" fill="#e6f7ee" stroke="#b2d9c4" stroke-width="3"/><text x="973" y="272" font-size="30" fill="#2c7d5d" text-anchor="middle" font-weight="700">Few-shot</text><text x="973" y="361" font-size="48" fill="#2c7d5d" text-anchor="middle" font-weight="700">数 件</text><text x="973" y="461" font-size="24" fill="#2c7d5d" text-anchor="middle" font-weight="700">お手本を複数</text><text x="600" y="584" font-size="22" fill="#627d91" text-anchor="middle" font-weight="700">お手本の数だけでは、回答の正確さは保証されません</text><text x="600" y="637" font-size="16" fill="#7b93a4" text-anchor="middle" font-weight="700">AI Portal｜わかりやすさを重視した模式図。実際のAI出力例ではありません。</text></g></svg>