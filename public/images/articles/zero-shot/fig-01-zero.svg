<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">ゼロなのは、お手本の数</title><desc id="desc">詳しい条件を記載しても、入力と回答を組にした見本が0件であることを強調。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#f0f9f2"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#638db2" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="72" font-size="39" fill="#1a405e" text-anchor="middle" font-weight="700">ゼロなのは、お手本の数</text><text x="600" y="120" font-size="22" fill="#5a7d92" text-anchor="middle" font-weight="700">指示や材料がゼロという意味ではない</text><rect x="71" y="193" width="1054" height="354" rx="20" fill="#fff" stroke="#c0d6e3" stroke-width="3"/><text x="600" y="250" font-size="29" fill="#244c69" text-anchor="middle" font-weight="700">町内会へのお願い</text><rect x="127" y="294" width="629" height="139" rx="20" fill="#e6f2ff" stroke="#a7cce6" stroke-width="3"/><text x="442" y="338" font-size="26" fill="#244c69" text-anchor="middle" font-weight="700">日時・場所・読み手・文字数</text><text x="442" y="391" font-size="24" fill="#4079a1" text-anchor="middle" font-weight="700">条件はたくさんあってよい</text><rect x="791" y="289" width="270" height="150" rx="20" fill="#e9f8ef" stroke="#b2d5bf" stroke-width="3"/><text x="926" y="338" font-size="29" fill="#327c60" text-anchor="middle" font-weight="700">お手本</text><text x="926" y="406" font-size="51" fill="#267e5f" text-anchor="middle" font-weight="700">0 件</text><text x="600" y="592" font-size="26" fill="#54728b" text-anchor="middle" font-weight="700">Zero-shot ＝ 短い指示、ではありません</text><text x="600" y="637" font-size="16" fill="#7b93a4" text-anchor="middle" font-weight="700">AI Portal｜わかりやすさを重視した模式図。実際のAI出力例ではありません。</text></g></svg>