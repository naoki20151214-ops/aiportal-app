<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AIの案内文を四つで確認</title><desc id="desc">日時、場所、持ち物、勝手に追加された情報の4つの確認項目を並べる。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0f9f3"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#648cb0" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',-apple-system,Meiryo,sans-serif"><text x="600" y="74" text-anchor="middle" font-size="39" font-weight="700" fill="#193e62">AIの案内文を四つで確認</text><text x="600" y="121" text-anchor="middle" font-size="23" font-weight="700" fill="#55788c">最後は、元資料と一項目ずつ照合する</text><rect x="68" y="194" width="514" height="147" rx="21" fill="#ebf4ff" stroke="#bad1e8" stroke-width="3"/><text x="325" y="248" text-anchor="middle" font-size="28" font-weight="700" fill="#3b77a0">① 日時</text><text x="325" y="305" text-anchor="middle" font-size="26" font-weight="700" fill="#3b77a0">日曜・午前9時</text><rect x="626" y="194" width="514" height="147" rx="21" fill="#ebf4ff" stroke="#bad1e8" stroke-width="3"/><text x="883" y="248" text-anchor="middle" font-size="28" font-weight="700" fill="#3b77a0">② 場所</text><text x="883" y="305" text-anchor="middle" font-size="26" font-weight="700" fill="#3b77a0">公園集合</text><rect x="68" y="365" width="514" height="147" rx="21" fill="#ebf8f1" stroke="#b4d9c5" stroke-width="3"/><text x="325" y="419" text-anchor="middle" font-size="28" font-weight="700" fill="#34775e">③ 持ち物</text><text x="325" y="476" text-anchor="middle" font-size="26" font-weight="700" fill="#34775e">軍手・飲み物</text><rect x="626" y="365" width="514" height="147" rx="21" fill="#fff0ea" stroke="#debab0" stroke-width="3"/><text x="883" y="419" text-anchor="middle" font-size="28" font-weight="700" fill="#9b5d4f">④ 追加情報</text><text x="883" y="476" text-anchor="middle" font-size="26" font-weight="700" fill="#9b5d4f">お弁当は未確認</text><text x="600" y="591" text-anchor="middle" font-size="23" font-weight="700" fill="#52758f">不明なことは、AIに埋めさせずに確認する</text><text x="600" y="638" text-anchor="middle" font-size="16" font-weight="700" fill="#8395a1">AI Portal｜説明のための架空の例。実際のイベント情報ではありません。</text></g></svg>