<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">正しい情報に、誤りが混ざる</title><desc id="desc">文章中に日曜日9時・公園・持ち物の正しい情報と、昼食無料という根拠のない情報が混ざっている。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0f9f3"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#648cb0" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',-apple-system,Meiryo,sans-serif"><text x="600" y="74" text-anchor="middle" font-size="39" font-weight="700" fill="#193e62">正しい情報に、誤りが混ざる</text><text x="600" y="121" text-anchor="middle" font-size="23" font-weight="700" fill="#55788c">一部分が正しくても、全部が正しいとは限らない</text><rect x="115" y="178" width="973" height="377" rx="21" fill="#fff" stroke="#bdd5e5" stroke-width="3"/><text x="600" y="229" text-anchor="middle" font-size="27" font-weight="700" fill="#214a69">清掃のお知らせに書かれた四つの情報</text><rect x="140" y="266" width="436" height="115" rx="21" fill="#e7f7ed" stroke="#9ed4b4" stroke-width="3"/><text x="358" y="310" text-anchor="middle" font-size="27" font-weight="700" fill="#287a59">日曜日 9時</text><text x="358" y="353" text-anchor="middle" font-size="21" font-weight="700" fill="#287a59">元資料にある</text><rect x="612" y="266" width="436" height="115" rx="21" fill="#e7f7ed" stroke="#9ed4b4" stroke-width="3"/><text x="830" y="310" text-anchor="middle" font-size="27" font-weight="700" fill="#287a59">公園集合</text><text x="830" y="353" text-anchor="middle" font-size="21" font-weight="700" fill="#287a59">元資料にある</text><rect x="140" y="401" width="436" height="115" rx="21" fill="#e7f7ed" stroke="#9ed4b4" stroke-width="3"/><text x="358" y="445" text-anchor="middle" font-size="27" font-weight="700" fill="#287a59">軍手・飲み物</text><text x="358" y="488" text-anchor="middle" font-size="21" font-weight="700" fill="#287a59">元資料にある</text><rect x="612" y="401" width="436" height="115" rx="21" fill="#fff0e8" stroke="#dcb7a5" stroke-width="3"/><text x="830" y="445" text-anchor="middle" font-size="27" font-weight="700" fill="#ad594e">無料のお弁当</text><text x="830" y="488" text-anchor="middle" font-size="21" font-weight="700" fill="#ad594e">元資料にない</text><text x="600" y="588" text-anchor="middle" font-size="24" font-weight="700" fill="#52728d">四つのうち三つが正しくても、残り一つは要確認</text><text x="600" y="638" text-anchor="middle" font-size="16" font-weight="700" fill="#8395a1">AI Portal｜説明のための架空の例。実際のイベント情報ではありません。</text></g></svg>