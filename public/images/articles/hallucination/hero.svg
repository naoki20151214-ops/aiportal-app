<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">文章が自然でも、事実は別</title><desc id="desc">元資料には日曜日9時、公園、軍手と飲み物のみ。生成した案内には根拠のない昼食無料が付け足される例。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0f9f3"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#648cb0" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',-apple-system,Meiryo,sans-serif"><text x="600" y="74" text-anchor="middle" font-size="39" font-weight="700" fill="#193e62">文章が自然でも、事実は別</text><text x="600" y="121" text-anchor="middle" font-size="23" font-weight="700" fill="#55788c">町内会の清掃案内に、存在しない予定が混ざる</text><rect x="63" y="193" width="481" height="340" rx="21" fill="#fff" stroke="#bcd1e1" stroke-width="3"/><text x="303" y="243" text-anchor="middle" font-size="30" font-weight="700" fill="#214a69">元の予定表</text><rect x="101" y="283" width="406" height="201" rx="21" fill="#e8f4ff" stroke="#afcee5" stroke-width="3"/><text x="303" y="337" text-anchor="middle" font-size="27" font-weight="700" fill="#214a69">日曜日 午前9時</text><text x="303" y="389" text-anchor="middle" font-size="27" font-weight="700" fill="#214a69">公園集合</text><text x="303" y="440" text-anchor="middle" font-size="27" font-weight="700" fill="#214a69">軍手と飲み物</text><rect x="650" y="193" width="481" height="340" rx="21" fill="#fff" stroke="#e0c0b4" stroke-width="3"/><text x="890" y="243" text-anchor="middle" font-size="29" font-weight="700" fill="#214a69">AIが作った案内文</text><rect x="694" y="277" width="397" height="201" rx="21" fill="#fff1e9" stroke="#e3c2b3" stroke-width="3"/><text x="890" y="331" text-anchor="middle" font-size="25" font-weight="700" fill="#214a69">日曜日 午前9時</text><text x="890" y="378" text-anchor="middle" font-size="24" font-weight="700" fill="#214a69">軍手と飲み物</text><text x="890" y="435" text-anchor="middle" font-size="32" font-weight="700" fill="#b15d4e">昼食無料！</text><path d="M556 364 H635" stroke="#648cb0" fill="none" stroke-width="7" stroke-linecap="round" marker-end="url(#a)"/><text x="600" y="584" text-anchor="middle" font-size="25" font-weight="700" fill="#99685a">「昼食無料」は元の資料には書いていない</text><text x="600" y="638" text-anchor="middle" font-size="16" font-weight="700" fill="#8395a1">AI Portal｜説明のための架空の例。実際のイベント情報ではありません。</text></g></svg>