<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">文章を作ることと、確かめること</title><desc id="desc">学習済みLLMが文章を生成する工程と、元の予定表で事実を確かめる工程を並べた図。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0f9f3"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#648cb0" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',-apple-system,Meiryo,sans-serif"><text x="600" y="74" text-anchor="middle" font-size="39" font-weight="700" fill="#193e62">文章を作ることと、確かめること</text><text x="600" y="121" text-anchor="middle" font-size="23" font-weight="700" fill="#55788c">流ちょうさと事実の正しさは別の仕事</text><rect x="77" y="201" width="473" height="314" rx="21" fill="#eaf4ff" stroke="#b1cee7" stroke-width="3"/><text x="313" y="267" text-anchor="middle" font-size="31" font-weight="700" fill="#214a69">文章を作る</text><text x="313" y="332" text-anchor="middle" font-size="25" font-weight="700" fill="#214a69">読みやすい順番に</text><text x="313" y="387" text-anchor="middle" font-size="25" font-weight="700" fill="#214a69">言葉を組み立てる</text><text x="313" y="470" text-anchor="middle" font-size="23" font-weight="700" fill="#4c79a1">LLMの生成</text><rect x="650" y="201" width="473" height="314" rx="21" fill="#eaf8f0" stroke="#abd5bd" stroke-width="3"/><text x="886" y="267" text-anchor="middle" font-size="31" font-weight="700" fill="#277858">事実を確かめる</text><text x="886" y="332" text-anchor="middle" font-size="25" font-weight="700" fill="#277858">元の予定表と</text><text x="886" y="387" text-anchor="middle" font-size="24" font-weight="700" fill="#277858">内容を照らし合わせる</text><text x="886" y="470" text-anchor="middle" font-size="23" font-weight="700" fill="#43866b">人と資料の確認</text><path d="M557 357 H638" stroke="#648cb0" fill="none" stroke-width="7" stroke-linecap="round" marker-end="url(#a)"/><text x="600" y="582" text-anchor="middle" font-size="26" font-weight="700" fill="#587991">「自然に書けた」だけでは、完了ではない</text><text x="600" y="638" text-anchor="middle" font-size="16" font-weight="700" fill="#8395a1">AI Portal｜説明のための架空の例。実際のイベント情報ではありません。</text></g></svg>