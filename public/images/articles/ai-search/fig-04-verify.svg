<title id="t">古い案内と最新の正式な案内を見分ける</title><desc id="d">最初の案内A、新しい正式通知B、古い案内を当日に再投稿したCを比較し、Bを選ぶ図。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9ed"/><stop offset="1" stop-color="#ecf7fb"/></linearGradient><filter id="shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#537282" flood-opacity=".13"/></filter></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)" stroke="none" stroke-width="0"/>
<circle cx="1130" cy="70" r="85" fill="#dcefe7" stroke="none" stroke-width="0"/><circle cx="95" cy="602" r="85" fill="#f9e5d9" stroke="none" stroke-width="0"/>
<rect x="48" y="40" width="1104" height="92" rx="22" fill="white" stroke="none" stroke-width="0"/><text x="600" y="100" font-size="38" fill="#264358" text-anchor="middle" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">新しい投稿が、正しい案内とは限らない</text><rect x="55" y="170" width="341" height="385" rx="24" fill="#ffe6d9" stroke="#aec8ce" stroke-width="2"/><text x="226" y="222" font-size="30" fill="#264358" text-anchor="middle" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">A｜最初の案内</text><text x="226" y="287" font-size="23" fill="#566d7a" text-anchor="middle" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">主催者・先週</text><text x="226" y="353" font-size="30" fill="#264358" text-anchor="middle" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">18:30 屋上</text><text x="226" y="433" font-size="28" fill="#b66d43" text-anchor="middle" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">変更前</text><rect x="430" y="160" width="341" height="405" rx="24" fill="#d2eee1" stroke="#2b8367" stroke-width="4"/><text x="600" y="220" font-size="30" fill="#264358" text-anchor="middle" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">B｜改訂のお知らせ</text><text x="600" y="287" font-size="23" fill="#2b8367" text-anchor="middle" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">主催者・当日</text><text x="600" y="353" font-size="30" fill="#264358" text-anchor="middle" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">19:00 2階</text><text x="600" y="433" font-size="28" fill="#2b8367" text-anchor="middle" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">正式な更新情報</text><circle cx="735" cy="177" r="30" fill="#2b8367" stroke="none" stroke-width="0"/><text x="735" y="188" font-size="30" fill="white" text-anchor="middle" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">✓</text><rect x="805" y="170" width="341" height="385" rx="24" fill="#e9f6fc" stroke="#aec8ce" stroke-width="2"/><text x="975" y="222" font-size="30" fill="#264358" text-anchor="middle" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">C｜再投稿</text><text x="975" y="287" font-size="23" fill="#566d7a" text-anchor="middle" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">個人ブログ・当日</text><text x="975" y="353" font-size="30" fill="#264358" text-anchor="middle" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">18:30 屋上</text><text x="975" y="433" font-size="28" fill="#b66d43" text-anchor="middle" font-weight="700" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">内容は古い</text><text x="600" y="608" font-size="26" fill="#264358" text-anchor="middle" font-weight="600" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">発信者・対象日・更新内容を見比べる</text>
