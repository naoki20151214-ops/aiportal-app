<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="600" y="90" text-anchor="middle" font-size="40" font-weight="900" fill="#082c63">新しい写真はどちらに近い？</text><rect x="65" y="210" width="485" height="250" rx="30" fill="#eaf5ff" stroke="#a9cae3" stroke-width="4"/><text x="307" y="335" text-anchor="middle" font-size="25" font-weight="800" fill="#2f6e9b">新しい写真 [5.2, 2.1, 4.1]</text><path d="M560 335 H640" stroke="#7398b0" stroke-width="8"/><rect x="650" y="210" width="485" height="250" rx="30" fill="#eaf7f2" stroke="#acd7c6" stroke-width="4"/><text x="892" y="335" text-anchor="middle" font-size="25" font-weight="800" fill="#2f765f">猫の例 [5, 2, 4]</text><text x="600" y="560" text-anchor="middle" font-size="22" font-weight="800" fill="#355f87">数値は説明用の架空の例です</text><path d="M80 590 H1120" stroke="#d5e3ed" stroke-width="3"/><text x="600" y="625" text-anchor="middle" font-size="18" fill="#55758f">同じ測定項目を同じ順番で並べることで比較できます。判定はあくまで説明用の例です。</text></svg>