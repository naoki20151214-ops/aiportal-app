<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">QueryとKeyで対応を調べる</title><desc id="desc">どの位置もQとKを作り、参照される単語がKey専用なわけではない図。</desc><defs><linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#effaf4"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#5792ba" stroke-width="1.6" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#background)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="76" text-anchor="middle" font-size="40" font-weight="700" fill="#173c61">QueryとKeyで対応を調べる</text><text x="600" y="124" text-anchor="middle" font-size="22" font-weight="500" fill="#58778e">「帽子」のQueryと「赤い」のKeyを組み合わせる例</text><rect x="70" y="177" width="1057" height="388" rx="22" fill="#fff" stroke="#c0d8e6" stroke-width="3"/><rect x="117" y="268" width="375" height="117" rx="16" fill="#e8f3ff" stroke="#9ec4e2" stroke-width="3"/><text x="304.5" y="336.8333333333333" text-anchor="middle" font-size="31" font-weight="700" fill="#266a9b">「帽子」のQuery</text><rect x="709" y="268" width="375" height="117" rx="16" fill="#e7f6ed" stroke="#9dd1b6" stroke-width="3"/><text x="896.5" y="336.8333333333333" text-anchor="middle" font-size="31" font-weight="700" fill="#287e60">「赤い」のKey</text><path d="M506 325 H696" stroke="#668cba" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="601" y="291" text-anchor="middle" font-size="22" font-weight="700" fill="#5e6fa0">対応を計算</text><rect x="313" y="441" width="577" height="77" rx="16" fill="#f7f4ff" stroke="#c6bde3" stroke-width="3"/><text x="600" y="486" text-anchor="middle" font-size="26" font-weight="700" fill="#605c9e">位置同士の重みを求める材料になる</text><text x="600" y="601" text-anchor="middle" font-size="20" font-weight="700" fill="#617b91">※「赤い」もQuery、「帽子」もKeyを作ります</text><text x="600" y="638" text-anchor="middle" font-size="17" font-weight="500" fill="#788da0">AI Portal｜仕組みを説明する模式図・実際のAttentionの値ではありません</text></g></svg>