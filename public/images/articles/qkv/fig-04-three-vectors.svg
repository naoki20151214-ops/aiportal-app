<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">同じ位置から三種類のベクトル</title><desc id="desc">一つのToken位置の数値表現からQuery Key Valueを学習済みパラメータで作る。</desc><defs><linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#effaf4"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#5792ba" stroke-width="1.6" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#background)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="76" text-anchor="middle" font-size="40" font-weight="700" fill="#173c61">同じ位置から三種類のベクトル</text><text x="600" y="124" text-anchor="middle" font-size="22" font-weight="500" fill="#58778e">学習済みパラメータを使って、入力の数字を別々に変換する</text><rect x="343" y="165" width="514" height="103" rx="20" fill="#eaf4ff" stroke="#acd0e8" stroke-width="3"/><text x="600" y="222" text-anchor="middle" font-size="31" font-weight="700" fill="#316a9b">その位置の数値表現</text><path d="M600 279 V328" stroke="#618dad" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="62" y="366" width="310" height="134" rx="16" fill="#e7edff" stroke="#9faee1" stroke-width="3"/><text x="217" y="445.3333333333333" text-anchor="middle" font-size="37" font-weight="700" fill="#5568a8">Query</text><rect x="445" y="366" width="310" height="134" rx="16" fill="#e6f4ff" stroke="#a6cce2" stroke-width="3"/><text x="600" y="445.3333333333333" text-anchor="middle" font-size="37" font-weight="700" fill="#286998">Key</text><rect x="828" y="366" width="310" height="134" rx="16" fill="#e4f6ec" stroke="#a6d8bb" stroke-width="3"/><text x="983" y="445.3333333333333" text-anchor="middle" font-size="37" font-weight="700" fill="#22775a">Value</text><path d="M600 320 Q210 312 210 354" stroke="#7094b0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M600 320 V355" stroke="#7094b0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M600 320 Q980 312 980 354" stroke="#7094b0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="600" y="563" text-anchor="middle" font-size="26" font-weight="700" fill="#536f89">三種類とも数字の並び。役割が異なる。</text><text x="600" y="638" text-anchor="middle" font-size="17" font-weight="500" fill="#788da0">AI Portal｜仕組みを説明する模式図・実際のAttentionの値ではありません</text></g></svg>