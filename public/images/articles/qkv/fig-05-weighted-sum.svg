<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Valueの重み付き和を計算</title><desc id="desc">Value赤い[2,0]とValue帽子[0,4]を75%25%で統合して[1.5,1.0]になる算数の例。</desc><defs><linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#effaf4"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#5792ba" stroke-width="1.6" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#background)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="76" text-anchor="middle" font-size="40" font-weight="700" fill="#173c61">Valueの重み付き和を計算</text><text x="600" y="124" text-anchor="middle" font-size="22" font-weight="500" fill="#58778e">架空の二次元ベクトルで、重みの使い道だけ確かめる</text><rect x="55" y="175" width="1088" height="423" rx="24" fill="#fff" stroke="#bfd7e5" stroke-width="3"/><rect x="108" y="245" width="416" height="95" rx="16" fill="#fff0ec" stroke="#e6b8b0" stroke-width="3"/><text x="316" y="301.1666666666667" text-anchor="middle" font-size="26" font-weight="700" fill="#af544e">「赤い」Value [2, 0]</text><rect x="679" y="245" width="416" height="95" rx="16" fill="#eaf3ff" stroke="#b0cde1" stroke-width="3"/><text x="887" y="301.1666666666667" text-anchor="middle" font-size="26" font-weight="700" fill="#286898">「帽子」Value [0, 4]</text><text x="313" y="383" text-anchor="middle" font-size="29" font-weight="700" fill="#a65e55">× 0.75</text><text x="888" y="383" text-anchor="middle" font-size="29" font-weight="700" fill="#4375a3">× 0.25</text><path d="M317 403 Q421 470 559 477" stroke="#cf837c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M884 403 Q786 470 650 477" stroke="#6898bd" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="430" y="492" width="339" height="75" rx="16" fill="#e5f7ec" stroke="#a4d4b8" stroke-width="3"/><text x="600" y="542" text-anchor="middle" font-size="35" font-weight="700" fill="#267455">[1.5, 1.0]</text><text x="600" y="608" text-anchor="middle" font-size="18" font-weight="700" fill="#7b8c9f">※数字は理解のための架空値。各成分は「赤さ」を直接表しません</text><text x="600" y="638" text-anchor="middle" font-size="17" font-weight="500" fill="#788da0">AI Portal｜仕組みを説明する模式図・実際のAttentionの値ではありません</text></g></svg>