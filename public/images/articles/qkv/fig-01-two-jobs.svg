<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">調べる仕事と取り込む仕事</title><desc id="desc">情報の参照比率を決めることと、取り込む数値情報を使うことを区別する。</desc><defs><linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#effaf4"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#5792ba" stroke-width="1.6" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#background)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="76" text-anchor="middle" font-size="40" font-weight="700" fill="#173c61">調べる仕事と取り込む仕事</text><text x="600" y="124" text-anchor="middle" font-size="22" font-weight="500" fill="#58778e">検索結果の順位だけでは、本文は読めません</text><rect x="75" y="178" width="492" height="370" rx="24" fill="#eaf3ff" stroke="#afcfe4" stroke-width="3"/><text x="319" y="238" text-anchor="middle" font-size="29" font-weight="700" fill="#355f92">仕事①</text><text x="319" y="297" text-anchor="middle" font-size="30" font-weight="700" fill="#235d8e">どこを参考にする？</text><rect x="142" y="348" width="352" height="90" rx="16" fill="#fff" stroke="#b3cede" stroke-width="3"/><text x="318" y="401.3333333333333" text-anchor="middle" font-size="25" font-weight="700" fill="#3978a0">参照する重みを決定</text><rect x="633" y="178" width="492" height="370" rx="24" fill="#e7f7ed" stroke="#a7d5bd" stroke-width="3"/><text x="879" y="238" text-anchor="middle" font-size="29" font-weight="700" fill="#27785c">仕事②</text><text x="879" y="297" text-anchor="middle" font-size="30" font-weight="700" fill="#27785c">何を取り込む？</text><rect x="700" y="348" width="352" height="90" rx="16" fill="#fff" stroke="#b3d9c4" stroke-width="3"/><text x="876" y="401.3333333333333" text-anchor="middle" font-size="25" font-weight="700" fill="#28765b">Valueの数値を統合</text><text x="600" y="586" text-anchor="middle" font-size="23" font-weight="700" fill="#527489">仕事①だけでは、数値表現の更新に使う情報は得られない</text><text x="600" y="638" text-anchor="middle" font-size="17" font-weight="500" fill="#788da0">AI Portal｜仕組みを説明する模式図・実際のAttentionの値ではありません</text></g></svg>