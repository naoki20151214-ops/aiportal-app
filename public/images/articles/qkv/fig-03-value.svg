<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">なぜValueが必要なのか</title><desc id="desc">Q K は参照を調べ、V は実際に組み合わせるベクトルであることを示す。</desc><defs><linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#effaf4"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#5792ba" stroke-width="1.6" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#background)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="76" text-anchor="middle" font-size="40" font-weight="700" fill="#173c61">なぜValueが必要なのか</text><text x="600" y="124" text-anchor="middle" font-size="22" font-weight="500" fill="#58778e">重みが分かっても、取り込む数値情報が必要</text><rect x="93" y="209" width="414" height="127" rx="16" fill="#e7f1ff" stroke="#a4c5e5" stroke-width="3"/><text x="300" y="283.5" text-anchor="middle" font-size="33" font-weight="700" fill="#226997">Query＋Key</text><rect x="691" y="209" width="414" height="127" rx="16" fill="#e5f6ee" stroke="#a4d1bd" stroke-width="3"/><text x="898" y="284.1666666666667" text-anchor="middle" font-size="35" font-weight="700" fill="#21775a">Value</text><text x="300" y="380" text-anchor="middle" font-size="27" font-weight="700" fill="#416984">どの位置をどれほど？</text><text x="898" y="380" text-anchor="middle" font-size="27" font-weight="700" fill="#417d68">取り込む数値情報</text><path d="M300 413 Q600 558 898 413" stroke="#709fbb" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="298" y="505" width="607" height="76" rx="18" fill="#fff" stroke="#bed9e4" stroke-width="3"/><text x="600" y="552" text-anchor="middle" font-size="29" font-weight="700" fill="#246b7b">重みに応じてValueを組み合わせる</text><text x="600" y="638" text-anchor="middle" font-size="17" font-weight="500" fill="#788da0">AI Portal｜仕組みを説明する模式図・実際のAttentionの値ではありません</text></g></svg>