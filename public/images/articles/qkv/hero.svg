<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Q・K・Vは何のためにある？</title><desc id="desc">赤い帽子を出発点にQuery Keyで重みを作り、Valueを使って情報を取り込む概要。</desc><defs><linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#effaf4"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#5792ba" stroke-width="1.6" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#background)"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="76" text-anchor="middle" font-size="40" font-weight="700" fill="#173c61">Q・K・Vは何のためにある？</text><text x="600" y="124" text-anchor="middle" font-size="22" font-weight="500" fill="#58778e">「赤い帽子」の計算を、二つの仕事に分けて考える</text><rect x="78" y="184" width="1044" height="363" rx="26" fill="#fff" stroke="#b8d4e5" stroke-width="3"/><text x="600" y="241" text-anchor="middle" font-size="42" font-weight="700" fill="#234966">赤い 帽子 を 買った</text><rect x="105" y="314" width="293" height="129" rx="16" fill="#e8f2ff" stroke="#afc9e5" stroke-width="3"/><text x="251.5" y="389.1666666666667" text-anchor="middle" font-size="32" font-weight="700" fill="#28618d">Query・Key</text><rect x="456" y="314" width="293" height="129" rx="16" fill="#f1eeff" stroke="#c4b9e9" stroke-width="3"/><text x="602.5" y="388.5" text-anchor="middle" font-size="30" font-weight="700" fill="#6554a2">重みを計算</text><rect x="807" y="314" width="293" height="129" rx="16" fill="#e8f7ef" stroke="#b2d7c1" stroke-width="3"/><text x="953.5" y="387.1666666666667" text-anchor="middle" font-size="26" font-weight="700" fill="#247e5d">Valueを組み合わせる</text><path d="M404 379 H446" stroke="#648aaa" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M755 379 H797" stroke="#648aaa" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="600" y="510" text-anchor="middle" font-size="26" font-weight="700" fill="#426c88">参考先を調べる　→　情報を実際に取り込む</text><text x="600" y="638" text-anchor="middle" font-size="17" font-weight="500" fill="#788da0">AI Portal｜仕組みを説明する模式図・実際のAttentionの値ではありません</text></g></svg>