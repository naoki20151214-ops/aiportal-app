<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Chunkingとは？ 長い資料を小分けにする</title><desc id="d">かわいいAIロボットが大量の町内会のお知らせを短い資料の束に分け、集合時刻の質問に合う改訂版を探す図。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L11 6 L1 11" stroke="#4e84a9" stroke-width="1.8" fill="none"/></marker><linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset=".47" stop-color="#fefdf7"/><stop offset="1" stop-color="#f0f8f7"/></linearGradient></defs><rect width="1200" height="675" fill="url(#paper)"/><ellipse cx="1021" cy="94" rx="171" ry="129" fill="#e3edff" opacity=".55"/><ellipse cx="123" cy="600" rx="140" ry="100" fill="#fce6d8" opacity=".55"/><g font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif">
<text x="600" y="76" text-anchor="middle" fill="#1d3b5b" font-size="42" font-weight="700">長い資料を小分けにする「Chunking」</text>
<text x="164" y="158" text-anchor="middle" fill="#1d3b5b" font-size="27" font-weight="700">町内会のお知らせ</text><g transform="translate(87,189)"><rect x="0" y="0" width="153" height="220" rx="11" fill="#ffffff" stroke="#bfd2df" stroke-width="3"/><path d="M117 1V37H152" fill="#e7f2ff" stroke="#bfd2df" stroke-width="2"/><path d="M24 47 H130 M24 73 H128 M24 99 H123" stroke="#e7f2ff" stroke-width="10" stroke-linecap="round"/><text x="76.5" y="200" text-anchor="middle" fill="#2c4966" font-size="21" font-weight="700">大量の資料</text></g>
<g transform="translate(109,208)"><rect x="0" y="0" width="153" height="220" rx="11" fill="#ffffff" stroke="#bfd2df" stroke-width="3"/><path d="M117 1V37H152" fill="#e7f2ff" stroke="#bfd2df" stroke-width="2"/><path d="M24 47 H130 M24 73 H128 M24 99 H123" stroke="#e7f2ff" stroke-width="10" stroke-linecap="round"/><text x="76.5" y="200" text-anchor="middle" fill="#2c4966" font-size="21" font-weight="700">40ページ</text></g><g transform="translate(132,226)"><rect x="0" y="0" width="153" height="220" rx="11" fill="#ffffff" stroke="#bfd2df" stroke-width="3"/><path d="M117 1V37H152" fill="#e7f2ff" stroke="#bfd2df" stroke-width="2"/><path d="M24 47 H130 M24 73 H128 M24 99 H123" stroke="#e7f2ff" stroke-width="10" stroke-linecap="round"/><text x="76.5" y="200" text-anchor="middle" fill="#2c4966" font-size="21" font-weight="700">たくさん</text></g>
<path d="M319,322 L444,322" stroke="#4e84a9" stroke-width="5.5" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>
<text x="599" y="158" text-anchor="middle" fill="#1d3b5b" font-size="27" font-weight="700">話題ごとに区切る</text>
<rect x="458" y="210" width="290" height="314" rx="22" fill="#fff5d8" stroke="#bfd2df" stroke-width="3"/>
<rect x="479" y="236" width="250" height="68" rx="22" fill="#ffffff" stroke="#bfd2df" stroke-width="3"/><text x="605" y="279" text-anchor="middle" fill="#1d3b5b" font-size="27" font-weight="700">① 集合時刻</text>
<rect x="479" y="323" width="250" height="68" rx="22" fill="#ffffff" stroke="#bfd2df" stroke-width="3"/><text x="605" y="366" text-anchor="middle" fill="#1d3b5b" font-size="27" font-weight="700">② 持ち物</text>
<rect x="479" y="410" width="250" height="68" rx="22" fill="#ffffff" stroke="#bfd2df" stroke-width="3"/><text x="605" y="453" text-anchor="middle" fill="#1d3b5b" font-size="27" font-weight="700">③ 雨天時</text>
