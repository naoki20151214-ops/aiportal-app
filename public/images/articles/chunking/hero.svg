<text x="1003" y="378" text-anchor="middle" fill="#607b93" font-size="22" font-weight="700">質問に合う</text>
<g transform="translate(929,417) scale(0.78)"><ellipse cx="103" cy="235" rx="98" ry="18" fill="#bad7e4" opacity=".27"/><path d="M48 145 Q24 152 27 186 L43 206 Q107 224 170 205 L185 182 Q187 150 164 145Z" fill="#bcddef" stroke="#2c4966" stroke-width="3.5"/><rect x="10" y="42" width="186" height="132" rx="50" fill="#fffdfa" stroke="#2c4966" stroke-width="4.5"/><rect x="37" y="82" width="132" height="73" rx="25" fill="#e2f1fa"/><ellipse cx="79" cy="116" rx="11" ry="15" fill="#2c4966"/><ellipse cx="128" cy="116" rx="11" ry="15" fill="#2c4966"/><path d="M90 139 Q104 150 117 138" stroke="#2c4966" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M104 41 V18" stroke="#2c4966" stroke-width="4"/><circle cx="104" cy="13" r="11" fill="#f8c9af" stroke="#2c4966" stroke-width="3"/><circle cx="22" cy="159" r="13" fill="#c2e8d4" stroke="#2c4966" stroke-width="2"/><circle cx="183" cy="159" r="13" fill="#c2e8d4" stroke="#2c4966" stroke-width="2"/></g>
<text x="600" y="575" text-anchor="middle" fill="#607b93" font-size="25" font-weight="700">資料を細かくしすぎず、大切な意味を一緒に残そう</text>
<text x="1160" y="651" text-anchor="end" fill="#607b93" font-size="16" font-weight="400">AI Portal｜教育用模式図</text></g></svg>