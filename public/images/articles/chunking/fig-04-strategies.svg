<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Chunkingの代表的な切り方</title><desc id="d">固定長、見出しや段落、意味のまとまり、親子の二段階という四つの代表的な分割方法を比較する模式図。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L11 6 L1 11" stroke="#4e84a9" stroke-width="1.8" fill="none"/></marker><linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset=".47" stop-color="#fefdf7"/><stop offset="1" stop-color="#f0f8f7"/></linearGradient></defs><rect width="1200" height="675" fill="url(#paper)"/><ellipse cx="1021" cy="94" rx="171" ry="129" fill="#e3edff" opacity=".55"/><ellipse cx="123" cy="600" rx="140" ry="100" fill="#fce6d8" opacity=".55"/><g font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif">
