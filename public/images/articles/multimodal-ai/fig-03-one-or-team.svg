ight="700">音声</text><text x="521" y="373.15500000000003" font-size="21" fill="#22425e" text-anchor="middle" font-weight="700">合成</text><rect x="627" y="158" width="523" height="93" rx="25" fill="#e8f7ee" stroke="#bdd3df" stroke-width="2.5"/><text x="888.5" y="213.41" font-size="27" fill="#22425e" text-anchor="middle" font-weight="700">方式B：統合したモデル</text><rect x="685" y="285" width="411" height="165" rx="25" fill="#e9f4ff" stroke="#bdd3df" stroke-width="2.5"/><text x="890.5" y="357.22999999999996" font-size="26" fill="#22425e" text-anchor="middle" font-weight="700">文字・写真・音声など</text><text x="890.5" y="394.93" font-size="26" fill="#22425e" text-anchor="middle" font-weight="700">一つのモデルで関係付ける</text><rect x="209" y="512" width="786" height="70" rx="25" fill="#fff0de" stroke="#bdd3df" stroke-width="2.5"/><text x="602" y="554.92" font-size="24" fill="#22425e" text-anchor="middle" font-weight="700">アプリが一つでも、内部が一つのモデルとは限らない</text><text x="600" y="638" font-size="18" fill="#637c90" text-anchor="middle" font-weight="700">AI Portal｜説明用の模式図。製品の内部構造とは異なります。</text></g></svg>