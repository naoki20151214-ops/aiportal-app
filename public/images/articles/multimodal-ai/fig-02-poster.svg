<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">古い写真を説明し、新しい画像を作る</title><desc id="d">写真を説明する仕事と文章から画像を作る仕事の違いと正式時刻の確認</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" stroke="#759abd" fill="none" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="#f9fcff"/><circle cx="80" cy="616" r="150" fill="#fff4e7"/><circle cx="1141" cy="76" r="146" fill="#eef4ff"/><g font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif"><text x="600" y="79" font-size="38" fill="#22425e" text-anchor="middle" font-weight="700">古い写真を説明し、新しい画像を作る</text><rect x="62" y="164" width="362" height="123" rx="25" fill="#ffede8" stroke="#bdd3df" stroke-width="2.5"/><text x="243" y="214.045" font-size="29" fill="#22425e" text-anchor="middle" font-weight="700">旧ポスター写真</text><text x="243" y="256.095" font-size="29" fill="#22425e" text-anchor="middle" font-weight="700">『集合 9時』</text><path d="M436 224 L509 224" fill="none" stroke="#759abd" stroke-width="5" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="525" y="164" width="614" height="123" rx="25" fill="#e7f3ff" stroke="#bdd3df" stroke-width="2.5"/><text x="832" y="215.23000000000002" font-size="26" fill="#22425e" text-anchor="middle" font-weight="700">写真について説明</text><text x="832" y="252.93" font-size="26" fill="#22425e" text-anchor="middle" font-weight="700">『9時と書いてあります』</text><rect x="62" y="334" width="362" height="120" rx="25" fill="#e4f6eb" stroke="#bdd3df" stroke-width="2.5"/><text x="243" y="383.33500000000004" font-size="27" fill="#22425e" text-anchor="middle" font-weight="700">改訂版の文章</text><text x="243" y="422.485" font-size="27" fill="#22425e" text-anchor="middle" font-weight="700">『集合 10時』</text><path d="M436 395 L509 395" fill="none" stroke="#759abd" stroke-width="5" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="525" y="334" width="614" height="120" rx="25" fill="#fff2df" stroke="#bdd3df" stroke-width="2.5"/><text x="832" y="383.33500000000004" font-size="27" fill="#22425e" text-anchor="middle" font-weight="700">新しいイラストを生成</text><text x="832" y="422.485" font-size="27" fill="#22425e" text-anchor="middle" font-weight="700">文字は人が確認</text><rect x="222" y="516" width="770" height="64" rx="25" fill="#eceafa" stroke="#bdd3df" stroke-width="2.5"/><text x="607" y="556.25" font-size="25" fill="#22425e" text-anchor="middle" font-weight="700">画像を作る仕事と、事実を確認する仕事は別</text><text x="600" y="638" font-size="18" fill="#637c90" text-anchor="middle" font-weight="700">AI Portal｜説明用の模式図。製品の内部構造とは異なります。</text></g></svg>