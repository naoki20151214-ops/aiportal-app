<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">マルチモーダルAIを使う三つの確認</title><desc id="d">入力形式、出力形式、事実と個人情報を確認する三項目</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" stroke="#759abd" fill="none" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="#f9fcff"/><circle cx="80" cy="616" r="150" fill="#fff4e7"/><circle cx="1141" cy="76" r="146" fill="#eef4ff"/><g font-family="'Noto Sans JP',Meiryo,'Yu Gothic',sans-serif"><text x="600" y="79" font-size="38" fill="#22425e" text-anchor="middle" font-weight="700">マルチモーダルAIを使う三つの確認</text><rect x="66" y="176" width="333" height="248" rx="25" fill="#e9f3ff" stroke="#bdd3df" stroke-width="2.5"/><text x="232.5" y="270.88" font-size="26" fill="#22425e" text-anchor="middle" font-weight="700">① 入力を決める</text><text x="232.5" y="308.58" font-size="26" fill="#22425e" text-anchor="middle" font-weight="700">文章？ 写真？</text><text x="232.5" y="346.28" font-size="26" fill="#22425e" text-anchor="middle" font-weight="700">音声？ 動画？</text><rect x="432" y="176" width="333" height="248" rx="25" fill="#e5f6eb" stroke="#bdd3df" stroke-width="2.5"/><text x="598.5" y="270.88" font-size="26" fill="#22425e" text-anchor="middle" font-weight="700">② 出力を選ぶ</text><text x="598.5" y="308.58" font-size="26" fill="#22425e" text-anchor="middle" font-weight="700">説明文？ 画像？</text><text x="598.5" y="346.28" font-size="26" fill="#22425e" text-anchor="middle" font-weight="700">声？ 動画？</text><rect x="798" y="176" width="333" height="248" rx="25" fill="#fff0de" stroke="#bdd3df" stroke-width="2.5"/><text x="964.5" y="270.88" font-size="26" fill="#22425e" text-anchor="middle" font-weight="700">③ 確かめる</text><text x="964.5" y="308.58" font-size="26" fill="#22425e" text-anchor="middle" font-weight="700">日時・数字・出典</text><text x="964.5" y="346.28" font-size="26" fill="#22425e" text-anchor="middle" font-weight="700">個人情報</text><rect x="197" y="492" width="811" height="83" rx="25" fill="#eeebff" stroke="#bdd3df" stroke-width="2.5"/><text x="602.5" y="542.41" font-size="27" fill="#22425e" text-anchor="middle" font-weight="700">便利さだけでなく、正確さと安全性を確認</text><text x="600" y="638" font-size="18" fill="#637c90" text-anchor="middle" font-weight="700">AI Portal｜説明用の模式図。製品の内部構造とは異なります。</text></g></svg>