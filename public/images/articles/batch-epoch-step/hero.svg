<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Batch・Step・Epochの関係</title>
<desc id="desc">1000件のDataを100件ずつ10個のBatchに分け、10 Stepで1 Epochになる流れ</desc>
<rect width="1200" height="675" fill="#f8fcff"/>
<text x="70" y="74" font-size="23" font-weight="700" fill="#2874ba" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">AI Portal｜Training</text>
<text x="70" y="150" font-size="48" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">1000件のDataを、どうやって学ぶ？</text>
<text x="70" y="202" font-size="24" fill="#55758f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Batch → Step → Epoch を、一つの例でつなぐ</text>
<g transform="translate(70 300)">
<rect width="245" height="180" rx="26" fill="#ffffff" stroke="#d5e3ed" stroke-width="3"/>
<text x="122" y="52" text-anchor="middle" font-size="23" font-weight="900" fill="#46718f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Data</text>
<text x="122" y="112" text-anchor="middle" font-size="38" font-weight="900" fill="#255f8c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">1000件</text>
<text x="122" y="150" text-anchor="middle" font-size="19" fill="#6c8190" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">学習用Data全体</text>
</g>
<path d="M335 390 H425" stroke="#7398b0" stroke-width="8"/>
<g transform="translate(445 300)">
<rect width="245" height="180" rx="26" fill="#eaf5ff" stroke="#a9cae3" stroke-width="3"/>
<text x="122" y="52" text-anchor="middle" font-size="23" font-weight="900" fill="#2c6f9c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Batch</text>
<text x="122" y="108" text-anchor="middle" font-size="34" font-weight="900" fill="#255f8c" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">100件 × 10</text>
<text x="122" y="150" text-anchor="middle" font-size="19" fill="#5d7c92" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">少しずつ分ける</text>
</g>
<path d="M710 390 H800" stroke="#7398b0" stroke-width="8"/>
<g transform="translate(820 300)">
<rect width="310" height="180" rx="26" fill="#eaf7f2" stroke="#acd7c6" stroke-width="3"/>
<text x="155" y="50" text-anchor="middle" font-size="23" font-weight="900" fill="#2f765f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">10 Step</text>
<text x="155" y="105" text-anchor="middle" font-size="34" font-weight="900" fill="#2a715b" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">= 1 Epoch</text>
<text x="155" y="150" text-anchor="middle" font-size="19" fill="#61796f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Data全体を1周</text>
</g>
<text x="600" y="592" text-anchor="middle" font-size="25" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">1000件 ÷ Batch Size 100 = 10 Step / Epoch</text>
</svg>