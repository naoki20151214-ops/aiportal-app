<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">10 Stepで1 Epoch</title>
<desc id="desc">10個のBatchを順番に処理して、学習用Data全体を一度使うと1 Epochになる図</desc>
<rect width="1200" height="675" fill="#f8fcff"/>
<text x="600" y="78" text-anchor="middle" font-size="46" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">10 Stepで、Data全体を1周する</text>
<text x="600" y="120" text-anchor="middle" font-size="22" fill="#55758f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">1000件 ÷ Batch Size 100 = 10 Step</text>
<g font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
<line x1="120" y1="325" x2="1080" y2="325" stroke="#9bb9cd" stroke-width="7"/>
<g fill="#ffffff" stroke="#a9cae3" stroke-width="3">
<circle cx="150" cy="325" r="44"/><circle cx="250" cy="325" r="44"/><circle cx="350" cy="325" r="44"/><circle cx="450" cy="325" r="44"/><circle cx="550" cy="325" r="44"/>
<circle cx="650" cy="325" r="44"/><circle cx="750" cy="325" r="44"/><circle cx="850" cy="325" r="44"/><circle cx="950" cy="325" r="44"/><circle cx="1050" cy="325" r="44"/>
</g>
<g text-anchor="middle" font-size="18" font-weight="900" fill="#2f6e9b">
<text x="150" y="332">1</text><text x="250" y="332">2</text><text x="350" y="332">3</text><text x="450" y="332">4</text><text x="550" y="332">5</text>
<text x="650" y="332">6</text><text x="750" y="332">7</text><text x="850" y="332">8</text><text x="950" y="332">9</text><text x="1050" y="332">10</text>
</g>
<text x="150" y="400" text-anchor="middle" font-size="18" fill="#607d91">Step 1</text>
<text x="1050" y="400" text-anchor="middle" font-size="18" fill="#607d91">Step 10</text>
<path d="M1050 440 C1050 550 150 550 150 440" fill="none" stroke="#6ea88f" stroke-width="6"/>
<text x="600" y="510" text-anchor="middle" font-size="27" font-weight="900" fill="#2f765f">学習用Dataを全部使った → 1 Epoch</text>
</g>
</svg>