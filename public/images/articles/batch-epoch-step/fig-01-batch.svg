<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">1000件を10個のBatchへ分ける</title>
<desc id="desc">Batch Size 100として、1000件のDataを100件ずつ10組へ分ける図</desc>
<rect width="1200" height="675" fill="#f8fcff"/>
<text x="600" y="78" text-anchor="middle" font-size="45" font-weight="900" fill="#082c63" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">1000件を、100件ずつに分ける</text>
<text x="600" y="120" text-anchor="middle" font-size="22" fill="#55758f" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Batch Size = 100</text>
<g font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
<rect x="95" y="185" width="1010" height="320" rx="30" fill="#ffffff" stroke="#d5e3ed" stroke-width="3"/>
<text x="135" y="235" font-size="22" font-weight="800" fill="#52748b">学習用Data 1000件</text>
<g fill="#eaf5ff" stroke="#a9cae3" stroke-width="2">
<rect x="135" y="280" width="160" height="82" rx="18"/><rect x="315" y="280" width="160" height="82" rx="18"/>
<rect x="495" y="280" width="160" height="82" rx="18"/><rect x="675" y="280" width="160" height="82" rx="18"/>
<rect x="855" y="280" width="160" height="82" rx="18"/><rect x="135" y="385" width="160" height="82" rx="18"/>
<rect x="315" y="385" width="160" height="82" rx="18"/><rect x="495" y="385" width="160" height="82" rx="18"/>
<rect x="675" y="385" width="160" height="82" rx="18"/><rect x="855" y="385" width="160" height="82" rx="18"/>
</g>
<g font-size="20" font-weight="900" fill="#2f6e9b" text-anchor="middle">
<text x="215" y="330">Batch 1</text><text x="395" y="330">Batch 2</text><text x="575" y="330">Batch 3</text><text x="755" y="330">Batch 4</text><text x="935" y="330">Batch 5</text>
<text x="215" y="435">Batch 6</text><text x="395" y="435">Batch 7</text><text x="575" y="435">Batch 8</text><text x="755" y="435">Batch 9</text><text x="935" y="435">Batch 10</text>
</g>
<g font-size="16" fill="#638198" text-anchor="middle">
<text x="215" y="353">100件</text><text x="395" y="353">100件</text><text x="575" y="353">100件</text><text x="755" y="353">100件</text><text x="935" y="353">100件</text>
<text x="215" y="458">100件</text><text x="395" y="458">100件</text><text x="575" y="458">100件</text><text x="755" y="458">100件</text><text x="935" y="458">100件</text>
</g>
</g>
<text x="600" y="590" text-anchor="middle" font-size="24" font-weight="800" fill="#355f87" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">Batch = Dataのまとまり　／　Batch Size = 1まとまりの件数</text>
</svg>