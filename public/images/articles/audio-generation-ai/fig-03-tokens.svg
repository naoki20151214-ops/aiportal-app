<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">音の情報を小さく表す</title><desc id="d">音の信号を扱いやすい数値の並びにし、AIが新しい音の並びを作る概念図</desc><rect width="1200" height="675" fill="#fafdff"/><g font-family="sans-serif" font-weight="bold" text-anchor="middle"><text x="600" y="85" font-size="39" fill="#23466b">音を数字の並びとして扱う</text><rect x="95" y="168" width="1010" height="96" rx="22" fill="#e5f4ff"/><text x="600" y="225" font-size="28" fill="#23466b">① 録音を小さな単位にまとめる</text><rect x="95" y="290" width="1010" height="96" rx="22" fill="#eeebff"/><text x="600" y="349" font-size="28" fill="#23466b">② AIが音の並びを作る</text><rect x="95" y="412" width="1010" height="96" rx="22" fill="#e7f7ef"/><text x="600" y="470" font-size="28" fill="#23466b">③ 再生できる音の情報へ戻す</text><text x="600" y="619" font-size="19" fill="#607e94">AI Portal・説明用の模式図</text></g></svg>