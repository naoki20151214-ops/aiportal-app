<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">声も数字で表せる</title><desc id="d">声も数字で表せる。空気の振動が音になる。時間とともに波が変わる。記録した値が音のデータ</desc><rect width="1200" height="675" fill="#fbfdff"/><g font-family="sans-serif"><text x="600" y="93" font-size="39" fill="#21466b" font-weight="700" text-anchor="middle">声も数字で表せる</text><rect x="135" y="180" width="930" height="96" rx="24" fill="#e8f4ff" stroke="#c2d5e4" stroke-width="3"/><text x="600" y="239" font-size="31" fill="#20476c" font-weight="700" text-anchor="middle">空気の振動が音になる</text><rect x="135" y="299" width="930" height="96" rx="24" fill="#e5f7ec" stroke="#c2d5e4" stroke-width="3"/><text x="600" y="358" font-size="31" fill="#20476c" font-weight="700" text-anchor="middle">時間とともに波が変わる</text><rect x="135" y="418" width="930" height="96" rx="24" fill="#e8f4ff" stroke="#c2d5e4" stroke-width="3"/><text x="600" y="477" font-size="31" fill="#20476c" font-weight="700" text-anchor="middle">記録した値が音のデータ</text><text x="600" y="633" font-size="19" fill="#67839c" text-anchor="middle">AI Portal・説明用の模式図</text></g></svg>