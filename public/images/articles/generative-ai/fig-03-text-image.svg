<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">生成方法は一つではない</title><desc id="desc">文章は次のTokenの予測、画像はノイズを整える方法など、生成方法が異なる例。</desc><defs><linearGradient id="back" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0f9f4"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6090b7" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#back)"/><g font-family="'Noto Sans JP',-apple-system,BlinkMacSystemFont,Meiryo,sans-serif"><text x="600" y="80" text-anchor="middle" font-size="40" font-weight="700" fill="#193d63">生成方法は一つではない</text><text x="600" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#608096">文章と画像は同じ手順とは限らない</text><rect x="74" y="183" width="497" height="362" rx="20" stroke="#b6cee3" stroke-width="3" fill="#e9f4ff"/><text x="322" y="242" text-anchor="middle" font-size="31" font-weight="700" fill="#25506e">文章生成の一例</text><rect x="126" y="301" width="393" height="105" rx="20" stroke="#c6dbe8" stroke-width="3" fill="#fff"/><text x="321" y="343" text-anchor="middle" font-size="24" font-weight="700" fill="#25506e">前の文章を使って</text><text x="321" y="383" text-anchor="middle" font-size="25" font-weight="700" fill="#25506e">次のTokenを計算</text><text x="321" y="486" text-anchor="middle" font-size="22" font-weight="700" fill="#52758f">少しずつ文章を長くする</text><rect x="629" y="183" width="497" height="362" rx="20" stroke="#b1d6c0" stroke-width="3" fill="#e9f7ef"/><text x="876" y="242" text-anchor="middle" font-size="31" font-weight="700" fill="#267956">画像生成の一例</text><rect x="680" y="300" width="399" height="105" rx="20" stroke="#c5decf" stroke-width="3" fill="#fff"/><text x="881" y="343" text-anchor="middle" font-size="24" font-weight="700" fill="#25506e">ノイズを加工して</text><text x="881" y="383" text-anchor="middle" font-size="25" font-weight="700" fill="#25506e">画像へ近づける</text><text x="879" y="486" text-anchor="middle" font-size="22" font-weight="700" fill="#4d8169">拡散モデルなどの方法</text><text x="600" y="594" text-anchor="middle" font-size="24" font-weight="700" fill="#25506e">どちらも学習済みの仕組みを利用する</text><text x="600" y="642" text-anchor="middle" font-size="16" font-weight="700" fill="#8297a5">AI Portal｜説明用の模式図（実際のモデル内部を再現したものではありません）</text></g></svg>