<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">見分ける仕事と、作る仕事</title><desc id="desc">左はメールを迷惑か通常かに分類し、右は条件から案内文を生成する。</desc><defs><linearGradient id="back" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0f9f4"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6090b7" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#back)"/><g font-family="'Noto Sans JP',-apple-system,BlinkMacSystemFont,Meiryo,sans-serif"><text x="600" y="80" text-anchor="middle" font-size="40" font-weight="700" fill="#193d63">見分ける仕事と、作る仕事</text><text x="600" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#608096">代表的なAIの使い方を比べてみよう</text><rect x="68" y="185" width="502" height="357" rx="20" stroke="#afcce4" stroke-width="3" fill="#e8f3ff"/><text x="320" y="248" text-anchor="middle" font-size="31" font-weight="700" fill="#25506e">分類・予測の例</text><rect x="129" y="306" width="380" height="100" rx="20" stroke="#bed6e7" stroke-width="3" fill="#fff"/><text x="318" y="369" text-anchor="middle" font-size="29" font-weight="700" fill="#25506e">届いたメール</text><path d="M319 418 V460" stroke="#6090b7" stroke-width="6" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><text x="318" y="505" text-anchor="middle" font-size="27" font-weight="700" fill="#275f8d">迷惑 ／ 通常</text><rect x="632" y="185" width="502" height="357" rx="20" stroke="#a9d7be" stroke-width="3" fill="#e9f8ef"/><text x="883" y="248" text-anchor="middle" font-size="31" font-weight="700" fill="#267956">生成の例</text><rect x="690" y="306" width="385" height="100" rx="20" stroke="#badcc9" stroke-width="3" fill="#fff"/><text x="882" y="369" text-anchor="middle" font-size="26" font-weight="700" fill="#25506e">日時・場所・持ち物</text><path d="M883 418 V460" stroke="#6090b7" stroke-width="6" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><text x="883" y="505" text-anchor="middle" font-size="28" font-weight="700" fill="#267956">案内文を作る</text><text x="600" y="592" text-anchor="middle" font-size="22" font-weight="700" fill="#25506e">実際のAIでは、両方の仕事を組み合わせることもある</text><text x="600" y="642" text-anchor="middle" font-size="16" font-weight="700" fill="#8297a5">AI Portal｜説明用の模式図（実際のモデル内部を再現したものではありません）</text></g></svg>