<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">文章は少しずつ長くなる</title><desc id="desc">文章の短い断片から単位を一つずつ予測し、文章の続きを作る概念図。</desc><defs><linearGradient id="back" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0f9f4"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6090b7" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#back)"/><g font-family="'Noto Sans JP',-apple-system,BlinkMacSystemFont,Meiryo,sans-serif"><text x="600" y="80" text-anchor="middle" font-size="40" font-weight="700" fill="#193d63">文章は少しずつ長くなる</text><text x="600" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#608096">続きを計算して、次のTokenへ進む</text><rect x="62" y="195" width="1069" height="336" rx="20" stroke="#b9d6e8" stroke-width="3" fill="#fff"/><text x="600" y="252" text-anchor="middle" font-size="28" font-weight="700" fill="#25506e">最初の文章</text><rect x="130" y="293" width="357" height="107" rx="20" stroke="#aed0e8" stroke-width="3" fill="#e9f3ff"/><text x="306" y="354" text-anchor="middle" font-size="26" font-weight="700" fill="#25506e">日曜日の朝、公園で</text><path d="M503 347 H576" stroke="#6090b7" stroke-width="6" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="590" y="293" width="411" height="107" rx="20" stroke="#add4bf" stroke-width="3" fill="#e9f7ef"/><text x="795" y="352" text-anchor="middle" font-size="29" font-weight="700" fill="#24795d">清掃活動を</text><text x="600" y="469" text-anchor="middle" font-size="25" font-weight="700" fill="#466f89">さらに次の単位を計算して、文章を伸ばしていく</text><text x="600" y="589" text-anchor="middle" font-size="21" font-weight="700" fill="#25506e">Tokenは一文字・一単語に固定されているわけではない</text><text x="600" y="642" text-anchor="middle" font-size="16" font-weight="700" fill="#8297a5">AI Portal｜説明用の模式図（実際のモデル内部を再現したものではありません）</text></g></svg>