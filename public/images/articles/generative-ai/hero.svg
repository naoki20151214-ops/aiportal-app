<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">生成AIは、文章そのものを作る</title><desc id="desc">イベントの条件が書かれたメモをAIへ渡すと、読みやすい案内文になる場面。</desc><defs><linearGradient id="back" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f0f9f4"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6090b7" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#back)"/><g font-family="'Noto Sans JP',-apple-system,BlinkMacSystemFont,Meiryo,sans-serif"><text x="600" y="80" text-anchor="middle" font-size="40" font-weight="700" fill="#193d63">生成AIは、文章そのものを作る</text><text x="600" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#608096">町内会の案内文を作る例</text><rect x="62" y="185" width="482" height="344" rx="20" stroke="#b9d4e6" stroke-width="3" fill="#ffffff"/><text x="303" y="240" text-anchor="middle" font-size="29" font-weight="700" fill="#25506e">人が伝える条件</text><rect x="104" y="275" width="400" height="186" rx="20" stroke="#e1c7a4" stroke-width="3" fill="#fff3e5"/><text x="304" y="331" text-anchor="middle" font-size="28" font-weight="700" fill="#856646">日曜日 午前9時</text><text x="304" y="389" text-anchor="middle" font-size="27" font-weight="700" fill="#856646">公園・ごみ拾い</text><text x="304" y="440" text-anchor="middle" font-size="24" font-weight="700" fill="#856646">軍手と飲み物</text><path d="M554 350 H640" stroke="#6090b7" stroke-width="6" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="655" y="185" width="482" height="344" rx="20" stroke="#b9d4e6" stroke-width="3" fill="#ffffff"/><text x="897" y="240" text-anchor="middle" font-size="28" font-weight="700" fill="#25506e">生成AIが作る案内文</text><rect x="692" y="273" width="413" height="199" rx="20" stroke="#a6d5bb" stroke-width="3" fill="#e8f7ee"/><text x="898" y="328" text-anchor="middle" font-size="27" font-weight="700" fill="#297355">日曜日の朝、</text><text x="898" y="380" text-anchor="middle" font-size="27" font-weight="700" fill="#297355">公園で清掃活動を</text><text x="898" y="431" text-anchor="middle" font-size="28" font-weight="700" fill="#297355">行います！</text><text x="600" y="585" text-anchor="middle" font-size="24" font-weight="700" fill="#25506e">条件を参考に、文章を組み立てて出力する</text><text x="600" y="642" text-anchor="middle" font-size="16" font-weight="700" fill="#8297a5">AI Portal｜説明用の模式図（実際のモデル内部を再現したものではありません）</text></g></svg>