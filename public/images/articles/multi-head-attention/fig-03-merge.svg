<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">複数の結果を一つにつなぐ</title><desc id="d">各Headのベクトルを横に並べ、学習済みの変換を行って次の処理へ渡す</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f1f9f5"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#5989b0" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="75" text-anchor="middle" font-size="39" font-weight="700" fill="#193b60">複数の結果を一つにつなぐ</text><rect x="88" y="182" width="302" height="154" rx="23" fill="#e9f2ff" stroke="#afcbe9" stroke-width="3"/><text x="239" y="242" text-anchor="middle" font-size="29" font-weight="700" fill="#244868">Head Aの出力</text><text x="239" y="295" text-anchor="middle" font-size="22" font-weight="700" fill="#244868">数値の並び A</text><rect x="810" y="182" width="302" height="154" rx="23" fill="#e9f6ee" stroke="#afd3bd" stroke-width="3"/><text x="961" y="242" text-anchor="middle" font-size="29" font-weight="700" fill="#244868">Head Bの出力</text><text x="961" y="295" text-anchor="middle" font-size="22" font-weight="700" fill="#244868">数値の並び B</text><path d="M241 349 Q318 445 490 454" fill="none" stroke="#5989b0" stroke-width="7" stroke-linecap="round" marker-end="url(#a)"/><path d="M960 349 Q887 445 717 454" fill="none" stroke="#5989b0" stroke-width="7" stroke-linecap="round" marker-end="url(#a)"/><rect x="442" y="430" width="319" height="85" rx="23" fill="#f5f2ff" stroke="#c6bbe3" stroke-width="3"/><text x="600" y="486" text-anchor="middle" font-size="27" font-weight="700" fill="#244868">結果を並べて結合</text><path d="M600 521 V561" fill="none" stroke="#5989b0" stroke-width="7" stroke-linecap="round" marker-end="url(#a)"/><text x="600" y="608" text-anchor="middle" font-size="24" font-weight="700" fill="#536f89">さらに変換して次へ渡す</text><text x="600" y="633" text-anchor="middle" font-size="18" font-weight="700" fill="#718ba1">AI Portal｜仕組みを説明する模式図。各Headの役割は固定されません。</text></g></svg>