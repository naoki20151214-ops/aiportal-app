<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">一つのAttentionも、複数を参照できる</title><desc id="d">一つの計算で複数の位置へ重みを付ける。それを複数のHeadが別々に行う。</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f1f9f5"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#5989b0" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="75" text-anchor="middle" font-size="39" font-weight="700" fill="#193b60">一つのAttentionも、複数を参照できる</text><rect x="80" y="155" width="1040" height="394" rx="23" fill="#ffffff" stroke="#b9d5e4" stroke-width="3"/><text x="600" y="219" text-anchor="middle" font-size="30" font-weight="700" fill="#244868">一つのHeadだけでも</text><rect x="157" y="268" width="245" height="116" rx="23" fill="#fcebe6" stroke="#e7b6ab" stroke-width="3"/><text x="280" y="334" text-anchor="middle" font-size="27" font-weight="700" fill="#a94e49">赤いの位置</text><rect x="482" y="268" width="245" height="116" rx="23" fill="#e9f4ff" stroke="#a5c6e2" stroke-width="3"/><text x="604" y="334" text-anchor="middle" font-size="25" font-weight="700" fill="#275f8d">小さなの位置</text><rect x="810" y="268" width="245" height="116" rx="23" fill="#e5f5eb" stroke="#a3d2b7" stroke-width="3"/><text x="934" y="334" text-anchor="middle" font-size="27" font-weight="700" fill="#267454">帽子の位置</text><path d="M280 401 Q604 526 928 406" fill="none" stroke="#5989b0" stroke-width="7" stroke-linecap="round" marker-end="url(#a)"/><path d="M603 399 Q763 472 928 406" fill="none" stroke="#5989b0" stroke-width="7" stroke-linecap="round" marker-end="url(#a)"/><text x="600" y="518" text-anchor="middle" font-size="23" font-weight="700" fill="#476f86">複数の情報を重みに応じて組み合わせられる</text><text x="600" y="633" text-anchor="middle" font-size="18" font-weight="700" fill="#718ba1">AI Portal｜仕組みを説明する模式図。各Headの役割は固定されません。</text></g></svg>