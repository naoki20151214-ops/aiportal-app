<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">なぜAttentionを複数使うの？</title><desc id="d">赤くて小さな帽子の例で、異なるAttention計算をまとめる概念図</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f1f9f5"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#5989b0" stroke-width="1.5" fill="none"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',Meiryo,sans-serif"><text x="600" y="75" text-anchor="middle" font-size="39" font-weight="700" fill="#193b60">なぜAttentionを複数使うの？</text><text x="600" y="143" text-anchor="middle" font-size="31" font-weight="700" fill="#244868">赤くて小さな帽子を買った。</text><rect x="102" y="210" width="996" height="345" rx="23" fill="#ffffff" stroke="#b9d5e4" stroke-width="3"/><rect x="143" y="271" width="241" height="132" rx="23" fill="#e7f2ff" stroke="#a4cae7" stroke-width="3"/><text x="263" y="337" text-anchor="middle" font-size="32" font-weight="700" fill="#244868">Head A</text><text x="263" y="372" text-anchor="middle" font-size="24" font-weight="700" fill="#244868">数値の計算①</text><rect x="476" y="271" width="241" height="132" rx="23" fill="#f0ebff" stroke="#c3b8e6" stroke-width="3"/><text x="597" y="337" text-anchor="middle" font-size="32" font-weight="700" fill="#244868">Head B</text><text x="597" y="372" text-anchor="middle" font-size="24" font-weight="700" fill="#244868">数値の計算②</text><rect x="810" y="271" width="241" height="132" rx="23" fill="#e7f7ef" stroke="#a7d1b9" stroke-width="3"/><text x="930" y="337" text-anchor="middle" font-size="32" font-weight="700" fill="#244868">Head C</text><text x="930" y="372" text-anchor="middle" font-size="24" font-weight="700" fill="#244868">数値の計算③</text><path d="M265 412 Q416 535 590 460" fill="none" stroke="#5989b0" stroke-width="7" stroke-linecap="round" marker-end="url(#a)"/><path d="M596 412 V458" fill="none" stroke="#5989b0" stroke-width="7" stroke-linecap="round" marker-end="url(#a)"/><path d="M930 412 Q769 535 608 460" fill="none" stroke="#5989b0" stroke-width="7" stroke-linecap="round" marker-end="url(#a)"/><text x="600" y="523" text-anchor="middle" font-size="29" font-weight="700" fill="#347366">複数の計算結果をまとめて利用する</text><text x="600" y="633" text-anchor="middle" font-size="18" font-weight="700" fill="#718ba1">AI Portal｜仕組みを説明する模式図。各Headの役割は固定されません。</text></g></svg>