<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">LLMとサービスは別のもの</title><desc id="desc">LLMという内部モデルと、画面や会話履歴や検索などの周辺機能を持つサービスを区別する。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#f0f9f3"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#638eaf" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',-apple-system,BlinkMacSystemFont,Meiryo,sans-serif"><text x="600" y="80" font-size="40" fill="#173e60" font-weight="700" text-anchor="middle">LLMとサービスは別のもの</text><text x="600" y="123" font-size="21" fill="#5e8095" font-weight="700" text-anchor="middle">文章を生成するモデルと、周囲の便利な仕組み</text><rect x="71" y="187" width="1057" height="369" rx="20" fill="#fff" stroke="#bbd5e3" stroke-width="3"/><text x="600" y="245" font-size="30" fill="#254966" font-weight="700" text-anchor="middle">会話サービス（利用者が触れるもの）</text><rect x="121" y="303" width="207" height="162" rx="20" fill="#e8f3ff" stroke="#b3cce6" stroke-width="3"/><text x="224" y="360" font-size="30" fill="#254966" font-weight="700" text-anchor="middle">画面</text><text x="224" y="412" font-size="23" fill="#254966" font-weight="700" text-anchor="middle">入力・表示</text><rect x="370" y="288" width="456" height="193" rx="20" fill="#e7f8ef" stroke="#acd3bf" stroke-width="3"/><text x="597" y="355" font-size="31" fill="#287958" font-weight="700" text-anchor="middle">LLM（言語モデル）</text><text x="597" y="415" font-size="25" fill="#287958" font-weight="700" text-anchor="middle">文章を処理・生成</text><rect x="869" y="303" width="207" height="162" rx="20" fill="#f3efff" stroke="#ccc1e6" stroke-width="3"/><text x="972" y="359" font-size="27" fill="#655aa0" font-weight="700" text-anchor="middle">周辺機能</text><text x="972" y="411" font-size="21" fill="#655aa0" font-weight="700" text-anchor="middle">履歴・検索など</text><text x="600" y="604" font-size="22" fill="#557c92" font-weight="700" text-anchor="middle">どの機能を利用できるかはサービスによって異なる</text><text x="600" y="643" font-size="16" fill="#8294a5" font-weight="700" text-anchor="middle">AI Portal｜理解用の模式図。モデルの内部数値や能力を表す図ではありません。</text></g></svg>