<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">会話できるまでの三段階</title><desc id="desc">事前学習、対話用の追加学習、ユーザーからの指示に沿った回答の3段階を比較する。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#f0f9f3"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#638eaf" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',-apple-system,BlinkMacSystemFont,Meiryo,sans-serif"><text x="600" y="80" font-size="40" fill="#173e60" font-weight="700" text-anchor="middle">会話できるまでの三段階</text><text x="600" y="123" font-size="21" fill="#5e8095" font-weight="700" text-anchor="middle">事前学習 → 指示に応じる調整 → 実際の会話</text><rect x="62" y="188" width="321" height="323" rx="20" fill="#eaf3ff" stroke="#b8d1e6" stroke-width="3"/><text x="221" y="248" font-size="28" fill="#254966" font-weight="700" text-anchor="middle">① 事前学習</text><text x="221" y="324" font-size="25" fill="#254966" font-weight="700" text-anchor="middle">文章の関係を</text><text x="221" y="371" font-size="25" fill="#254966" font-weight="700" text-anchor="middle">幅広く学ぶ</text><rect x="439" y="188" width="321" height="323" rx="20" fill="#f5efff" stroke="#c9bee4" stroke-width="3"/><text x="600" y="248" font-size="26" fill="#675ba0" font-weight="700" text-anchor="middle">② 対話向けに調整</text><text x="600" y="324" font-size="25" fill="#675ba0" font-weight="700" text-anchor="middle">指示への応答を</text><text x="600" y="371" font-size="25" fill="#675ba0" font-weight="700" text-anchor="middle">練習する</text><rect x="816" y="188" width="321" height="323" rx="20" fill="#e9f8ef" stroke="#b3d9c2" stroke-width="3"/><text x="975" y="248" font-size="27" fill="#28785a" font-weight="700" text-anchor="middle">③ 実際に使う</text><text x="975" y="324" font-size="25" fill="#28785a" font-weight="700" text-anchor="middle">今のお願いに</text><text x="975" y="371" font-size="25" fill="#28785a" font-weight="700" text-anchor="middle">答えを作る</text><path d="M390 350 H431" stroke="#638eaf" stroke-width="7" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><path d="M765 350 H808" stroke="#638eaf" stroke-width="7" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><text x="600" y="582" font-size="21" fill="#5d7a91" font-weight="700" text-anchor="middle">通常の会話中にモデルを毎回再学習するわけではない</text><text x="600" y="643" font-size="16" fill="#8294a5" font-weight="700" text-anchor="middle">AI Portal｜理解用の模式図。モデルの内部数値や能力を表す図ではありません。</text></g></svg>