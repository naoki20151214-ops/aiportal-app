"858" cy="311" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><circle cx="924" cy="311" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><circle cx="990" cy="311" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><circle cx="1056" cy="311" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><circle cx="726" cy="373" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><circle cx="792" cy="373" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><circle cx="858" cy="373" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><circle cx="924" cy="373" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><circle cx="990" cy="373" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><circle cx="1056" cy="373" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><circle cx="726" cy="435" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><circle cx="792" cy="435" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><circle cx="858" cy="435" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><circle cx="924" cy="435" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><circle cx="990" cy="435" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><circle cx="1056" cy="435" r="20" fill="#b3e1c8" stroke="#81bba1" stroke-width="3"/><text x="600" y="588" font-size="21" fill="#617b92" font-weight="700" text-anchor="middle">モデル・データ・計算の規模が大きい。正確さは別問題。</text><text x="600" y="643" font-size="16" fill="#8294a5" font-weight="700" text-anchor="middle">AI Portal｜理解用の模式図。モデルの内部数値や能力を表す図ではありません。</text></g></svg>