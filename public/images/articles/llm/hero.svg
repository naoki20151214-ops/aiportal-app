<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">LLMが文章をやさしく言い換える</title><desc id="desc">硬い町内会の清掃案内を、LLMを使い小学3年生にも読める表現へ言い換える例。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#f0f9f3"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#638eaf" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="'Noto Sans JP',-apple-system,BlinkMacSystemFont,Meiryo,sans-serif"><text x="600" y="80" font-size="40" fill="#173e60" font-weight="700" text-anchor="middle">LLMが文章をやさしく言い換える</text><text x="600" y="123" font-size="21" fill="#5e8095" font-weight="700" text-anchor="middle">同じ事実を、小学生にも伝わる文章へ</text><rect x="66" y="189" width="481" height="341" rx="20" fill="#fff" stroke="#b2cce2" stroke-width="3"/><text x="307" y="248" font-size="30" fill="#254966" font-weight="700" text-anchor="middle">もとの案内文</text><rect x="100" y="290" width="413" height="158" rx="20" fill="#fff1e4" stroke="#e0c7aa" stroke-width="3"/><text x="307" y="341" font-size="27" fill="#83674e" font-weight="700" text-anchor="middle">清掃活動を</text><text x="307" y="394" font-size="27" fill="#83674e" font-weight="700" text-anchor="middle">実施します</text><rect x="658" y="189" width="473" height="341" rx="20" fill="#fff" stroke="#abd5be" stroke-width="3"/><text x="895" y="248" font-size="30" fill="#287b5a" font-weight="700" text-anchor="middle">小学生向け</text><rect x="698" y="290" width="392" height="158" rx="20" fill="#e6f7ef" stroke="#acdac3" stroke-width="3"/><text x="895" y="341" font-size="27" fill="#287b5a" font-weight="700" text-anchor="middle">公園を</text><text x="895" y="394" font-size="27" fill="#287b5a" font-weight="700" text-anchor="middle">そうじします</text><path d="M558 355 H643" stroke="#638eaf" stroke-width="7" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><text x="600" y="582" font-size="24" fill="#254966" font-weight="700" text-anchor="middle">同じ日時・持ち物を、分かりやすい表現で伝える</text><text x="600" y="643" font-size="16" fill="#8294a5" font-weight="700" text-anchor="middle">AI Portal｜理解用の模式図。モデルの内部数値や能力を表す図ではありません。</text></g></svg>