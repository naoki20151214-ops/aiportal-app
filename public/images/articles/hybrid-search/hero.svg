<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Hybrid Searchは二つの探し方</title><desc id="d">文字で探す方法と意味で探す方法を組み合わせて町内会の資料を見つける</desc><rect width="1200" height="675" fill="#f9fcff"/><g font-family="sans-serif" text-anchor="middle" fill="#24425d" font-weight="bold"><text x="600" y="75" font-size="37">Hybrid Searchは二つの探し方</text><rect x="80" y="163" width="444" height="150" rx="25" fill="#e4f2ff"/><rect x="80" y="341" width="444" height="150" rx="25" fill="#efeaff"/><rect x="668" y="220" width="453" height="220" rx="25" fill="#e4f6ed"/><text x="301" y="222" font-size="30">文字で探す</text><text x="301" y="265" font-size="27">清掃・A-204</text><text x="301" y="403" font-size="30">意味で探す</text><text x="301" y="446" font-size="27">そうじ・清掃活動</text><text x="891" y="301" font-size="31">二つの候補を</text><text x="891" y="352" font-size="31">まとめて探す</text><text x="600" y="564" font-size="25">近い資料を見つけても正式な版の確認は必要</text><text x="600" y="635" font-size="17">AI Portal｜説明用の模式図</text></g></svg>