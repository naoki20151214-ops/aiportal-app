<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">二つの検索の道</title><desc id="d">キーワード検索はA-204や清掃の文字を探し、ベクトル検索はそうじに意味が近い資料を探す</desc><rect width="1200" height="675" fill="#fafdff"/><g font-family="sans-serif"><text x="600" y="85" font-size="38" font-weight="700" text-anchor="middle" fill="#24425d">二つの検索の道</text><rect x="140" y="154" width="920" height="62" rx="18" fill="#e5f3ff" stroke="#bfd3e1" stroke-width="2"/><text x="600" y="194" font-size="27" text-anchor="middle" fill="#24425d" font-weight="700">キーワード検索</text><rect x="140" y="231" width="920" height="62" rx="18" fill="#f0ecff" stroke="#bfd3e1" stroke-width="2"/><text x="600" y="271" font-size="27" text-anchor="middle" fill="#24425d" font-weight="700">A-204・清掃</text><rect x="140" y="308" width="920" height="62" rx="18" fill="#e5f3ff" stroke="#bfd3e1" stroke-width="2"/><text x="600" y="348" font-size="27" text-anchor="middle" fill="#24425d" font-weight="700">ベクトル検索</text><rect x="140" y="385" width="920" height="62" rx="18" fill="#f0ecff" stroke="#bfd3e1" stroke-width="2"/><text x="600" y="425" font-size="27" text-anchor="middle" fill="#24425d" font-weight="700">そうじ・清掃活動</text><rect x="140" y="462" width="920" height="62" rx="18" fill="#e4f6ed" stroke="#bfd3e1" stroke-width="2"/><text x="600" y="502" font-size="27" text-anchor="middle" fill="#24425d" font-weight="700">両方の結果を合わせる</text><text x="600" y="628" font-size="18" text-anchor="middle" fill="#65798b">AI Portal｜架空の模式図</text></g></svg>