<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">検索順位と正式な版は別</title><desc id="d">旧版9時と改訂版10時のどちらが有効かを調べる図</desc><rect width="1200" height="675" fill="#fafdff"/><g font-family="sans-serif"><text x="600" y="85" font-size="38" font-weight="700" text-anchor="middle" fill="#24425d">検索順位と正式な版は別</text><rect x="140" y="154" width="920" height="62" rx="18" fill="#e5f3ff" stroke="#bfd3e1" stroke-width="2"/><text x="600" y="194" font-size="27" text-anchor="middle" fill="#24425d" font-weight="700">旧版：午前9時</text><rect x="140" y="231" width="920" height="62" rx="18" fill="#f0ecff" stroke="#bfd3e1" stroke-width="2"/><text x="600" y="271" font-size="27" text-anchor="middle" fill="#24425d" font-weight="700">有効=false</text><rect x="140" y="308" width="920" height="62" rx="18" fill="#e5f3ff" stroke="#bfd3e1" stroke-width="2"/><text x="600" y="348" font-size="27" text-anchor="middle" fill="#24425d" font-weight="700">改訂版：午前10時</text><rect x="140" y="385" width="920" height="62" rx="18" fill="#f0ecff" stroke="#bfd3e1" stroke-width="2"/><text x="600" y="425" font-size="27" text-anchor="middle" fill="#24425d" font-weight="700">有効=true</text><rect x="140" y="462" width="920" height="62" rx="18" fill="#e4f6ed" stroke="#bfd3e1" stroke-width="2"/><text x="600" y="502" font-size="27" text-anchor="middle" fill="#24425d" font-weight="700">版・出典・権限を確認</text><text x="600" y="628" font-size="18" text-anchor="middle" fill="#65798b">AI Portal｜架空の模式図</text></g></svg>