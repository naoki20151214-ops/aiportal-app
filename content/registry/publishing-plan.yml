schemaVersion: 1
timezone: "Asia/Tokyo"

automation:
  enabled: true
  strategy: "editorial-approval-event"
  note: "本人の合格、または証拠付き委譲編集監査の承認記録をmainへ反映したとき、検証の後に公開。未承認readyは対象外"

candidateCadence:
  maxPerDay: 10
  spacingMinutes: 60
  localTimes:
    - "08:00"
    - "09:00"
    - "10:00"
    - "11:00"
    - "12:00"
    - "13:00"
    - "14:00"
    - "15:00"
    - "16:00"
    - "17:00"

releasePrinciples:
  - "SEO目的だけで公開間隔を分けない"
  - "基礎ノードを先に公開し、その上に応用ノードを積む"
  - "prerequisitesが公開済みのノードを優先する"
  - "同一テーマの薄い記事を大量公開しない"
  - "公開後に内部リンクと404を自動検証する"
  - "ニュースは時刻優先、エバーグリーンは知識依存順を優先する"

qualityGate:
  required:
    - "Center Questionに回答している"
    - "必要な前提知識への導線がある"
    - "重要な事実の一次情報を確認している"
    - "重複記事がない"
    - "内部参照IDがすべて存在する"
    - "公開済みリンクに404がない"
  wordCountRule: "固定しない"

coreCurriculum:
  file: "core-curriculum.yml"
  targetArticleCount: 100
  batchCount: 10
  articlesPerBatch: 10
  ordering: "dependency-first"
  autoSchedule: false
  note: "Core Curriculumの100記事は制作順。合格が記録され、安全ゲートが通れば別途の公開時刻承認なしで直ちに公開する"
  unpublishedLinkPolicy: "URLリンクを生成せず、必要時のみ準備中として非リンク表示する"
  releaseGate: "readyかつapproved-for-publication記録を持つノード（またはauthorized scheduled）だけを公開対象にする。本人合格と証拠付き編集監査を区別する"
