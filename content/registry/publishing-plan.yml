schemaVersion: 1
timezone: "Asia/Tokyo"

automation:
  enabled: true
  strategy: "daily-date-gated-approved-queue"
  note: "本人合格または委譲編集監査で承認されたready記事だけを、承認台帳のpublishOn以降、毎日20:00 JSTの予約キューから1日最大1本公開。承認PRのmainマージでは即時公開しない"

candidateCadence:
  maxPerDay: 1
  spacingMinutes: 1440
  localTimes:
    - "20:00"
  scheduleTimezone: "Asia/Tokyo"
  startPolicy: "記事個別publishOn日以降。先行記事公開、リンクと出典、全品質ゲートの成立を必須とする。GitHub cronは遅延する場合がある"
  timeSlotPolicy: "1日の枠が埋まった場合は次の日以降へ繰り越す。日付を過ぎても自動でまとめて公開しない"

releasePrinciples:
  - "SEO目的だけで公開間隔を分けない"
  - "基礎ノードを先に公開し、その上に応用ノードを積む"
  - "prerequisitesが公開済みのノードを優先する"
  - "同一テーマの薄い記事を大量公開しない"
  - "公開後に内部リンクと404を自動検証する"
  - "ニュースは時刻優先、エバーグリーンは知識依存順を優先する"

qualityGate:
  required:
    - "Center Questionに回答している"
    - "必要な前提知識への導線がある"
    - "重要な事実の一次情報を確認している"
    - "重複記事がない"
    - "内部参照IDがすべて存在する"
    - "公開済みリンクに404がない"
  wordCountRule: "固定しない"

coreCurriculum:
  file: "core-curriculum.yml"
  targetArticleCount: 100
  batchCount: 10
  articlesPerBatch: 10
  ordering: "dependency-first"
  autoSchedule: false
  approvedQueueAutoPublish: true
  note: "Core Curriculumの制作順と公開順を分離。審査済み記事をpublishOnで予約し、毎日20:00 JSTに1本ずつ安全ゲートを経て公開する"
  unpublishedLinkPolicy: "URLリンクを生成せず、必要時のみ準備中として非リンク表示する"
  releaseGate: "readyかつapproved-for-publicationの正式記録とpublishOnを持ち、予定日到達・前提公開済・品質ゲート合格のノードのみ対象。日付あたり1本を上限にする。本人合格と証拠付き編集監査を区別する"
