criticalClaims:
  - claim: "Amazon Bedrock Knowledge BasesのRetrieveは質問に関連する元データのチャンクを返し、元データのlocation・metadata・scoreも取得できる。"
    sourceUrl: "https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-retrieve.html"
    sourceEvidence: "公式『Query a knowledge base and retrieve data』API節の retrievalResults は content、metadata、location、score などを返すと明記。Retrievalと生成を分けて試せる手順も同ページにある。"
    verified: true
  - claim: "RAGの代表構成ではユーザー質問をEmbeddingにして近いチャンクを検索し、そのチャンクでLLM入力を拡張して回答する。"
    sourceUrl: "https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html"
    sourceEvidence: "Amazon Bedrock『Runtime execution』は質問のベクトル化、vector indexで類似チャンク検索、得たcontextをpromptに追加してmodelへ送る順序を記述。"
    verified: true
  - claim: "Azure AI SearchのHybrid Searchはキーワードとベクトルの結果を統合し、RRFにより一つの検索順位へまとめる。"
    sourceUrl: "https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview"
    sourceEvidence: "Microsoft Learn『How does hybrid search work?』でBM25 text queryとvector queryから得た順位をRRFで統合すると説明。本文はスコアを単純加算しない点に限定。"
    verified: true
  - claim: "RRFは検索結果の各順位から逆数に基づく順位点を作り、同じ文書の点を合計する。"
    sourceUrl: "https://learn.microsoft.com/en-us/azure/search/hybrid-search-ranking"
    sourceEvidence: "Microsoft Learn『How RRF ranking works』は各候補の rank に対する 1/(rank+k) を算出して統合すると説明。記事は計算式でなく『順位にもとづく合算』として記述。"
    verified: true
  - claim: "Amazon Bedrockで返すソースチャンク件数は最大数の指定で、指定値より少ない件数が返る場合がある。"
    sourceUrl: "https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html"
    sourceEvidence: "AWS『Configure and customize queries and response generation』はnumberOfResultsが返す結果の最大値で、設定値より少なくなる場合があると注記。"
    verified: true
  - claim: "Azure AI Searchではメタデータの文字・数値フィルタとpreFilter/postFilterの使い分けがあり、postFilterで適合文書の見落としが起きうる。"
    sourceUrl: "https://learn.microsoft.com/en-us/azure/search/vector-search-filters"
    sourceEvidence: "Microsoft Learn『How filtering works in vector queries』でfilterable nonvector fields、preFilter/postFilterの順序、特にpostFilterでsmall kやselective filter時にfalse negativesが起こりうると明記。"
    verified: true
  - claim: "最初の検索結果は別の意味理解モデルで再順位付けできる。"
    sourceUrl: "https://learn.microsoft.com/en-us/azure/search/semantic-search-overview"
    sourceEvidence: "Microsoft Learn『What is semantic ranking?』はBM25またはRRFで得たinitial resultsの後にdeep-learning semantic rankerによるsecondary rankingを適用すると説明。"
    verified: true
  - claim: "RAGの検索品質評価と最終回答のGroundedness/Relevance評価は別の工程として扱われる。"
    sourceUrl: "https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"
    sourceEvidence: "Microsoft Foundry『System evaluation』『Process evaluation』でRetrieval/Document RetrievalとGroundedness/Relevanceの評価を明確に分離。"
    verified: true
