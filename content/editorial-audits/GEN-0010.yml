criticalClaims:
  - claim: "文書のチャンクはEmbeddingモデルがベクトルへ変換し、元文書とのマッピングを維持してベクトル索引に登録できる。質問もベクトル化し類似するチャンクを検索してLLMへ渡す。"
    sourceUrl: "https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html"
    sourceEvidence: "AWS Bedrock公式『Pre-processing unstructured data』『Runtime execution』に『chunks are then converted to embeddings and written to a vector index, while maintaining a mapping to the original document』、質問のベクトル化からindex queryingとLLMへの文書追加までの図解がある。架空の町内会例と明確に区別。"
    verified: true
  - claim: "Azure AI Searchはベクトルのインデックス保存、類似性検索、テキスト・数値のmetadata filtering、キーワード検索と組み合わせるhybrid queryが可能。"
    sourceUrl: "https://learn.microsoft.com/en-us/azure/search/vector-search-overview"
    sourceEvidence: "Microsoft Learn『Vector Search Overview』のvector indexing/storing/query、metadata filters、hybrid search節は用途を詳述。対象が独立専用DBである必要はない点もAzure AI Searchの公式例で支持。"
    verified: true
  - claim: "質問のEmbeddingは登録文書と同じEmbeddingモデルで生成するのがベストプラクティスで、クエリの数値と文書の数値の互換性が重要。"
    sourceUrl: "https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-query"
    sourceEvidence: "Microsoft『Create a Vector Query』の『Convert a query string input into a vector』は『As a best practice, always use the same embedding models used to generate embeddings in the source documents』と明記。次元と表現の互換性を確認せず異なるモデルを混ぜない説明と対応。"
    verified: true
  - claim: "ベクトル検索には全件比較するexhaustive kNNと、効率を上げる近似最近傍ANN/HNSWがあり、近似方式は速度とRecallのトレードオフを持つ。"
    sourceUrl: "https://learn.microsoft.com/en-us/azure/search/vector-search-ranking"
    sourceEvidence: "Microsoft『Vector Relevance and Ranking』はExhaustive KNNをbrute force scanと、HNSWをapproximate nearest neighbor ANNと説明。pgvector公式READMEもexact default/approximate index trades recall for speedを明示。記事ではANNが必ず完全な最短候補を返すと誤認させない。"
    verified: true
  - claim: "PostgreSQLのpgvector拡張はL2距離、コサイン距離、内積などの検索と、HNSW/IVFFlatの近似索引を提供する。"
    sourceUrl: "https://github.com/pgvector/pgvector"
    sourceEvidence: "pgvector公式リポジトリREADMEの『Querying』はL2、inner product、cosine distance等の演算子を列挙。『Indexing』はexact nearest neighborがデフォルト、HNSWとIVFFlat approximate indexが可能であることを明記。"
    verified: true
  - claim: "ベクトル類似度の上位結果と最新版や閲覧権限の正しさは別であり、テキスト・数値のfilterable metadataを検索の前後に適用する設計がある。"
    sourceUrl: "https://learn.microsoft.com/en-us/azure/search/vector-search-filters"
    sourceEvidence: "Microsoft『Vector Query Filters』のOverviewではvector field itself not filterable、nonvector fieldへフィルタ、preFilter/postFilter/strictPostFilterのモードを説明。資料版と権限の例は記事側の架空ユースケースであり、自動的に新版が選ばれると断言していない。"
    verified: true
