criticalClaims:
  - claim: "RAGではモデルに格納された知識と検索による外部知識を組み合わせて文章生成し、原論文ではRetrievalとGeneratorの微調整も研究された。"
    sourceUrl: "https://arxiv.org/abs/2005.11401"
    sourceEvidence: "Lewis et al. 2020のAbstractとIntroduction、およびMethods 2.4: parametric memory（seq2seq model）とnon-parametric memory（Wikipedia dense vector index）の併用、retrieverとgeneratorのjoint fine-tuningについて明記。記事の『RAGでは学習を一切しないとは限らない』を支持。"
    verified: true
  - claim: "RAGは質問に関係する外部資料をRetrieveで検索し、Augmentで資料を質問に加え、GenerateでLLMが回答を作る三段階として説明できる。"
    sourceUrl: "https://learn.microsoft.com/en-ca/azure/foundry/concepts/retrieval-augmented-generation?view=foundry-classic"
    sourceEvidence: "Microsoft Foundry公式『What is RAG?』『How does RAG work?』はRetrieve/Augment/Generateの三段階と、資料をモデル入力に追加するGroundingの説明を明示。Indexにはkeyword/vector/hybrid等があり、RAGとfine-tuningの用途も区別。"
    verified: true
  - claim: "代表的なRAGの検索実装では、ユーザー質問をベクトル化し、文書チャンクのベクトル索引から近い部分を探して入力コンテキストへ追加する。"
    sourceUrl: "https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html"
    sourceEvidence: "AWS公式『Runtime execution』は、質問をembedding modelでvector化、vector indexからsemantic similar chunksを取得し、元の質問に文書contextを追加したpromptをmodelへ渡して回答生成すると記載。この記事では『代表的な一方式』として扱い、全RAG必須とはしていない。"
    verified: true
  - claim: "RAG用の情報準備には文書のチャンク化を用いることがあり、検索にはキーワードとベクトルを組み合わせるハイブリッド方式もある。"
    sourceUrl: "https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview?tabs=docs"
    sourceEvidence: "Microsoft Azure AI Search公式『Content preparation for RAG』『Maximize relevance and recall』はautomatic chunking、vectorization、keywordとvectorを組み合わせるhybrid queries、semantic rankingを明記。記事の該当箇所は適用条件のある実装例として扱っている。"
    verified: true
  - claim: "RAGでも検索結果が古い・不完全なら誤答しうるほか、検索対象にはアクセス制限が必要で、取得文書は信頼できない入力として扱うべきである。"
    sourceUrl: "https://learn.microsoft.com/en-ca/azure/foundry/concepts/retrieval-augmented-generation?view=foundry-classic"
    sourceEvidence: "Microsoft Foundry公式『Security and privacy considerations』『Limitations and troubleshooting』はpermission filtering、treat retrieved content as untrusted input、prompt injection、hallucination despite grounding、incomplete passages leading to inaccurate answersを挙げる。古いお知らせ例は架空と明記。"
    verified: true
