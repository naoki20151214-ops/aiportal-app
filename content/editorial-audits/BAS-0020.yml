criticalClaims:
  - claim: "Multi-Head Attentionは同じ入力に異なる学習済みQ/K/V投影を適用し、並列Headの出力を連結し出力変換に通す。"
    sourceUrl: "https://arxiv.org/abs/1706.03762"
    sourceEvidence: "原著論文3.2.2節はqueries/keys/valuesを異なる学習済み線形変換でh回投影し、並列Attentionを実行後にConcatと追加の学習済み投影W^Oを適用すると明記する。"
    verified: true
  - claim: "各HeadのAttentionを使うSelf-Attentionはマスクによって参照位置を制限でき、未来の位置を参照しないcausal設定がある。"
    sourceUrl: "https://docs.pytorch.org/docs/stable/generated/torch.nn.MultiheadAttention.html"
    sourceEvidence: "PyTorchの公式nn.MultiheadAttention API forwardはattn_maskで位置ごとの参照を制限し、is_causalでcausal maskを扱う。またnum_headsは並列Attention Head数と記載する。"
    verified: true
  - claim: "Head数を増やせば必ず正確になるわけではなく、複数Headは異なる表現空間から情報をまとめる仕組みである。"
    sourceUrl: "https://arxiv.org/abs/1706.03762"
    sourceEvidence: "原著論文3.2.2節は表現部分空間の情報を同時に参照できる利点を述べ、モデル変種のTable 3ではHead数が多すぎると品質が下がる実験結果を示している。"
    verified: true
