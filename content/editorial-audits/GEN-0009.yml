criticalClaims:
  - claim: "Chunkingは長い資料の入力Token数制限に対応し、複数話題を持つ文書から関連部分を検索しやすくするために使うが、すべての文書で必須というわけではない。"
    sourceUrl: "https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"
    sourceEvidence: "Microsoft Learn公式『Chunk large documents for RAG and vector search』冒頭は入力Token制限とチャンクの利用を説明し『Chunking is only required if the source documents are too large...but also beneficial if content is poorly represented as a single vector』と区別する。全件必須と断定しない記事文と一致。"
    verified: true
  - claim: "固定長、句読点・見出し等の文章構造、意味単位で分割する方法があり、固定長チャンク間で文章を重ねるOverlapは文脈の断絶を減らす。"
    sourceUrl: "https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"
    sourceEvidence: "Microsoft Learn同ページのCommon chunking techniques表はFixed-size、Variable-sized headings/paragraphs、Semantic、Custom combinationsを列挙。Content overlap considerations節は前後の連続性のための重複と重複過多を避ける調整を説明する。"
    verified: true
  - claim: "Microsoftの公式文書には512 Tokenと25％ overlapを試し始める例があるが、最適な重複とサイズは文書の種類や質問などに依存する。"
    sourceUrl: "https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"
    sourceEvidence: "Content overlap considerations節は『starting with a chunk size of 512 tokens...initial overlap of 25%』と記し『optimal overlap might vary depending on your content type and use case』とも明記。記事では製品公式の起点例と明示し日本語全文書への固定解としては使わない。"
    verified: true
  - claim: "Amazon Bedrockは固定長、分割なし、階層型、意味単位のテキスト分割を用意し、階層型では小さな子チャンクを検索後に広い親チャンクへ置き換える。"
    sourceUrl: "https://docs.aws.amazon.com/ja_jp/bedrock/latest/userguide/kb-chunking.html"
    sourceEvidence: "AWS日本語『ナレッジベースのコンテンツのチャンキングの仕組み』の標準・階層・セマンティック各節に、固定長・無分割、子チャンクがまず取得されより広い親チャンクへ置換、意味区分に伴う追加コストが明記される。"
    verified: true
  - claim: "ベクトル検索の索引では元文書をチャンクID・親ID・本文・タイトル・ベクトルで関連付けて管理し、RAG質問時に小さな検索対象を取得できる。"
    sourceUrl: "https://learn.microsoft.com/en-us/azure/search/vector-store"
    sourceEvidence: "Microsoft Azure AI Search公式『Vector index overview』のWizard-generated index schemaはchunk_id,parent_id,chunk,title,vectorのフィールド例を公開。元資料への出典・版管理のためのメタデータの重要性を示す文脈と対応。"
    verified: true
  - claim: "AWS BedrockのChunking APIではNONE、FIXED_SIZE、HIERARCHICAL、SEMANTICの各strategyを区別し、データソースに応じて方式を選ぶ。"
    sourceUrl: "https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent_ChunkingConfiguration.html"
    sourceEvidence: "公式APIReference ChunkingConfigurationのchunkingStrategy enumはFIXED_SIZE、NONE、HIERARCHICAL、SEMANTICを列挙。それぞれの説明は固定長、親子二段階、NLP意味単位、無分割。本文の四方式との対応を確認。"
    verified: true
