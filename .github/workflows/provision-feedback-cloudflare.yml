name: Prepare AI Portal Feedback Cloudflare Resources

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      environment:
        description: "Cloudflare Pages target; preview first"
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
      operation:
        description: "plan is safe; audit read-only; stage creates D1/Turnstile for votes and comments, both OFF"
        required: true
        type: choice
        options:
          - plan
          - audit
          - stage
        default: plan

permissions:
  contents: read

concurrency:
  group: aiportal-cloudflare-feedback-setup
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.repository == 'naoki20151214-ops/aiportal-app' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.actor == 'naoki20151214-ops' &&
        github.event.issue.number == 144 &&
        github.event.comment.body == '/feedback-stage-preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Cloudflare resources (never enable public feedback or comments)
        env:
          CLOUDFLARE_FEEDBACK_API_TOKEN: ${{ secrets.CLOUDFLARE_FEEDBACK_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fd4fe7df0d653a3c4c5969244430f6e2
          CLOUDFLARE_PAGES_PROJECT: aiportal-app
          MODE: ${{ github.event_name == 'issue_comment' && 'stage' || inputs.operation }}
          TARGET: ${{ github.event_name == 'issue_comment' && 'preview' || inputs.environment }}
        run: |
          node scripts/provision-cloudflare-feedback.mjs --mode="$MODE" --environment="$TARGET"
