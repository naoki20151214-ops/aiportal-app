name: Prepare AI Portal Feedback Cloudflare Resources

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      environment:
        description: "Cloudflare Pages target; preview first"
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
      operation:
        description: "plan, audit, stage, one-time Production comments smoke test, restore-off, or Preview E2E"
        required: true
        type: choice
        options:
          - plan
          - audit
          - stage
          - production-test-on
          - restore-off
          - preview-test
        default: plan
      preview_commit:
        description: "Full source commit SHA for the successful Cloudflare Pages Preview deployment (preview-test only)"
        required: false
        type: string
      production_test_note:
        description: "Exact synthetic note to delete during Production restore-off; never logged"
        required: false
        type: string
      production_baseline_rows:
        description: "Pre-test Production reader_comments row count for exact restore verification"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: aiportal-cloudflare-feedback-setup
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.repository == 'naoki20151214-ops/aiportal-app' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.actor == 'naoki20151214-ops' &&
        github.event.issue.number == 144 &&
        github.event.comment.body == '/feedback-stage-preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify operation scope
        env:
          MODE: ${{ github.event_name == 'issue_comment' && 'stage' || inputs.operation }}
          TARGET: ${{ github.event_name == 'issue_comment' && 'preview' || inputs.environment }}
          PREVIEW_COMMIT_SHA: ${{ inputs.preview_commit }}
          PRODUCTION_TEST_NOTE: ${{ inputs.production_test_note }}
          PRODUCTION_BASELINE_ROWS: ${{ inputs.production_baseline_rows }}
        run: |
          if [ "$MODE" = "preview-test" ] && [ "$TARGET" != "preview" ]; then
            echo "Preview E2E is restricted to the Preview environment."
            exit 1
          fi
          if [ "$MODE" = "preview-test" ] && ! [[ "$PREVIEW_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Preview E2E requires a full source commit SHA."
            exit 1
          fi
          if [ "$MODE" = "production-test-on" ] && [ "$TARGET" != "production" ]; then
            echo "Production smoke test is restricted to the Production environment."
            exit 1
          fi
          if [ "$MODE" = "production-test-on" ] && { [ -z "$PRODUCTION_BASELINE_ROWS" ] || ! [[ "$PRODUCTION_BASELINE_ROWS" =~ ^[0-9]+$ ]]; }; then
            echo "Production smoke test requires the verified baseline row count."
            exit 1
          fi
          if [ "$MODE" = "restore-off" ] && [ "$TARGET" != "production" ]; then
            echo "Restore-off is restricted to the Production environment."
            exit 1
          fi
      - name: Cloudflare resources and guarded smoke test
        if: inputs.operation != 'preview-test'
        env:
          CLOUDFLARE_FEEDBACK_API_TOKEN: ${{ secrets.CLOUDFLARE_FEEDBACK_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fd4fe7df0d653a3c4c5969244430f6e2
          CLOUDFLARE_PAGES_PROJECT: aiportal-app
          PRODUCTION_TEST_NOTE: ${{ inputs.production_test_note }}
          PRODUCTION_BASELINE_ROWS: ${{ inputs.production_baseline_rows }}
          PRODUCTION_EXPECTED_MAIN_SHA: ${{ github.sha }}
          MODE: ${{ github.event_name == 'issue_comment' && 'stage' || inputs.operation }}
          TARGET: ${{ github.event_name == 'issue_comment' && 'preview' || inputs.environment }}
        run: |
          node scripts/provision-cloudflare-feedback.mjs --mode="$MODE" --environment="$TARGET"
      - name: Isolated Preview Turnstile and D1 end-to-end test
        if: inputs.operation == 'preview-test' && inputs.environment == 'preview'
        env:
          CLOUDFLARE_FEEDBACK_API_TOKEN: ${{ secrets.CLOUDFLARE_FEEDBACK_API_TOKEN }}
          PREVIEW_COMMIT_SHA: ${{ inputs.preview_commit }}
        run: node scripts/preview-reader-comment-e2e.mjs
