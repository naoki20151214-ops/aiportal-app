name: Publish Approved AI News Immediately (no reservation or daily cap)
on:
  # Primary trigger: a reviewed PR merges a new immutable owner-approved
  # READY news row into main. Never wait for the old 09:00/18:00 clocks.
  push:
    branches: [main]
    paths:
      - 'content/news/news-approval-queue.yml'
  schedule:
    - cron: '11 0-14,22-23 * * *' # fallback watchdog, only already approved news
    - cron: '41 0-14,22-23 * * *' # independent fallback; push still publishes immediately
  workflow_dispatch: # optional recovery, same immutable approved-text/image/source gate

permissions:
  contents: write

concurrency:
  group: aiportal-approved-publication-main
  cancel-in-progress: false

jobs:
  news:
    if: github.repository == 'naoki20151214-ops/aiportal-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare only locally approved news images
        run: node scripts/prepare-news-media.mjs
      - name: Promote all currently approved ready news (no daily cap, no waiting)
        id: release
        run: node scripts/publish-news-queue.mjs --apply-immediate
      - name: Test and validate immutable news archive
        if: steps.release.outputs.changed == 'true'
        run: |
          npm test
          npm run news:archive:check
      - name: Lint
        if: steps.release.outputs.changed == 'true'
        run: npm run lint
      - name: Build static site
        if: steps.release.outputs.changed == 'true'
        run: npm run build
      - name: Commit validated news and archive to main
        if: steps.release.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- content/articles/ content/registry/knowledge-nodes.yml content/news/news-approval-queue.yml content/news/news-archive.json content/news/news-archive.csv src/generated/published-article-slugs.ts
          git diff --cached --quiet && exit 0
          git commit -m "Publish immutable owner-approved AI news immediately"
          git push origin HEAD:main
      - name: Report without creating filler news
        if: always()
        run: |
          echo "Push delivery publishes only previously owner-approved ready news; cron is a fallback, not a reservation."
          echo "Original immutable article and WebP SHA, source, duplicate/CTA and CI checks remain mandatory. No daily cap."
