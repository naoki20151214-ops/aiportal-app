name: AI News Candidate Intake (private and read-only)

on:
  schedule:
    - cron: '0 0-14,22-23 * * *' # once per JST hour from 07:00 through 23:00 (private RSS metadata only)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiportal-news-intake
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'naoki20151214-ops/aiportal-app'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check production news CLI syntax before external requests
        run: |
          node --check scripts/collect-news-candidates.mjs
          node --check scripts/check-news-primary-pages.mjs
          node --check scripts/triage-news-evidence.mjs
          node --check scripts/build-news-editorial-brief.mjs
          node --check scripts/publish-news-queue.mjs
          node --check scripts/news-autonomous-shadow.mjs
          node --check scripts/news-autonomous-shadow-core.mjs

      - name: Collect only unverified official RSS metadata
        run: node scripts/collect-news-candidates.mjs --lookback-hours=72
      - name: Save private intake evidence, not public content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-candidates-${{ github.run_id }}
          path: artifacts/news-candidates.json
          if-no-files-found: warn
          retention-days: 14

      - name: Inspect official pages for private editorial evidence only
        run: node scripts/check-news-primary-pages.mjs
      - name: Save private primary-source evidence (never approved)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-primary-evidence-${{ github.run_id }}
          path: artifacts/news-primary-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Triage candidate metadata for private human editorial review
        if: success()
        run: node scripts/triage-news-evidence.mjs
      - name: Format Japanese human-review brief (no AI approval)
        if: success()
        run: node scripts/build-news-editorial-brief.mjs
      - name: Independently prioritize official candidate RESEARCH (shadow; no drafts or approvals)
        if: success()
        run: node scripts/news-autonomous-shadow.mjs
      - name: Save private autonomous research shortlist, never publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-autonomous-shadow-${{ github.run_id }}
          path: artifacts/news-autonomous-research-shadow.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save human-readable unverified candidate brief
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-editorial-brief-${{ github.run_id }}
          path: artifacts/news-editorial-brief.md
          if-no-files-found: warn
          retention-days: 14
      - name: Save private draft-only editorial triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-editorial-triage-${{ github.run_id }}
          path: artifacts/news-editorial-triage.json
          if-no-files-found: warn
          retention-days: 14

      - name: Record failed intake as an incident requiring investigation
        if: failure()
        run: |
          {
            echo '## AI Portal: incident investigation required'
            echo "- Failed workflow: ${GITHUB_WORKFLOW}"
            echo "- GitHub run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit SHA: ${GITHUB_SHA}"
            echo '- Root cause: not yet determined from a failure exit status alone'
            echo '- Required: record observed error, direct cause, systemic cause, recurrence regression, CI proof, and production repeat proof in content/news/news-incident-register.json'
            echo '- Do not claim the failed run succeeded or publish unverified stories.'
          } >> "$GITHUB_STEP_SUMMARY"
