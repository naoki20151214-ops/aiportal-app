name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check live article inventory and block duplicate drafting
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run article:ci -- --pr=${{ github.event.pull_request.number }}

      - name: Validate pending delegated editorial audits
        run: node scripts/validate-delegated-editorial-audits.mjs

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Save audited production inventory
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: article-production-inventory-${{ github.run_id }}
          path: artifacts/article-inventory.*
          if-no-files-found: warn
          retention-days: 30
