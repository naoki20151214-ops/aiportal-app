name: Verify New Official RSS Source (read only)
on:
  pull_request:
    paths:
      - 'content/news/sources.json'
      - 'scripts/probe-news-rss-source.mjs'
      - '.github/workflows/verify-new-news-rss.yml'
permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'naoki20151214-ops/aiportal-app' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source: [openai, deepmind, google-ai, aws-ai, microsoft, huggingface, microsoft-security, mit-ai, meta-engineering, cloudflare-blog]
    steps:
      - name: Checkout reviewed PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate probe CLI syntax
        run: node --check scripts/probe-news-rss-source.mjs
      - name: Independently verify publisher RSS and dated official links
        run: node scripts/probe-news-rss-source.mjs ${{ matrix.source }}
      - name: Save evidence; never approve or publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-rss-${{ matrix.source }}-${{ github.run_id }}
          path: artifacts/news-rss-onboarding-${{ matrix.source }}.json
          retention-days: 14
          if-no-files-found: warn

  live-intake:
    if: github.repository == 'naoki20151214-ops/aiportal-app' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository read only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Collect ten official feeds using actual production collector
        id: rss
        continue-on-error: true
        run: node scripts/collect-news-candidates.mjs --lookback-hours=72
      - name: Fetch official primary pages using actual production code
        id: primary
        if: steps.rss.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-news-primary-pages.mjs
      - name: Print private intake metrics only
        if: always()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p="artifacts/news-candidates.json";
            if (fs.existsSync(p)) {
              const x=JSON.parse(fs.readFileSync(p,"utf8"));
              console.log("RSS LIVE:",JSON.stringify({sourceCount:x.sourceResults?.length,bySource:x.sourceResults,eligibleCandidates:x.candidates?.length,exactDuplicateCount:x.exactDuplicateCount,publishingEnabled:x.publishingEnabled}));
            } else console.log("RSS LIVE: no usable report");
            const q="artifacts/news-primary-evidence.json";
            if(fs.existsSync(q)){
              const y=JSON.parse(fs.readFileSync(q,"utf8"));
              console.log("PRIMARY LIVE:",JSON.stringify(y.summary));
              console.log("PUBLISHING/VERIFICATION:",JSON.stringify({publishingEnabled:y.publishingEnabled,editorialApprovals:y.editorialApprovals,primaryClaimVerification:y.primaryClaimVerification}));
            } else console.log("PRIMARY LIVE: no evidence report");
          '
      - name: Save private RSS intake diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ten-source-intake-${{ github.run_id }}
          path: |
            artifacts/news-candidates.json
            artifacts/news-primary-evidence.json
          retention-days: 3
          if-no-files-found: warn
