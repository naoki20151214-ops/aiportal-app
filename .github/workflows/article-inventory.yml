name: Article Production Inventory & Start Gate

on:
  workflow_dispatch:
  schedule:
    # 09:00 JST daily; never writes to or deploys main.
    - cron: '0 0 * * *'
  pull_request:
    paths:
      - 'content/articles/**'
      - 'content/registry/**'
      - '.github/article-reuse/**'
      - 'scripts/article-workflow.mjs'
      - 'scripts/article-inventory-core.mjs'
      - 'tests/article-workflow-gate.test.ts'

permissions:
  contents: read
  pull-requests: read

jobs:
  inventory-and-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit all retained branches, generate management table and guard new articles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            npm run article:ci -- --pr=${{ github.event.pull_request.number }}
          else
            npm run article:inventory
          fi
      - name: Preserve reports even when the guard blocks a PR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-production-inventory-${{ github.run_id }}
          path: artifacts/article-inventory.*
          if-no-files-found: warn
          retention-days: 30
