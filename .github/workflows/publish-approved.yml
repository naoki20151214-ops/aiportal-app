name: Publish Editor-Approved Articles
on:
  schedule:
    - cron: '0 11 * * *' # primary 20:00 JST learning article
    - cron: '29 11 * * *' # 20:29 JST fallback; publication itself is idempotent
  workflow_dispatch: # incident recovery; same publishOn and max-one-per-day rules
permissions:
  contents: write
concurrency:
  group: aiportal-approved-publication-main
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'naoki20151214-ops/aiportal-app'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify delegated editorial audit provenance
        run: node scripts/validate-delegated-editorial-audits.mjs
      - name: Promote at most one date-due, approved and dependency-safe article
        id: approve
        run: node scripts/auto-publish-approved.mjs --apply
      - name: Run all tests
        if: steps.approve.outputs.changed == 'true'
        run: npm test
      - name: Lint
        if: steps.approve.outputs.changed == 'true'
        run: npm run lint
      - name: Build static site
        if: steps.approve.outputs.changed == 'true'
        run: npm run build
      - name: Commit and push only validated publication changes
        if: steps.approve.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles content/registry/knowledge-nodes.yml content/registry/article-approval-log.yml src/generated/published-article-slugs.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Publish articles upon recorded editorial acceptance'
          git push origin HEAD:main
      - name: Report queued and deferred accepted articles
        run: node scripts/auto-publish-approved.mjs
